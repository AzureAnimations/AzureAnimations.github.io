<!DOCTYPE html>
<html lang="en">
<head>
	<script src="/js/tracking.js"></script>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<meta name="description" content="Microsoft Copilot Studio in action — real-world use cases for the Contoso Support agent: customer support, employee help desk, sales & store info, extending Microsoft 365 Copilot, and autonomous back-office, plus the build→measure→scale loop." />
	<title>Copilot Studio — Copilot Studio in Action (Use Cases) · Azure Animations</title>

	<link rel="stylesheet" href="https://unpkg.com/@microsoft/atlas-css/dist/index.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

	<!-- AnimationWorks shared lib (one level under static/v2/ → ../lib/) -->
	<script src="../lib/js/aw-easings.js"></script>
	<script src="../lib/js/aw-motion.js"></script>
	<script src="../lib/js/aw-theme.js"></script>

<style>
	/* ── SHELL ─────────────────────────────── */
	:root {
		--aw-purple:#5c2d91; --aw-blue:#0078d4; --aw-green:#10a37f; --aw-orange:#e97526; --aw-pink:#d24aa8;
		--aw-cyan:#00b7c3;
	}
	html, body { height:100%; margin:0; }
	html { font-size:100%; }
	body {
		display:flex; flex-direction:column; height:100vh;
		overflow:hidden;
		font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
		color: var(--theme-text);
		background:
			radial-gradient(circle at 15% 20%, rgba(92,45,145,0.18) 0%, transparent 55%),
			radial-gradient(circle at 85% 80%, rgba(0,120,212,0.18) 0%, transparent 55%),
			var(--theme-body-background);
	}
	.app-header { display:flex; align-items:center; gap:1rem; flex-shrink:0; flex-wrap:wrap; font-size:16px; }

	#stage {
		position:relative; flex:1 1 auto; width:100%; min-height:0;
		display:flex; align-items:center; justify-content:center;
		overflow:hidden; container-type:size;
		padding:1.75rem 2.75rem 5rem;
	}
	#stage:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible {
		outline:2px solid var(--theme-primary, #0078d4); outline-offset:3px; border-radius:4px;
	}
	#stage-frame {
		position:relative; overflow:hidden;
		width: min(100cqw, calc(100cqh * 16 / 9));
		aspect-ratio: 16 / 9; max-width:100%; max-height:100%;
		border-radius:16px;
		background: rgba(0,0,0,0.015);
		box-shadow: 0 12px 44px rgba(0,0,0,0.22);
	}
	body.theme-dark #stage-frame { background: rgba(255,255,255,0.025); }
	#stage-frame::before {
		content:""; position:absolute; inset:0; border-radius:inherit; padding:2.5px;
		background: linear-gradient(135deg, var(--aw-purple) 0%, var(--aw-blue) 55%, var(--aw-pink) 100%);
		-webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
		mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
		-webkit-mask-composite: xor; mask-composite: exclude;
		pointer-events:none; z-index:20;
	}
	#fx-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; overflow:visible; }

	/* ── SCENE ─────────────────────────────── */
	.scene {
		position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
		transform-origin:center center;
		width:min(1150px, 96%); z-index:10;
		display:flex; flex-direction:column; align-items:center; gap:1.4rem;
	}
	@keyframes awSceneIn { from { opacity:0; } to { opacity:1; } }
	@keyframes awSceneOut { from { opacity:1; } to { opacity:0; } }
	.scene.scene-in { animation: awSceneIn 0.2s ease both; }
	.scene.scene-out { animation: awSceneOut 0.2s ease both; }
	.scene-title { font-size:2.5rem; font-weight:700; color:var(--theme-tertiary, #5c2d91); margin:0; text-align:center; opacity:0; }
	body.theme-dark .scene-title { color:#c9a5e8; }
	.scene-lead { margin:0; text-align:center; font-size:1.35rem; color:var(--theme-text); max-width:900px; line-height:1.5; opacity:0; }

	/* ── CALLOUT ───────────────────────────── */
	.callout {
		position:absolute; max-width:340px; padding:1rem 1.2rem;
		background:var(--theme-body-background); border:1px solid var(--theme-border);
		border-left:4px solid var(--theme-tertiary, #5c2d91); border-radius:6px;
		box-shadow: var(--theme-box-shadow-medium, 0 4px 16px rgba(0,0,0,0.2));
		font-size:1.05rem; line-height:1.45; z-index:14; opacity:0;
	}

	/* ══ REUSABLE BUILDING BLOCKS ══ */
	.card {
		width:min(680px, 96%); padding:1.6rem 1.8rem; border-radius:16px;
		background:var(--theme-card-background, #fff); border:2px solid var(--theme-border);
		box-shadow:0 8px 28px rgba(0,0,0,0.14); opacity:0;
		display:flex; flex-direction:column; gap:0.6rem; align-items:center; text-align:center;
	}
	body.theme-dark .card { background:rgba(255,255,255,0.05); }
	.card .card-icon { font-size:3rem; line-height:1; color:var(--theme-tertiary,#5c2d91); }
	.card .card-h { font-size:1.4rem; font-weight:700; }
	.card .card-p { font-size:1.05rem; color:var(--theme-text-subtle); line-height:1.5; }

	.ta-card {
		width:min(1000px, 98%); border:1.5px solid var(--theme-border); border-radius:14px;
		background:var(--theme-card-background, #fff); box-shadow:0 8px 30px rgba(0,0,0,0.16);
		padding:1.1rem 1.3rem; opacity:0;
	}
	body.theme-dark .ta-card { background:rgba(255,255,255,0.05); }
	.ta-card-head {
		display:flex; align-items:center; justify-content:center; gap:0.5rem;
		font-size:1rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em;
		color:var(--theme-text-subtle); margin-bottom:0.6rem;
	}
	.ta-card-head .ic { color:var(--theme-tertiary,#5c2d91); }
	.ta-card-text { font-size:1.22rem; line-height:1.55; color:var(--theme-text); text-align:center; }

	.chip-row { display:flex; flex-wrap:wrap; gap:0.7rem; justify-content:center; }
	.pill {
		display:inline-flex; align-items:center; gap:0.5rem; padding:0.55rem 1.1rem;
		border-radius:999px; font-size:1.05rem; font-weight:600;
		border:2px solid var(--theme-tertiary, #5c2d91); background:rgba(92,45,145,0.08);
		color:var(--theme-text); opacity:0;
	}
	body.theme-dark .pill { background:rgba(92,45,145,0.2); }
	.pill .ic { color:var(--theme-tertiary,#5c2d91); }
	.value-chip {
		display:inline-flex; align-items:center; gap:0.4rem; padding:0.5rem 1rem;
		border-radius:999px; font-size:1rem; font-weight:700;
		border:2px solid #107c10; background:rgba(16,124,16,0.08);
		color:var(--theme-text); opacity:0;
	}
	body.theme-dark .value-chip { background:rgba(16,124,16,0.16); }
	.value-chip .ic { color:#10a37f; }
	.recap-foot { font-size:1.05rem; color:var(--theme-text); text-align:center; max-width:860px; opacity:0; }
	.recap-foot a { color:var(--aw-blue, #0078d4); font-weight:700; text-decoration:underline; }
	body.theme-dark .recap-foot a { color:#5aa9ff; }

	.agent-node {
		display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.2rem;
		width:160px; height:160px; border-radius:24px;
		background: linear-gradient(135deg, rgba(92,45,145,0.12), rgba(0,120,212,0.12));
		border:2.5px solid var(--theme-tertiary, #5c2d91);
		box-shadow:0 8px 28px rgba(92,45,145,0.2); flex-shrink:0; text-align:center; padding:0.4rem;
	}
	.agent-node .an-icon { font-size:2.8rem; line-height:1; color:var(--theme-tertiary,#5c2d91); }
	.agent-node .an-label { font-size:1.15rem; font-weight:700; color:var(--theme-text); }
	.agent-node .an-sub { font-size:1rem; color:var(--theme-text-subtle); line-height:1.34; }
	.ta-flow { display:flex; align-items:center; justify-content:center; gap:1.2rem; flex-wrap:wrap; width:100%; }
	.ta-flow .agent-node { width:185px; height:182px; }
	.ta-arrow { font-size:1.9rem; color:var(--theme-tertiary,#5c2d91); opacity:0; }
	.ta-arrow.is-big { font-size:3rem; }
	@media (max-width:760px) { .ta-flow .ta-arrow { transform:rotate(90deg); } }

	.uc-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:1.1rem; width:min(980px,96%); }
	@media (max-width:720px) { .uc-grid { grid-template-columns:1fr; } }
	.uc-card {
		display:flex; flex-direction:column; gap:0.5rem; padding:1rem 1.15rem;
		border:1.5px solid var(--theme-border); border-top:4px solid var(--theme-primary,#0078d4);
		border-radius:14px; background:var(--theme-card-background, #fff);
		box-shadow:0 6px 22px rgba(0,0,0,0.12); opacity:0;
		transition:transform 0.2s ease, box-shadow 0.2s ease;
	}
	.uc-card:hover { transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.18); }
	body.theme-dark .uc-card { background:rgba(255,255,255,0.05); }
	.uc-card[data-uc="a"] { border-top-color:#0078d4; }
	.uc-card[data-uc="b"] { border-top-color:#10a37f; }
	.uc-card[data-uc="c"] { border-top-color:#e97526; }
	.uc-card[data-uc="d"] { border-top-color:#d24aa8; }
	.uc-head { display:flex; align-items:center; gap:0.55rem; font-size:1.25rem; font-weight:700; color:var(--theme-text); }
	.uc-head .uc-icon { font-size:1.7rem; display:inline-flex; }
	.uc-card[data-uc="a"] .uc-icon { color:#0078d4; }
	.uc-card[data-uc="b"] .uc-icon { color:#10a37f; }
	.uc-card[data-uc="c"] .uc-icon { color:#e97526; }
	.uc-card[data-uc="d"] .uc-icon { color:#d24aa8; }
	.uc-desc { font-size:0.98rem; line-height:1.55; color:var(--theme-text-subtle); }
	.uc-caps { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.2rem; }
	.uc-cap {
		display:inline-flex; align-items:center; gap:0.3rem; padding:0.25rem 0.7rem;
		border-radius:999px; font-size:0.88rem; font-weight:700;
		background:rgba(0,120,212,0.1); color:var(--theme-text);
		border:1.5px solid rgba(0,120,212,0.4); opacity:0;
	}

	/* ── PERFORMANCE DUO (Standard vs Premium) ── */
	.duo { display:flex; gap:1.4rem; justify-content:center; flex-wrap:wrap; width:100%; }
	.duo-card {
		flex:1 1 320px; max-width:430px;
		border:1.5px solid var(--theme-border); border-top:5px solid var(--dc,#0078d4);
		border-radius:16px; background:var(--theme-card-background, #fff);
		box-shadow:0 8px 28px rgba(0,0,0,0.14); padding:1.3rem 1.4rem; opacity:0;
		display:flex; flex-direction:column; gap:0.7rem;
	}
	body.theme-dark .duo-card { background:rgba(255,255,255,0.05); }
	.duo-card .dc-head { display:flex; align-items:center; gap:0.6rem; font-size:1.45rem; font-weight:800; color:var(--theme-text); }
	.duo-card .dc-head .ic { color:var(--dc); font-size:1.8rem; }
	.duo-card .dc-sub { font-size:1.02rem; color:var(--theme-text-subtle); line-height:1.55; }
	.duo-card .dc-list { display:flex; flex-wrap:wrap; gap:0.45rem; }
	.duo-card .pill { border-color:var(--dc); background:color-mix(in srgb, var(--dc) 10%, transparent); font-size:0.95rem; }
	.duo-card .pill .ic { color:var(--dc); }

	/* ── ACCESS TIER ROW (Hot → Archive) ── */
	.tier-row { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; width:100%; }
	.tier-card {
		flex:1 1 0; min-width:155px; max-width:230px;
		border:1.5px solid var(--theme-border); border-top:5px solid var(--tc,#e97526);
		border-radius:14px; background:var(--theme-card-background, #fff);
		box-shadow:0 6px 22px rgba(0,0,0,0.12); padding:1rem 1rem 1.1rem; opacity:0;
		display:flex; flex-direction:column; gap:0.5rem; align-items:center; text-align:center;
	}
	body.theme-dark .tier-card { background:rgba(255,255,255,0.05); }
	.tier-card .tc-icon { font-size:2.1rem; line-height:1; color:var(--tc); }
	.tier-card .tc-name { font-size:1.3rem; font-weight:800; color:var(--tc); }
	.tier-card .tc-sub { font-size:0.9rem; color:var(--theme-text-subtle); line-height:1.4; min-height:2.5em; }
	.tier-card .tc-ret { display:inline-flex; align-items:center; gap:0.35rem; font-size:0.9rem; font-weight:700; padding:0.28rem 0.75rem; border-radius:999px; background:rgba(0,0,0,0.05); color:var(--theme-text); }
	body.theme-dark .tier-card .tc-ret { background:rgba(255,255,255,0.1); }
	.tier-card .tc-ret .ic { color:var(--tc); }
	.tier-card .tc-cost { display:flex; gap:4px; margin-top:0.1rem; }
	.tier-card .tc-dot { width:9px; height:9px; border-radius:50%; background:var(--theme-border); }
	.tier-card .tc-dot.on { background:var(--tc); }
	.tier-scalewrap { display:flex; flex-direction:column; align-items:center; gap:0.4rem; width:100%; }
	.tier-scale {
		width:min(920px,96%); height:12px; border-radius:999px;
		background:linear-gradient(90deg,#e97526,#0078d4,#00b7c3,#5c2d91);
		box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08); opacity:0;
	}
	.tier-scale-labels { display:flex; justify-content:space-between; width:min(920px,96%); font-size:0.92rem; font-weight:600; color:var(--theme-text-subtle); opacity:0; }

	/* ── SMART TIER banner (auto-manages Hot/Cool/Cold) ── */
	.smart-tier { width:min(960px,98%); display:flex; align-items:center; gap:0.7rem 1.1rem; flex-wrap:wrap; padding:0.65rem 1.05rem; border-radius:14px;
		background:linear-gradient(var(--theme-card-background,#fff),var(--theme-card-background,#fff)) padding-box, linear-gradient(90deg,#e97526,#0078d4,#00b7c3) border-box;
		border:2px solid transparent; box-shadow:0 6px 22px rgba(0,0,0,0.1); opacity:0; }
	body.theme-dark .smart-tier { background:linear-gradient(#241b33,#241b33) padding-box, linear-gradient(90deg,#e97526,#0078d4,#00b7c3) border-box; }
	.st-head { display:inline-flex; align-items:center; gap:0.45rem; }
	.st-head .az-ic { width:1.55em; height:1.55em; }
	.st-name { font-size:1.12rem; font-weight:800; color:var(--theme-text); }
	.st-badge { font-size:0.68rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; padding:0.15rem 0.5rem; border-radius:999px; background:var(--aw-purple,#5c2d91); color:#fff; }
	.st-body { display:flex; flex-direction:column; gap:0.35rem; flex:1 1 320px; }
	.st-desc { font-size:0.9rem; color:var(--theme-text-subtle); line-height:1.35; }
	.st-flow { display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }
	.st-node { display:inline-flex; align-items:center; gap:0.3rem; padding:0.2rem 0.55rem; border-radius:999px; font-size:0.9rem; font-weight:800; color:var(--theme-text); border:1.5px solid var(--nc,#e97526); background:color-mix(in srgb, var(--nc) 12%, transparent); }
	.st-node .az-ic { width:1.05em; height:1.05em; }
	.st-edge { display:inline-flex; flex-direction:column; align-items:center; font-size:0.74rem; font-weight:700; color:var(--theme-text-subtle); line-height:1.1; }
	.st-edge b { font-size:1rem; color:var(--theme-text); }
	.st-access { display:inline-flex; align-items:center; gap:0.25rem; font-size:0.84rem; font-weight:800; color:#107c10; }
	body.theme-dark .st-access { color:#4ac26b; }
	.st-note { font-size:0.8rem; font-weight:600; color:var(--theme-text-subtle); max-width:170px; line-height:1.3; }

	/* recap key-feature chips (per service accent) */
	.sa-feats { display:flex; flex-wrap:wrap; gap:0.3rem; margin-top:0.1rem; }
	.sa-feat { padding:0.15rem 0.55rem; border-radius:999px; font-size:0.82rem; font-weight:700; color:var(--theme-text); background:color-mix(in srgb, var(--sc) 12%, transparent); border:1.5px solid color-mix(in srgb, var(--sc) 42%, transparent); }

	/* ── CONTROLS · icon dock ──────────────── */
	#controls {
		position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:40;
		display:flex; align-items:center; gap:5px; padding:5px 7px;
		background:var(--theme-body-background-translucent, rgba(255,255,255,0.82));
		backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4);
		border:1px solid var(--theme-border); border-radius:999px;
		box-shadow: 0 8px 26px rgba(0,0,0,0.18); font-size:13px;
	}
	body.theme-dark #controls { background:var(--theme-body-background-translucent, rgba(32,32,36,0.82)); }
	#controls .ctrl-icon {
		width:2.15rem; height:2.15rem; min-width:0; padding:0;
		display:inline-flex; align-items:center; justify-content:center;
		border-radius:50%; font-size:0.95rem; line-height:1; font-weight:600;
		transition:background 0.18s ease, color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
	}
	#controls .ctrl-icon:hover { transform:translateY(-1px); }
	#controls .ctrl-icon:active { transform:scale(0.92); }
	#controls .ctrl-icon-next {
		width:2.55rem; height:2.55rem; font-size:1.1rem;
		box-shadow:0 2px 8px var(--theme-primary-translucent, rgba(0,120,212,0.45));
	}
	.step-counter {
		min-width:52px; text-align:center; font-variant-numeric:tabular-nums;
		font-size:14px; font-weight:700; color:var(--theme-text);
		padding:0 6px; white-space:nowrap; letter-spacing:0.02em;
	}
	.ctrl-sep { width:1px; align-self:stretch; margin:4px 2px; background:var(--theme-border); }
	.ctrl-grip {
		display:inline-flex; align-items:center; justify-content:center;
		width:1.5rem; height:2.15rem; padding:0; border:none; background:transparent;
		color:var(--theme-text-subtle); border-radius:8px; cursor:grab; touch-action:none;
		transition:background 0.18s ease, color 0.18s ease;
	}
	.ctrl-grip:hover { color:var(--theme-text); background:var(--theme-primary-translucent, rgba(0,120,212,0.12)); }
	.ctrl-grip:active { cursor:grabbing; }
	.ctrl-grip svg { width:13px; height:16px; pointer-events:none; }
	body.controls-floating .ctrl-grip { color:var(--theme-primary,#0078d4); }
	#controls .ctrl-pin { display:none; color:var(--theme-primary,#0078d4); }
	#controls .ctrl-pin svg { width:15px; height:15px; pointer-events:none; }
	body.controls-floating #controls .ctrl-pin { display:inline-flex; }
	body.controls-floating #controls { box-shadow:0 10px 30px rgba(0,0,0,0.30), 0 0 0 1.5px var(--theme-primary,#0078d4); }
	.speed-control { display:inline-flex; align-items:center; gap:1px; padding:2px 3px; border:1px solid var(--theme-border); border-radius:999px; }
	.speed-control .speed-btn {
		width:1.7rem; height:1.7rem; min-width:0; padding:0;
		display:inline-flex; align-items:center; justify-content:center;
		font-size:0.95rem; font-weight:700; border-radius:50%;
	}
	.speed-control .speed-btn[disabled] { opacity:0.4; cursor:not-allowed; }
	.speed-label { min-width:2.4rem; text-align:center; font-variant-numeric:tabular-nums; font-size:0.82rem; font-weight:700; color:var(--theme-text); }

	#callout-toggle, #outline-toggle, #audio-toggle { border:1px solid var(--theme-border); border-radius:4px; transition:background .2s,color .2s,border-color .2s,opacity .2s; }
	#callout-toggle.toggle-active, #outline-toggle.toggle-active, #audio-toggle.toggle-active {
		background:var(--theme-primary-translucent, rgba(0,120,212,0.12)); color:var(--theme-primary,#0078d4); border-color:var(--theme-primary,#0078d4); font-weight:600;
	}
	#callout-toggle:not(.toggle-active), #outline-toggle:not(.toggle-active), #audio-toggle:not(.toggle-active) { opacity:0.6; }

	/* ── HIDE/SHOW TOP BAR ─────────────────── */
	#header-hide { display:inline-flex; align-items:center; justify-content:center; width:2rem; height:2rem; padding:0; border:1px solid var(--theme-border); border-radius:50%; color:var(--theme-text-subtle); transition:background .2s,color .2s,transform .18s; }
	#header-hide:hover { color:var(--theme-text); transform:translateY(-1px); }
	#header-hide svg { width:16px; height:16px; }
	body.chrome-hidden .app-header, body.chrome-hidden .progress-track { display:none; }
	#header-reveal {
		position:fixed; top:0; left:50%; transform:translateX(-50%) translateY(-100%); z-index:45;
		display:inline-flex; align-items:center; gap:0.35rem; padding:5px 14px 6px; font-size:12px; font-weight:600; line-height:1;
		color:var(--theme-text-subtle); background:var(--theme-body-background-translucent, rgba(255,255,255,0.88));
		backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--theme-border); border-top:none; border-radius:0 0 12px 12px;

	body.theme-dark .lang-select {

	.font-size-btn { background:var(--theme-card-background,#fff); color:var(--theme-body-text,#333); border:1px solid var(--theme-border, rgba(0,0,0,0.2)); border-radius:4px; padding:3px 8px; font-size:0.8rem; font-weight:700; font-family:'Segoe UI', sans-serif; cursor:pointer; line-height:1.2; transition:background .15s,border-color .15s; }
	.font-size-btn:hover { border-color:var(--theme-primary, #0078d4); }
	body.theme-dark .font-size-btn { background:var(--theme-body-background,#1a1a2e); color:var(--theme-body-text,#e0e0e0); border-color:rgba(255,255,255,0.15); }

	.ic { display:inline-flex; align-items:center; justify-content:center; vertical-align:-0.125em; }

	#shortcut-overlay { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; }
	#shortcut-overlay[hidden] { display:none; }
	.sc-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.5); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
	.sc-panel { position:relative; z-index:1; width:min(430px,92vw); max-height:82vh; overflow:auto; padding:1.5rem 1.6rem; background:var(--theme-body-background); border:1px solid var(--theme-border); border-radius:16px; box-shadow:0 24px 70px rgba(0,0,0,0.4); }
	.sc-panel h2 { margin:0 0 1rem; font-size:1.25rem; color:var(--theme-tertiary,#5c2d91); }
	body.theme-dark .sc-panel h2 { color:#c9a5e8; }
	.sc-close { position:absolute; top:0.7rem; right:0.7rem; width:2rem; height:2rem; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--theme-border); border-radius:50%; background:transparent; color:var(--theme-text-subtle); cursor:pointer; }
	.sc-close:hover { color:var(--theme-text); border-color:var(--theme-primary,#0078d4); }

	.sc-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0.55rem; }

	/* ══════════════════════════════════════════════════════════════════
	   COPILOT STUDIO UI MOCK — the signature visual.
	   A static mock of Microsoft Copilot Studio (copilotstudio.microsoft.com)
	   inside an Edge browser frame. Rendered LIGHT in both themes because it
	   represents a product screenshot. Purple = Copilot Studio brand (#5c2d91).
	   ══════════════════════════════════════════════════════════════════ */
	.cs-browser {
		--cs-purple:#5c2d91; --cs-purple-lt:#8661c5; --cs-ink:#242424; --cs-sub:#616161;
		--cs-line:#e1dfdd; --cs-soft:#faf9f8;
		width:min(1180px, 99%); border-radius:12px; overflow:hidden; opacity:0;
		background:#fff; color:var(--cs-ink);
		border:1px solid rgba(0,0,0,0.16);
		box-shadow:0 24px 60px rgba(0,0,0,0.28), 0 3px 10px rgba(0,0,0,0.14);
		font-family:'Segoe UI','Segoe UI Web',system-ui,sans-serif;
		display:flex; flex-direction:column; text-align:left;
	}
	.cs-anim { opacity:0; }
	.cs-dot { color:var(--cs-purple); font-weight:900; }
	.cs-logo { display:inline-block; vertical-align:middle; flex:0 0 auto; }
	/* Windows-style window controls (minimize / maximize / close) */
	.cs-winctls { margin:-7px -10px 0 auto; align-self:flex-start; display:inline-flex; }
	.cs-winctls .wc { width:38px; height:29px; display:inline-flex; align-items:center; justify-content:center; }
	.cs-winctls .wc svg { width:10px; height:10px; stroke:#3b3b3b; stroke-width:1; fill:none; }
	.cs-winctls .wc-close svg { stroke-width:1.1; }
	/* ── Edge chrome ── */
	.cs-edge { background:#dfe1e5; padding:7px 10px 0; display:flex; flex-direction:column; gap:7px; }
	.cs-edge-tabs { display:flex; align-items:flex-end; gap:6px; }
	.cs-edge-tab { display:inline-flex; align-items:center; gap:7px; background:#fff; color:#333; font-size:0.82rem; font-weight:600; padding:7px 14px; border-radius:9px 9px 0 0; box-shadow:0 -1px 4px rgba(0,0,0,0.06); }
	.cs-edge-plus { color:#555; font-size:1.05rem; font-weight:700; padding:0 8px; }
	.cs-edge-addr { display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px; padding:6px 14px; margin:0 0 8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.05); }
	.cs-lock { font-size:0.78rem; opacity:0.8; }
	.cs-url { font-size:0.85rem; color:#444; letter-spacing:0.01em; }
	.cs-url::after { content:'/environments/Contoso/bots/ContosoSupport'; color:#9a9a9a; }
	/* ── App shell ── */
	.cs-app { background:#fff; display:flex; flex-direction:column; }
	.cs-topbar { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; border-bottom:1px solid var(--cs-line); background:linear-gradient(90deg, #f6f2fb, #fbfbfd); }
	.cs-brand { display:inline-flex; align-items:center; gap:7px; font-size:0.95rem; font-weight:800; color:var(--cs-purple); }
	.cs-env { display:inline-flex; align-items:center; gap:5px; font-size:0.84rem; font-weight:600; color:#444; background:#fff; border:1px solid var(--cs-line); border-radius:7px; padding:5px 11px; }
	/* ── Agent header: name + actions on top, tab strip below ── */
	.cs-agenthead { display:grid; grid-template-columns:1fr auto; grid-template-areas:"name actions" "tabs tabs"; row-gap:6px; column-gap:12px; align-items:center; padding:12px 16px 0; border-bottom:1px solid var(--cs-line); }
	.cs-agentname { grid-area:name; display:inline-flex; align-items:center; gap:8px; font-size:1.12rem; font-weight:800; color:var(--cs-ink); }
	.cs-actions { grid-area:actions; display:inline-flex; align-items:center; gap:8px; }
	.cs-btn { font-size:0.86rem; font-weight:700; padding:6px 15px; border-radius:6px; border:1px solid var(--cs-line); background:#fff; color:#333; }
	.cs-test-btn { border-color:var(--cs-purple); color:#fff; background:var(--cs-purple); }
	.cs-test-btn.on { box-shadow:0 0 0 3px rgba(92,45,145,0.22); }
	.cs-tabrow { grid-area:tabs; display:flex; gap:1px; overflow:hidden; margin-top:2px; }
	.cs-tab { font-size:0.83rem; font-weight:600; color:#5f5f5f; padding:9px 10px 11px; border-bottom:3px solid transparent; white-space:nowrap; }
	.cs-tab.on { color:var(--cs-purple); border-bottom-color:var(--cs-purple); font-weight:700; background:linear-gradient(180deg, rgba(92,45,145,0.05), transparent); }
	/* ── Body: main panel + optional Test panel ── */
	.cs-bodyrow { display:flex; align-items:stretch; min-height:340px; }
	.cs-main { flex:1 1 auto; padding:18px 20px; background:var(--cs-soft); }
	.cs-test-panel { flex:0 0 300px; border-left:1px solid var(--cs-line); background:#fff; display:flex; flex-direction:column; }
	.cs-test-head { font-size:0.9rem; font-weight:800; color:var(--cs-ink); padding:12px 15px; border-bottom:1px solid var(--cs-line); }
	.cs-chat { flex:1 1 auto; display:flex; flex-direction:column; gap:9px; padding:14px 15px; }
	.cs-bub { max-width:88%; font-size:0.85rem; line-height:1.4; padding:9px 12px; border-radius:12px; }
	.cs-bub.bot { align-self:flex-start; background:#f0ebf7; color:#2c2340; border-bottom-left-radius:4px; }
	.cs-bub.user { align-self:flex-end; background:var(--cs-purple); color:#fff; border-bottom-right-radius:4px; }
	.cs-test-box { margin:0 15px 15px; font-size:0.82rem; color:#9a9a9a; padding:10px 12px; border:1px solid var(--cs-line); border-radius:10px; background:#fff; }
	/* ── Overview: detail cards ── */
	.cs-cardcol { display:flex; flex-direction:column; gap:12px; max-width:760px; }
	.cs-card { background:#fff; border:1px solid var(--cs-line); border-radius:10px; padding:12px 15px; box-shadow:0 2px 6px rgba(0,0,0,0.05); }
	.cs-card-h { font-size:0.82rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--cs-sub); margin-bottom:7px; }
	.cs-kv { display:flex; gap:10px; padding:3px 0; font-size:0.92rem; }
	.cs-k { flex:0 0 108px; color:var(--cs-sub); font-weight:600; }
	.cs-v { color:var(--cs-ink); font-weight:600; }
	.cs-model { display:inline-flex; align-items:center; gap:7px; font-size:1rem; font-weight:800; color:var(--cs-purple); }
	.cs-instr { font-size:0.9rem; line-height:1.5; color:#3a3a3a; }
	.cs-orch { display:inline-flex; align-items:center; gap:8px; font-size:0.9rem; font-weight:600; color:var(--cs-ink); background:#eafaf1; border:1px solid #b7e6c9; border-radius:8px; padding:8px 13px; align-self:flex-start; }

	/* ── Panels (Knowledge / Tools) ── */
	.cs-panel { background:#fff; border:1px solid var(--cs-line); border-radius:10px; padding:14px 16px; box-shadow:0 2px 6px rgba(0,0,0,0.05); }
	.cs-panel-head { display:flex; align-items:center; justify-content:space-between; font-size:1rem; font-weight:800; color:var(--cs-ink); margin-bottom:12px; }
	.cs-addbtn { font-size:0.84rem; font-weight:700; color:var(--cs-purple); border:1px dashed var(--cs-purple-lt); border-radius:7px; padding:5px 12px; }
	.cs-list { display:flex; flex-direction:column; gap:9px; }
	.cs-listitem { display:flex; align-items:center; gap:12px; padding:10px 13px; border:1px solid var(--cs-line); border-radius:9px; background:var(--cs-soft); }
	.cs-li-ic { font-size:1.3rem; flex:none; }
	.cs-li-tt { display:flex; flex-direction:column; gap:1px; flex:1 1 auto; }
	.cs-li-tt b { font-size:0.92rem; color:var(--cs-ink); }

// ── THEME ─────────────────────────────────
const themeToggleBtn = document.getElementById('theme-toggle');
function syncThemeBtn(){
	if (!themeToggleBtn) return;
	const isDark = document.body.classList.contains('theme-dark');
	themeToggleBtn.dataset.theme = isDark ? 'dark' : 'light';
	const label = isDark ? 'Switch to light theme' : 'Switch to dark theme';
	themeToggleBtn.setAttribute('aria-label', label);
	themeToggleBtn.setAttribute('title', label);
}
if (window.AW && AW.theme) {
	AW.theme.onChange(() => { syncThemeBtn(); if (typeof renderStep === 'function' && current >= 0) renderStep(current); });
	syncThemeBtn();
} else {
	syncThemeBtn();
	if (themeToggleBtn) themeToggleBtn.addEventListener('click', () => {
		const goingDark = !document.body.classList.contains('theme-dark');
		document.body.classList.remove('theme-dark', 'theme-light');
		document.body.classList.add(goingDark ? 'theme-dark' : 'theme-light');
		try { localStorage.setItem('aw-theme', goingDark ? 'theme-dark' : 'theme-light'); } catch(_){}
		syncThemeBtn();
		if (current >= 0) renderStep(current);
	});
	try { const saved = localStorage.getItem('aw-theme'); if (saved === 'theme-light' || saved === 'theme-dark') { document.body.classList.remove('theme-dark','theme-light'); document.body.classList.add(saved); syncThemeBtn(); } } catch(_){}
}

function stopAudio(){
	if(currentAudio){ currentAudio.pause(); currentAudio.currentTime=0; currentAudio=null; }
	if(audioTimeout){ clearTimeout(audioTimeout); audioTimeout=null; }
	try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}

function playStepAudio(i){
	stopAudio();
	if(!audioEnabled || i<0 || i>=STEPS.length) return;
	audioTimeout=setTimeout(()=>{
		audioTimeout=null;
		const file=AUDIO_FILES[i];
		if(file){ currentAudio=new Audio(file); currentAudio.play().catch(()=>{}); return; }
		if(window.speechSynthesis){
			const step=STEPS[i];
			const u=new SpeechSynthesisUtterance(`${t(step.titleKey)}. ${t(step.descKey)}`);
			u.lang=currentLang||'en';
			try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(_){}
		}
	}, 700);
}

function fitScene(scene){
	if(!scene) return;
	scene.style.transform='translate(-50%,-50%) scale(1)';
	const box=stage.getBoundingClientRect();
	const availW=box.width-32, availH=box.height-28;
	const sw=scene.offsetWidth, sh=scene.offsetHeight;
	if(!sw||!sh) return;
	const k=Math.min(1, availW/sw, availH/sh);
	scene.style.transform='translate(-50%,-50%) scale('+k+')';
}

	if(i<0||i>=STEPS.length) return;

	else if(step.id==='support') renderSupportStep();

	else if(step.id==='autonomous') renderAutonomousStep();
	else if(step.id==='recap') renderRecapStep();
	const incoming=stage.querySelector('.scene:not(.scene-out)');
	// Fluent icons load an animated APNG first; if it 404s, fall back to the static color SVG.
	if(incoming){ incoming.querySelectorAll('img[data-fallback]').forEach(im=>{ im.addEventListener('error', function h(){ im.removeEventListener('error',h); const fb=im.getAttribute('data-fallback'); if(fb) im.src=fb; }); }); }
	if(incoming && !motionPaused) incoming.classList.add('scene-in');
	fitScene(incoming);
	current=i;
	try{ const u=new URL(location.href); u.searchParams.set('step', String(i+1)); history.replaceState(null,'',u); }catch(_){}
	counter.textContent=`${t('stepOf')} ${current+1} / ${STEPS.length}`;
	breadcrumb.textContent=t(step.captionKey);
	progress.style.width=((current+1)/STEPS.length*100)+'%';
	renderOutline(step,i); announceStep(step,i);
	if(typeof playStepAudio==='function') playStepAudio(i);
}

function csLogo(px){ return `<img class="cs-logo" src="${CS_LOGO}" alt="" width="${px}" height="${px}" decoding="async">`; }
const WIN_CTLS='<span class="cs-winctls"><span class="wc"><svg viewBox="0 0 10 10" aria-hidden="true"><line x1="0" y1="5" x2="10" y2="5"/></svg></span><span class="wc"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"/></svg></span><span class="wc wc-close"><svg viewBox="0 0 10 10" aria-hidden="true"><line x1="0" y1="0" x2="10" y2="10"/><line x1="10" y1="0" x2="0" y2="10"/></svg></span></span>';

function csFrame(active, mainHtml, opts){

	const test=opts.test?`<aside class="cs-test-panel"><div class="cs-test-head">Test your agent</div><div class="cs-chat"><div class="cs-bub bot">${opts.bot||'Hi, I\u2019m Contoso Support. How can I help?'}</div>${opts.user?`<div class="cs-bub user">${opts.user}</div>`:''}${opts.ans?`<div class="cs-bub bot">${opts.ans}</div>`:''}</div><div class="cs-test-box">Ask a question or describe what you need\u2026</div></aside>`:'';

function buildCsScene(step, mainHtml, opts){
	const scene=buildScene(step);
	const frame=csFrame(step.tab, mainHtml, opts||{});
	scene.appendChild(frame); stage.appendChild(scene); liveEls.push(scene);
	const cEl=maybeCallout(step);
	const items=frame.querySelectorAll('.cs-anim');
	if(motionPaused){ gsap.set([...headerEls(scene), frame], {opacity:1}); if(items.length) gsap.set(items,{opacity:1}); if(cEl) gsap.set(cEl,{opacity:1}); animating=false; return; }
	const tl=gsap.timeline({onComplete:()=>animating=false}); liveTimelines.push(tl);
	tl.fromTo(headerEls(scene), {opacity:0,y:-14}, {opacity:1,y:0,duration:0.55,stagger:0.12,ease:'power2.out'});
	tl.fromTo(frame, {opacity:0,y:16,scale:0.985}, {opacity:1,y:0,scale:1,duration:0.5,ease:'power2.out'}, '-=0.1');
	if(items.length) tl.fromTo(items, {opacity:0,y:12}, {opacity:1,y:0,duration:0.4,stagger:0.07,ease:'back.out(1.4)'}, '-=0.15');
	if(cEl) tl.fromTo(cEl, {opacity:0,y:10}, {opacity:1,y:0,duration:0.6}, '-=0.3');
}

// ── CONTROLS ──────────────────────────────
function focusHeading(){ const h=document.getElementById('stage-heading'); if(h){ try{ h.focus({preventScroll:true}); }catch(_){ h.focus(); } } }
function interruptAnimation(){ liveTimelines.forEach(tl=>tl.kill()); liveTimelines=[]; animating=false; }
function next(){ interruptAnimation(); if(current<STEPS.length-1){ renderStep(current+1); focusHeading(); } }
function prev(){ interruptAnimation(); if(current>0){ renderStep(current-1); focusHeading(); } }
function reset(){ interruptAnimation(); renderStep(0); focusHeading(); }
function replay(){ if(current<0) return; interruptAnimation(); renderStep(current); focusHeading(); }

// ── Hide / show top bar ──────────────────
(function(){
	const hideBtn=document.getElementById('header-hide'), revealBtn=document.getElementById('header-reveal');
	if(!hideBtn||!revealBtn) return;
	function setHidden(h){ document.body.classList.toggle('chrome-hidden',h); hideBtn.setAttribute('aria-expanded',String(!h)); try{localStorage.setItem('aw-csan-chrome-hidden',h?'1':'0');}catch(_){}
		if(current>=0) requestAnimationFrame(()=>{ const s=stage.querySelector('.scene:not(.scene-out)'); if(s) fitScene(s); }); }
	hideBtn.addEventListener('click',e=>{e.stopPropagation();setHidden(true);});
	revealBtn.addEventListener('click',e=>{e.stopPropagation();setHidden(false);});
	try{ if(localStorage.getItem('aw-csan-chrome-hidden')==='1') document.body.classList.add('chrome-hidden'); }catch(_){}
	document.addEventListener('keydown',e=>{ if(e.code==='KeyH'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return; e.preventDefault(); setHidden(!document.body.classList.contains('chrome-hidden')); } });
})();

document.getElementById('next-btn').addEventListener('click',e=>{e.stopPropagation();next();});
document.getElementById('prev-btn').addEventListener('click',e=>{e.stopPropagation();prev();});
document.getElementById('reset-btn').addEventListener('click',e=>{e.stopPropagation();reset();});
document.getElementById('replay-btn').addEventListener('click',e=>{e.stopPropagation();replay();});

// ── Clickable progress bar + step ticks ──
(function(){
	const track=document.querySelector('.progress-track'); if(!track) return;
	for(let s=1; s<STEPS.length; s++){ const tk=document.createElement('div'); tk.className='progress-tick'; tk.style.left=(s/STEPS.length*100)+'%'; track.appendChild(tk); }
	track.setAttribute('title','Jump to a step');
	track.addEventListener('click', e=>{
		const r=track.getBoundingClientRect(); const frac=(e.clientX-r.left)/r.width;
		const target=Math.max(0, Math.min(STEPS.length-1, Math.floor(frac*STEPS.length)));
		if(target!==current){ interruptAnimation(); renderStep(target); focusHeading(); }
	});
})();

// ── Movable / pinnable control dock ───────
(function(){
	const dock=document.getElementById('controls'), grip=document.getElementById('ctrl-grip'), pin=document.getElementById('ctrl-pin');
	if(!dock||!grip) return;
	const KEY='aw-csan-controls-pos';
	let dragging=false, sx=0, sy=0, bl=0, bt=0, moved=false;
	function place(left,top){
		const w=dock.offsetWidth, h=dock.offsetHeight;
		left=Math.max(6, Math.min(left, window.innerWidth - w - 6));
		top =Math.max(6, Math.min(top,  window.innerHeight - h - 6));
		dock.style.left=left+'px'; dock.style.top=top+'px'; dock.style.right='auto'; dock.style.bottom='auto'; dock.style.transform='none';
		document.body.classList.add('controls-floating');
	}
	function recenter(){
		dock.style.left=dock.style.top=dock.style.right=dock.style.bottom=dock.style.transform='';
		document.body.classList.remove('controls-floating');
		try{ localStorage.removeItem(KEY); }catch(_){}
	}
	grip.addEventListener('pointerdown', e=>{
		e.preventDefault(); dragging=true; moved=false;
		const r=dock.getBoundingClientRect(); bl=r.left; bt=r.top; sx=e.clientX; sy=e.clientY;
		try{ grip.setPointerCapture(e.pointerId); }catch(_){}
	});
	grip.addEventListener('pointermove', e=>{
		if(!dragging) return;
		const dx=e.clientX-sx, dy=e.clientY-sy;
		if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
		place(bl+dx, bt+dy);
	});
	function end(e){ if(!dragging) return; dragging=false; try{ grip.releasePointerCapture(e.pointerId); }catch(_){}
		if(moved){ try{ const r=dock.getBoundingClientRect(); localStorage.setItem(KEY, JSON.stringify({left:r.left, top:r.top})); }catch(_){} } }
	grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
	grip.addEventListener('keydown', e=>{
		const d=e.shiftKey?40:12; const r=dock.getBoundingClientRect(); let ok=true;
		if(e.key==='ArrowLeft') place(r.left-d, r.top);
		else if(e.key==='ArrowRight') place(r.left+d, r.top);
		else if(e.key==='ArrowUp') place(r.left, r.top-d);
		else if(e.key==='ArrowDown') place(r.left, r.top+d);
		else ok=false;
		if(ok){ e.preventDefault(); e.stopPropagation(); }
	});
	if(pin) pin.addEventListener('click', e=>{ e.stopPropagation(); recenter(); });
	window.addEventListener('resize', ()=>{ if(document.body.classList.contains('controls-floating')){ const r=dock.getBoundingClientRect(); place(r.left, r.top); } });
	try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s && typeof s.left==='number') place(s.left, s.top); }catch(_){}
})();

// ── Speed ─────────────────────────────────
const SPEED_STEPS=[0.5,0.75,1,1.25,1.5,2]; const BASE_TIMESCALE=0.25;
let speedIndex=SPEED_STEPS.indexOf(1);
try{ const sp=parseInt(localStorage.getItem('aw-csan-speed'),10); if(!isNaN(sp)&&sp>=0&&sp<SPEED_STEPS.length) speedIndex=sp; }catch(_){}
const speedLabel=document.getElementById('speed-label'), speedDownBtn=document.getElementById('speed-down'), speedUpBtn=document.getElementById('speed-up');
function saveSpeed(){ try{ localStorage.setItem('aw-csan-speed', String(speedIndex)); }catch(_){} }
function syncSpeedUI(){ const spd=SPEED_STEPS[speedIndex]; speedLabel.textContent=spd+'\u00d7'; speedDownBtn.disabled=speedIndex===0; speedUpBtn.disabled=speedIndex===SPEED_STEPS.length-1; gsap.globalTimeline.timeScale(spd*BASE_TIMESCALE); }
syncSpeedUI();
speedDownBtn.addEventListener('click',e=>{e.stopPropagation(); if(speedIndex>0){speedIndex--;syncSpeedUI();saveSpeed();}});
speedUpBtn.addEventListener('click',e=>{e.stopPropagation(); if(speedIndex<SPEED_STEPS.length-1){speedIndex++;syncSpeedUI();saveSpeed();}});

// ── Keyboard ──────────────────────────────
if (window.AW && AW.keyboard) { AW.keyboard.bind({ next, prev, reset, replay }); }
else { document.addEventListener('keydown', e => {
	if (['Space','ArrowRight','Enter'].includes(e.code)) { e.preventDefault(); next(); }
	else if (e.code==='ArrowLeft') { e.preventDefault(); prev(); }
	else if (e.code==='KeyR') { e.preventDefault(); reset(); }
	else if (e.code==='KeyP') { e.preventDefault(); replay(); }
}); }

// ── Touch swipe (tablets) ─────────────────
(function(){
	const surf=document.getElementById('stage'); if(!surf) return;
	let x0=null,y0=null,t0=0;
	surf.addEventListener('touchstart',e=>{ if(e.touches.length!==1){x0=null;return;} x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
	surf.addEventListener('touchend',e=>{
		if(x0===null) return; const tch=e.changedTouches[0]; const dx=tch.clientX-x0, dy=tch.clientY-y0; x0=null;
		if(Date.now()-t0>800) return;
		if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.6){ if(dx<0) next(); else prev(); }
	},{passive:true});
})();

// ── Keyboard shortcut help overlay ────────
(function(){
	const overlay=document.getElementById('shortcut-overlay'), btn=document.getElementById('help-toggle'), closeBtn=document.getElementById('sc-close'), list=document.getElementById('sc-list');
	if(!overlay||!list) return;
	const ROWS=[[['\u2192','Space'],'scNext'],[['\u2190'],'scPrev'],[['R'],'scRestart'],[['P'],'scReplay'],[['H'],'scHide'],[['?'],'scHelp']];
	window.buildShortcuts=function(){ const title=document.getElementById('sc-title'); if(title) title.textContent=t('scTitle');
		list.innerHTML=ROWS.map(([keys,k])=>`<li><span>${t(k)}</span><span class="sc-keys">${keys.map(x=>`<kbd>${x}</kbd>`).join('')}</span></li>`).join(''); };
	buildShortcuts();
	function open(){ overlay.removeAttribute('hidden'); if(closeBtn) closeBtn.focus(); }
	function close(){ overlay.setAttribute('hidden',''); if(btn) btn.focus(); }
	function toggle(){ overlay.hasAttribute('hidden')?open():close(); }
	if(btn) btn.addEventListener('click',e=>{e.stopPropagation();toggle();});
	if(closeBtn) closeBtn.addEventListener('click',e=>{e.stopPropagation();close();});
	const bd=overlay.querySelector('.sc-backdrop'); if(bd) bd.addEventListener('click',close);
	document.addEventListener('keydown',e=>{ const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
		if(e.key==='?'){ e.preventDefault(); toggle(); }
		else if(e.key==='Escape' && !overlay.hasAttribute('hidden')){ e.preventDefault(); close(); } });
})();

// ── Resize (re-fit only — never rebuild or replay the animation) ──
let resizeTimer, lastStageW=0, lastStageH=0;
window.addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{
	if(current<0) return;
	const box=stage.getBoundingClientRect();
	// Ignore no-op resizes (focus/click reflow, mobile URL-bar show/hide) so the animation never restarts.
	if(Math.abs(box.width-lastStageW)<1 && Math.abs(box.height-lastStageH)<1) return;
	lastStageW=box.width; lastStageH=box.height;
	const s=stage.querySelector('.scene:not(.scene-out)'); if(s) fitScene(s);
},200); });

// ── Init ──────────────────────────────────
setLanguage(currentLang);
counter.textContent = `1 / ${STEPS.length}`;
const urlStep = parseInt(new URLSearchParams(location.search).get('step'), 10);
renderStep((!isNaN(urlStep) && urlStep>=1 && urlStep<=STEPS.length) ? urlStep-1 : 0);
</script>
