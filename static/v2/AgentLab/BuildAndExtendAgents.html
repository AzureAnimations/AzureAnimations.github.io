<!DOCTYPE html>
<!--
	Build and extend an AI agent — visual companion to the Microsoft Learn lab
	"Build and extend AI agents" (Tasks 1-3).

	The lab is text-only, so learners follow steps without ever seeing the SHAPE of what
	they're assembling. Step 2 shows the finished assistant greyed out, every middle step
	lights one more piece of it, and the recap is the same diagram fully assembled.

	EXPERIMENTAL: English only, no narration. Lives one level under static/v2/, so shared
	lib paths are ../lib/ (not ../../lib/ as in _TEMPLATE.html).

	Code shown on stage is taken from the lab, not invented:
	  https://ivorb.github.io/mslearn-ai-agents/Instructions/Exercises/A-build-and-extend-ai-agents.html
-->
<html lang="en">
<head>
	<script src="/js/tracking.js"></script>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<meta name="description" content="A visual walkthrough of the Build and extend AI agents lab - ground an agent in the Foundry portal, extend it with a remote MCP server, and call it from a client app." />
	<title>Build &amp; extend an AI agent &mdash; Azure Animations</title>

	<link rel="stylesheet" href="https://unpkg.com/@microsoft/atlas-css/dist/index.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

	<script src="../lib/js/aw-easings.js"></script>
	<script src="../lib/js/aw-motion.js"></script>
	<script src="../lib/js/aw-theme.js"></script>
	<script src="../lib/js/aw-keyboard.js"></script>

<style>
	:root {
		--aw-purple:#5c2d91; --aw-blue:#0078d4; --aw-green:#10a37f;
		--aw-orange:#e97526; --aw-pink:#d24aa8; --aw-red:#c94f4f;
	}
	html, body { height:100%; margin:0; }
	html { font-size:100%; }
	body {
		display:flex; flex-direction:column; height:100vh; overflow:hidden;
		font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; color:var(--theme-text);
		background:
			radial-gradient(circle at 15% 20%, rgba(92,45,145,0.18) 0%, transparent 55%),
			radial-gradient(circle at 85% 80%, rgba(0,120,212,0.18) 0%, transparent 55%),
			var(--theme-body-background);
	}
	.app-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-shrink:0; font-size:16px; }
	#stage {
		position:relative; flex:1 1 auto; width:100%; min-height:0;
		display:flex; align-items:center; justify-content:center;
		overflow:hidden; container-type:size; padding:1.5rem 2.5rem 5rem;
	}
	#stage:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--theme-primary,#0078d4); outline-offset:3px; border-radius:4px; }
	#stage-frame {
		position:relative; overflow:hidden;
		width:min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio:16/9; max-width:100%; max-height:100%;
		border-radius:16px; background:rgba(0,0,0,0.015); box-shadow:0 12px 44px rgba(0,0,0,0.22);
	}
	body.theme-dark #stage-frame { background:rgba(255,255,255,0.025); }
	#stage-frame::before {
		content:""; position:absolute; inset:0; border-radius:inherit; padding:2.5px;
		background:linear-gradient(135deg, var(--aw-purple) 0%, var(--aw-blue) 55%, var(--aw-pink) 100%);
		-webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
		mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
		-webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; z-index:20;
	}

	.scene {
		position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); transform-origin:center center;
		width:min(1150px, 96%); z-index:10;
		display:flex; flex-direction:column; align-items:center; gap:1.1rem;
	}
	@keyframes awSceneIn { from { opacity:0; } to { opacity:1; } }
	@keyframes awSceneOut { from { opacity:1; } to { opacity:0; } }
	.scene.scene-in { animation:awSceneIn 0.2s ease both; }
	.scene.scene-out { animation:awSceneOut 0.2s ease both; }
	.scene-title { font-size:2.3rem; font-weight:700; color:var(--theme-tertiary,#5c2d91); margin:0; text-align:center; opacity:0; }
	body.theme-dark .scene-title { color:#c9a5e8; }
	.scene-lead { margin:0; text-align:center; font-size:1.25rem; color:var(--theme-text); max-width:min(1080px,96%); line-height:1.5; opacity:0; }

	.callout {
		position:absolute; max-width:340px; padding:1rem 1.2rem;
		background:color-mix(in srgb, var(--theme-body-background) 84%, transparent);
		-webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
		border:1px solid var(--theme-border); border-left:4px solid var(--theme-tertiary,#5c2d91);
		border-radius:6px; box-shadow:0 4px 16px rgba(0,0,0,0.2);
		font-size:1.02rem; line-height:1.45; z-index:14; opacity:0; cursor:grab; touch-action:none;
	}
	.callout:active { cursor:grabbing; }

	/* ── task ribbon · which lab task the current step belongs to ── */
	.task-ribbon { display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap; justify-content:center; opacity:0; }
	.task-chip {
		display:inline-flex; align-items:center; gap:0.4rem; padding:0.24rem 0.7rem; border-radius:999px;
		font-size:0.85rem; font-weight:600; border:1.5px solid var(--theme-border);
		color:var(--theme-text-subtle); background:transparent; transition:all .2s ease;
	}
	.task-chip.is-now { border-color:var(--tc); color:#fff; background:var(--tc); }
	.task-chip.is-done { border-color:var(--tc); color:var(--tc); }

	/* ── ASSEMBLY · the persistent "what you're building" diagram ── */
	.asm { display:flex; flex-direction:column; align-items:center; gap:1.35rem; width:min(1060px,98%); }
	.asm-core {
		display:flex; align-items:center; gap:0.85rem; padding:0.7rem 1.35rem; border-radius:16px;
		border:2.5px solid var(--aw-purple); background:linear-gradient(135deg, rgba(92,45,145,0.14), rgba(0,120,212,0.12));
		box-shadow:0 8px 26px rgba(92,45,145,0.22); opacity:0;
	}
	.asm-core .ac-ico { font-size:1.9rem; line-height:1; color:var(--aw-purple); }
	body.theme-dark .asm-core .ac-ico { color:#c9a5e8; }
	.asm-core .ac-name { font-size:1.25rem; font-weight:600; }
	.asm-core .ac-sub { font-size:0.95rem; color:var(--theme-text-subtle); }
	.asm-row { display:flex; gap:0.85rem; width:100%; align-items:stretch; }
	.slot {
		position:relative; flex:1 1 0; min-width:0; padding:0.85rem 0.9rem 0.9rem;
		border:2px dashed var(--theme-border); border-radius:14px; background:transparent;
		display:flex; flex-direction:column; gap:0.35rem; opacity:0;
		transition:border-color .35s ease, background .35s ease, box-shadow .35s ease;
	}
	/* the stem that ties each slot back to the core above it */
	.slot::before {
		content:''; position:absolute; left:50%; top:-1.35rem; width:2px; height:1.35rem;
		background:var(--theme-border); transition:background .35s ease;
	}
	.slot .slot-task {
		align-self:flex-start; font-size:0.8rem; font-weight:600; letter-spacing:0.04em;
		padding:2px 8px; border-radius:5px; border:1px solid var(--theme-border); color:var(--theme-text-subtle);
	}
	.slot .slot-h { display:flex; align-items:center; gap:0.45rem; font-size:1.1rem; font-weight:600; }
	.slot .slot-h .ic { color:var(--theme-text-subtle); transition:color .35s ease; }
	.slot .slot-p { font-size:0.95rem; line-height:1.4; color:var(--theme-text-subtle); }
	.slot.is-dim { opacity:0.42; }
	.slot.is-on {
		opacity:1; border-style:solid; border-color:var(--sc);
		background:color-mix(in srgb, var(--sc) 12%, transparent);
		box-shadow:0 6px 22px color-mix(in srgb, var(--sc) 26%, transparent);
	}
	.slot.is-on::before { background:var(--sc); }
	.slot.is-on .slot-h .ic { color:var(--sc); }
	.slot.is-on .slot-task { border-color:var(--sc); color:var(--sc); }
	.slot .slot-flag {
		position:absolute; top:-0.7rem; right:0.6rem; padding:2px 9px; border-radius:999px;
		font-size:0.8rem; font-weight:600; color:#fff; background:var(--aw-orange);
		box-shadow:0 3px 10px rgba(0,0,0,0.3); opacity:0; white-space:nowrap;
	}
	.slot .slot-flag.is-live { background:var(--aw-green); }

	/* ── CHAT ── */
	.chat { display:flex; flex-direction:column; gap:0.65rem; width:min(820px,96%); }
	.bubble {
		padding:0.75rem 1.1rem; border-radius:14px; font-size:1.1rem; line-height:1.45; opacity:0;
		border:1.5px solid var(--theme-border); background:var(--theme-card-background,#fff);
	}
	body.theme-dark .bubble { background:rgba(255,255,255,0.05); }
	.bubble.is-user { align-self:flex-start; border-bottom-left-radius:4px; max-width:90%; }
	.bubble.is-bot { align-self:flex-end; border-bottom-right-radius:4px; max-width:90%; }
	.bubble .bub-who { display:block; font-size:0.82rem; font-weight:600; letter-spacing:0.05em;
		text-transform:uppercase; color:var(--theme-text-subtle); margin-bottom:0.25rem; }
	.bubble.is-bad { border-color:var(--aw-red); background:color-mix(in srgb, var(--aw-red) 10%, transparent); }
	.bubble.is-good { border-color:var(--aw-green); background:color-mix(in srgb, var(--aw-green) 10%, transparent); }
	.verdict {
		display:inline-flex; align-items:center; gap:0.45rem; padding:0.42rem 1rem; border-radius:999px;
		font-size:1.02rem; font-weight:600; opacity:0; align-self:center;
	}
	.verdict.is-bad { border:2px solid var(--aw-red); color:var(--aw-red); background:color-mix(in srgb, var(--aw-red) 10%, transparent); }
	.verdict.is-good { border:2px solid var(--aw-green); color:var(--aw-green); background:color-mix(in srgb, var(--aw-green) 10%, transparent); }
	.cite { display:flex; align-items:center; gap:0.35rem; margin-top:0.45rem; font-size:0.9rem;
		font-weight:600; color:var(--aw-green); }
	.cite .ic { font-size:0.95rem; }

	/* ── PORTAL MOCK · a browser window showing the Foundry portal ── */
	.ui-win {
		width:min(760px,96%); border:1.5px solid var(--theme-border); border-radius:10px; overflow:hidden;
		background:var(--theme-body-background); box-shadow:0 14px 40px rgba(0,0,0,0.28); opacity:0;
	}
	.ui-chrome { display:flex; align-items:flex-end; gap:0.5rem; padding:0.35rem 0.5rem 0;
		background:color-mix(in srgb, var(--theme-text) 10%, transparent); }
	.ui-tab { display:flex; align-items:center; gap:0.4rem; padding:0.32rem 0.75rem; font-size:0.82rem; font-weight:500;
		background:var(--theme-body-background); border:1px solid var(--theme-border); border-bottom:none;
		border-radius:7px 7px 0 0; color:var(--theme-text); }
	.ui-tab img { width:15px; height:15px; display:block; }
	.ui-tab .tab-x { color:var(--theme-text-subtle); font-size:0.75rem; margin-left:0.15rem; }
	.ui-winbtns { display:flex; margin-left:auto; align-self:flex-start; }
	.ui-winbtns span { display:inline-flex; align-items:center; justify-content:center; width:1.9rem; height:1.4rem;
		font-size:0.7rem; color:var(--theme-text-subtle); }
	.ui-winbtns span.win-close:hover { background:#e81123; color:#fff; }
	.ui-addr { display:flex; align-items:center; gap:0.5rem; padding:0.4rem 0.6rem;
		background:var(--theme-body-background); border-bottom:1px solid var(--theme-border); }
	.ui-nav { display:flex; gap:0.3rem; color:var(--theme-text-subtle); font-size:0.9rem; }
	.ui-url { flex:1; display:flex; align-items:center; gap:0.4rem; padding:0.22rem 0.65rem; border-radius:999px;
		border:1px solid var(--theme-border); background:color-mix(in srgb, var(--theme-text) 5%, transparent);
		font-size:0.82rem; color:var(--theme-text-subtle); }
	.ui-portal { display:flex; align-items:center; gap:0.5rem; padding:0.55rem 1rem;
		border-bottom:1px solid var(--theme-border); }
	.ui-portal img { width:22px; height:22px; display:block; }
	.ui-brand { font-size:1rem; font-weight:600; color:var(--theme-text); }
	.ui-crumb { margin-left:auto; font-size:0.85rem; color:var(--theme-text-subtle); }
	.ui-body { padding:0.85rem 1rem; display:flex; flex-direction:column; gap:0.55rem;
		background:var(--theme-card-background,#fff); }
	body.theme-dark .ui-body { background:rgba(255,255,255,0.03); }
	.ui-row { display:flex; align-items:center; gap:0.55rem; padding:0.5rem 0.75rem; border-radius:9px;
		border:1.5px solid var(--theme-border); font-size:1.02rem; opacity:0;
		background:var(--theme-body-background); }
	.ui-row.is-add { border-style:dashed; color:var(--theme-text-subtle); background:transparent; }
	.ui-row.is-new { border-color:var(--aw-green); background:color-mix(in srgb, var(--aw-green) 10%, transparent); }
	.ui-row .ui-tag { margin-left:auto; font-size:0.82rem; font-weight:600; color:var(--aw-green); }
	.ui-row .ic { color:var(--theme-text-subtle); }
	.ui-row.is-new .ic { color:var(--aw-green); }
	.ui-file { font-family:'Cascadia Code','Consolas',monospace; font-size:0.95rem; }

	/* ── CODE ── */
	.code-card { width:min(720px,96%); border:1px solid #30363d; border-radius:8px; background:#1e1e1e;
		overflow:hidden; opacity:0; box-shadow:0 8px 26px rgba(0,0,0,0.3); }
	.code-head { display:flex; align-items:center; justify-content:space-between; padding:0 0 0 0.85rem;
		background:#323233; border-bottom:1px solid #1e1e1e; }
	.code-file { font-size:0.88rem; color:#ccc; font-weight:500; padding:0.5rem 0; }
	.code-winctrls { display:flex; }
	.code-wbtn { display:flex; align-items:center; justify-content:center; width:2.3rem; padding:0.45rem 0;
		color:#ccc; font-size:0.68rem; }
	.code-wbtn.is-close:hover { background:#e81123; color:#fff; }
	.code-body { margin:0; padding:0.75rem 1rem; font-family:'Cascadia Code','Consolas',monospace;
		font-size:0.9rem; line-height:1.55; color:#d4d4d4; white-space:pre-wrap; }
	.code-body .tok-com { color:#6a9955; } .code-body .tok-kw { color:#569cd6; }
	.code-body .tok-str { color:#ce9178; } .code-body .tok-fn { color:#dcdcaa; }
	.code-hl { border-radius:4px; padding:0 0.15em; box-shadow:0 0 0 1px rgba(96,165,250,0.55); background:rgba(96,165,250,0.22); }

	/* ── HANDSHAKE · the MCP approval pause ── */
	.hs { display:flex; align-items:stretch; gap:0.7rem; width:min(1000px,98%); }
	.hs-node {
		flex:1 1 0; min-width:0; padding:0.85rem 0.9rem; border-radius:13px; border:2px solid var(--hc);
		background:color-mix(in srgb, var(--hc) 10%, transparent); opacity:0;
		display:flex; flex-direction:column; gap:0.3rem; text-align:center; align-items:center;
	}
	.hs-node .hs-n { font-size:0.82rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--hc); }
	.hs-node.is-cmd .hs-n { text-transform:none; letter-spacing:0; font-family:'Cascadia Code','Consolas',monospace; font-size:0.88rem; }
	.hs-node .hs-t { font-size:1.08rem; font-weight:600; line-height:1.3; }
	.hs-node .hs-s { font-size:0.92rem; color:var(--theme-text-subtle); line-height:1.35; }
	.hs-arrow { align-self:center; font-size:1.7rem; color:var(--theme-text-subtle); opacity:0; flex:none; }

	/* ── PILLS / RECAP ── */
	.chip-row { display:flex; flex-wrap:wrap; gap:0.6rem; justify-content:center; }
	.pill { display:inline-flex; align-items:center; gap:0.45rem; padding:0.45rem 1rem; border-radius:999px;
		font-size:1rem; font-weight:600; border:2px solid var(--theme-tertiary,#5c2d91);
		background:rgba(92,45,145,0.08); opacity:0; }
	body.theme-dark .pill { background:rgba(92,45,145,0.2); }
	.value-chip { display:inline-flex; align-items:center; gap:0.4rem; padding:0.42rem 0.95rem; border-radius:999px;
		font-size:1rem; font-weight:600; border:2px solid var(--aw-green);
		background:color-mix(in srgb, var(--aw-green) 10%, transparent); opacity:0; }
	.recap-foot { font-size:1.05rem; text-align:center; max-width:820px; opacity:0; color:var(--theme-text); }

	/* ── OVERVIEW · the six tasks at a glance ── */
	.ov-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.7rem; width:min(1090px,98%); }
	.ov-card { display:flex; flex-direction:column; gap:0.25rem; padding:0.75rem 0.85rem 0.8rem; border-radius:13px;
		border:2px solid var(--tc); background:color-mix(in srgb, var(--tc) 10%, transparent); opacity:0; }
	.ov-top { display:flex; align-items:center; gap:0.45rem; }
	.ov-n { font-size:0.8rem; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--tc); }
	.ov-kind { margin-left:auto; font-size:0.74rem; font-weight:600; padding:1px 8px; border-radius:999px;
		border:1px solid var(--theme-border); color:var(--theme-text-subtle); }
	.ov-kind.is-core { border-color:var(--aw-green); color:var(--aw-green); }
	.ov-h { font-size:1.04rem; font-weight:600; line-height:1.25; }
	.ov-p { font-size:0.9rem; color:var(--theme-text-subtle); line-height:1.35; }
	.ov-meta { margin-top:auto; padding-top:0.35rem; display:flex; align-items:center; gap:0.55rem;
		font-size:0.82rem; color:var(--theme-text-subtle); }
	.ov-bar { letter-spacing:0.08em; color:var(--tc); }

	/* ── ARCHITECTURE · where every component lives, and which task builds it ── */
	.arch { display:flex; align-items:center; gap:0.45rem; width:min(1140px,99%); }
	.tier { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:0.5rem;
		padding:0.65rem 0.65rem 0.75rem; border-radius:14px; border:1.5px dashed var(--theme-border); opacity:0; }
	.tier.is-foundry { flex:1.3 1 0; border-style:solid; border-color:var(--aw-blue);
		background:color-mix(in srgb, var(--aw-blue) 7%, transparent); }
	.tier-head { display:flex; align-items:center; gap:0.35rem; font-size:0.82rem; font-weight:600;
		letter-spacing:0.05em; text-transform:uppercase; color:var(--theme-text-subtle); }
	.tier.is-foundry .tier-head { color:var(--aw-blue); }
	.tier-head .tier-mark { width:1.15rem; height:1.15rem; display:block; }
	body.theme-dark .tier.is-foundry .tier-head { color:#5cc8ff; }
	.comp { position:relative; padding:0.45rem 0.6rem 0.5rem; border-radius:10px; display:flex; flex-direction:column; gap:0.1rem;
		border:1.5px solid var(--theme-border); background:var(--theme-card-background,#fff); transition:box-shadow .35s ease, border-color .35s ease; }
	body.theme-dark .comp { background:rgba(255,255,255,0.05); }
	.comp-name { font-size:0.97rem; font-weight:600; display:flex; align-items:center; gap:0.35rem; }
	.comp-name .ic { color:var(--tc); }
	.comp-sub { font-size:0.84rem; color:var(--theme-text-subtle); line-height:1.3; }
	.comp-task { position:absolute; top:-0.55rem; right:0.5rem; padding:1px 7px; border-radius:999px;
		font-size:0.72rem; font-weight:600; color:#fff; background:var(--tc); white-space:nowrap; }
	.comp.is-lit { border-color:var(--tc); box-shadow:0 4px 18px color-mix(in srgb, var(--tc) 32%, transparent); }
	.arch-link { flex:0 0 auto; align-self:center; display:flex; flex-direction:column; align-items:center; gap:0.15rem; opacity:0; }
	.arch-link .al-a { font-size:1.35rem; line-height:1; color:var(--theme-text-subtle); }
	.arch-link .al-t { font-size:0.76rem; line-height:1.25; text-align:center; max-width:8.5rem; color:var(--theme-text-subtle); }
	.arch-legend { display:flex; flex-wrap:wrap; gap:0.65rem; justify-content:center; opacity:0; }
	.leg { display:inline-flex; align-items:center; gap:0.35rem; font-size:0.84rem; color:var(--theme-text-subtle); }
	.leg i { width:0.68rem; height:0.68rem; border-radius:3px; background:var(--tc); }

	.code-duo { display:flex; gap:0.7rem; width:min(1090px,98%); align-items:stretch; }
	.code-duo .code-card { flex:1 1 0; width:auto; min-width:0; display:flex; flex-direction:column; }
	.code-duo .code-body { flex:1 1 auto; }

	/* ── CONTROLS ── */
	#controls {
		position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:40;
		display:flex; align-items:center; gap:5px; padding:5px 7px;
		background:var(--theme-body-background-translucent, rgba(255,255,255,0.82));
		backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4);
		border:1px solid var(--theme-border); border-radius:999px;
		box-shadow:0 8px 26px rgba(0,0,0,0.18); font-size:13px;
	}
	body.theme-dark #controls { background:var(--theme-body-background-translucent, rgba(32,32,36,0.82)); }
	#controls .ctrl-icon { width:2.15rem; height:2.15rem; min-width:0; padding:0; display:inline-flex;
		align-items:center; justify-content:center; border-radius:50%; font-size:0.95rem; font-weight:600;

const themeToggleBtn = document.getElementById('theme-toggle');
function syncThemeBtn(){
	if(!themeToggleBtn) return;
	const isDark = document.body.classList.contains('theme-dark');
	themeToggleBtn.dataset.theme = isDark ? 'dark' : 'light';
	themeToggleBtn.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
}
if (window.AW && AW.theme) { AW.theme.onChange(syncThemeBtn); syncThemeBtn(); }
else {
	try { const s=localStorage.getItem('aw-theme'); if(s){ document.body.classList.remove('theme-dark','theme-light'); document.body.classList.add(s); } } catch(_){}
	syncThemeBtn();
	themeToggleBtn.addEventListener('click', () => {
		const dark = !document.body.classList.contains('theme-dark');
		document.body.classList.remove('theme-dark','theme-light');
		document.body.classList.add(dark ? 'theme-dark' : 'theme-light');
		try { localStorage.setItem('aw-theme', dark ? 'theme-dark':'theme-light'); } catch(_){}
		syncThemeBtn();
	});
}

const fontScales=[0.8,0.9,1,1.1,1.2,1.35]; let fontScaleIdx=2;
const baseFontSize=parseFloat(getComputedStyle(document.documentElement).fontSize);
function applyFontScale(){
	document.documentElement.style.fontSize=(baseFontSize*fontScales[fontScaleIdx])+'px';
	const c=document.getElementById('controls'); if(c) c.style.fontSize=baseFontSize+'px';
	const s=stage.querySelector('.scene:not(.scene-out)'); if(s) fitScene(s);
}
try{ const f=parseInt(localStorage.getItem('aw-lab-font'),10); if(!isNaN(f)&&f>=0&&f<fontScales.length){ fontScaleIdx=f; } }catch(_){}
document.getElementById('font-decrease').addEventListener('click',()=>{ if(fontScaleIdx>0){fontScaleIdx--;applyFontScale();try{localStorage.setItem('aw-lab-font',String(fontScaleIdx));}catch(_){}} });
document.getElementById('font-increase').addEventListener('click',()=>{ if(fontScaleIdx<fontScales.length-1){fontScaleIdx++;applyFontScale();try{localStorage.setItem('aw-lab-font',String(fontScaleIdx));}catch(_){}} });

calloutBtn.addEventListener('click',()=>{
	calloutEnabled=!calloutEnabled; syncCalloutBtn();
	if(current<0) return;
	const existing=stage.querySelectorAll('.callout');
	if(calloutEnabled){ if(!existing.length){ const c=maybeCallout(STEPS[current]); if(c) gsap.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.4,overwrite:true}); } }
	else { existing.forEach(c=>{ const i=liveEls.indexOf(c); if(i>-1) liveEls.splice(i,1); gsap.killTweensOf(c); c.remove(); }); }
}); syncCalloutBtn();

function icon(n){ return '<span class="ic">'+(ICONS[n]||'')+'</span>'; }
function stepById(id){ return STEPS.find(s=>s.id===id); }
function fitScene(scene){
	if(!scene) return;
	scene.style.transform='translate(-50%,-50%) scale(1)';
	const box=stage.getBoundingClientRect();
	const availW=box.width-32, availH=box.height-28;
	const sw=scene.offsetWidth, sh=scene.offsetHeight;
	if(!sw||!sh) return;
	scene.style.transform='translate(-50%,-50%) scale('+Math.min(1, availW/sw, availH/sh)+')';
}
function headerEls(s){ return [s.querySelector('.scene-title'), s.querySelector('.scene-lead')]; }
function buildScene(step){
	const s=el('scene');
	s.appendChild(el('scene-title', t(step.titleKey)));
	s.appendChild(el('scene-lead', t(step.descKey)));
	return s;
}
function maybeCallout(step){
	if(!calloutEnabled) return null;
	const c=el('callout', t(step.calloutKey));
	c.style.left='1.5rem'; c.style.top='1.5rem';
	stage.appendChild(c); liveEls.push(c); dragify(c,'aw-lab-callout-pos');
	return c;
}
// Repeated on every task scene so a learner always knows which of the six tasks they're in.
function taskRibbon(activeTask){
	const r=el('task-ribbon');
	for(let n=1;n<=6;n++){
		const chip=el('task-chip', t('tTaskLong'+n));
		chip.style.setProperty('--tc', TASK_COLORS[n]);
		if(n===activeTask) chip.classList.add('is-now');
		else if(activeTask>0 && n<activeTask) chip.classList.add('is-done');
		r.appendChild(chip);
	}
	return r;
}

// ── The assembly diagram · shared by the task steps ──
function buildAssembly(on, flags){
	on = on || []; flags = flags || {};
	const wrap=el('asm');
	wrap.appendChild(el('asm-core',
		'<span class="ac-ico">'+ICONS.robot+'</span>' +
		'<span><span class="ac-name">'+t('coreName')+'</span><br><span class="ac-sub">'+t('coreSub')+'</span></span>'));
	const row=el('asm-row');
	[['instr','#10a37f','slotTaskInstr','slotInstr','slotInstrP','list'],
	 ['know', '#10a37f','slotTaskKnow','slotKnow','slotKnowP','doc'],
	 ['tools','#e97526','slotTaskTools','slotTools','slotToolsP','tool'],
	 ['client','#0078d4','slotTaskClient','slotClient','slotClientP','window']].forEach(function(d){
		const s=el('slot',
			'<span class="slot-task">'+t(d[2])+'</span>' +
			'<span class="slot-h">'+icon(d[5])+'<span>'+t(d[3])+'</span></span>' +
			'<span class="slot-p">'+t(d[4])+'</span>');
		s.style.setProperty('--sc', d[1]);
		s.setAttribute('data-slot', d[0]);
		s.classList.add(on.indexOf(d[0])>-1 ? 'is-on' : 'is-dim');
		if(flags[d[0]]){
			const f=el('slot-flag', t(flags[d[0]]));
			if(flags[d[0]]!=='flagFrozen') f.classList.add('is-live');
			s.appendChild(f);
		}
		row.appendChild(s);
	});
	wrap.appendChild(row);
	return wrap;
}
function animateAssembly(tl, asm, at){

}

function renderOutline(step,idx){

// ── RENDER DISPATCH ───────────────────────
function renderStep(i){
	if(i<0||i>=STEPS.length) return;
	if(animating){ liveTimelines.forEach(tl=>tl.kill()); liveTimelines=[]; animating=false; }
	animating=true;
	const step=STEPS[i];
	const outgoing=stage.querySelector('.scene:not(.scene-out)');
	if(outgoing) liveEls=liveEls.filter(x=>x!==outgoing);
	clearStage();
	if(outgoing){
		outgoing.style.zIndex='5';
		if(motionPaused) outgoing.remove();
		else { outgoing.classList.remove('scene-in'); outgoing.classList.add('scene-out'); setTimeout(()=>outgoing.remove(),240); }
	}
	RENDERERS[step.id]();
	const incoming=stage.querySelector('.scene:not(.scene-out)');
	if(incoming && !motionPaused) incoming.classList.add('scene-in');
	fitScene(incoming);
	current=i;
	try{ const u=new URL(location.href); u.searchParams.set('step',String(i+1)); history.replaceState(null,'',u); }catch(_){}
	counter.textContent=(current+1)+' / '+STEPS.length;
	breadcrumb.textContent=t(step.captionKey);
	progress.style.width=((current+1)/STEPS.length*100)+'%';
	renderOutline(step,i);
	announcer.textContent='Step '+(i+1)+' of '+STEPS.length+': '+t(step.titleKey)+'. '+t(step.descKey);
}
function baseTl(scene){
	const tl=gsap.timeline({onComplete:()=>animating=false}); liveTimelines.push(tl);
	tl.fromTo(headerEls(scene),{opacity:0,y:-14},{opacity:1,y:0,duration:0.55,stagger:0.12,ease:'power2.out'});
	return tl;
}
function mount(scene){ stage.appendChild(scene); liveEls.push(scene); }

// ── 1 · PROBLEM ───────────────────────────
function renderProblem(){
	const step=stepById('problem'), scene=buildScene(step);
	const chat=el('chat');
	const q=el('bubble is-user','<span class="bub-who">Store staff</span>'+t('problemQ'));
	const a=el('bubble is-bot is-bad','<span class="bub-who">Model, ungrounded</span>'+t('problemA'));
	chat.appendChild(q); chat.appendChild(a);
	const v=el('verdict is-bad', icon('cross')+'<span>'+t('problemVerdict')+'</span>');
	scene.appendChild(chat); scene.appendChild(v);
	mount(scene);
	const c=maybeCallout(step);
	if(motionPaused){ gsap.set([].concat(headerEls(scene),[q,a,v]),{opacity:1}); if(c) gsap.set(c,{opacity:1}); animating=false; return; }
	const tl=baseTl(scene);
	tl.fromTo(q,{opacity:0,x:-24},{opacity:1,x:0,duration:0.45,ease:'power2.out'},'-=0.1');
	tl.fromTo(a,{opacity:0,x:24},{opacity:1,x:0,duration:0.45,ease:'power2.out'},'+=0.15');
	tl.fromTo(v,{opacity:0,scale:0.85},{opacity:1,scale:1,duration:0.4,ease:'back.out(1.8)'},'+=0.1');
	if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.5},'-=0.2');
}

// ── 2 · BLUEPRINT · the destination, shown before task one ──
function renderBlueprint(){
	const step=stepById('blueprint'), scene=buildScene(step);
	const ribbon=taskRibbon(0), asm=buildAssembly([], {});
	scene.appendChild(ribbon); scene.appendChild(asm);
	mount(scene);
	const c=maybeCallout(step);
	if(motionPaused){ gsap.set([].concat(headerEls(scene),[ribbon]),{opacity:1}); setAssemblyStatic(asm); if(c) gsap.set(c,{opacity:1}); animating=false; return; }
	const tl=baseTl(scene);

	tl.fromTo(nodes,{opacity:0,y:16,scale:0.93},{opacity:1,y:0,scale:1,duration:0.4,stagger:0.2,ease:'back.out(1.5)'},'+=0.05');
	tl.fromTo(arrows,{opacity:0},{opacity:1,duration:0.3,stagger:0.2},'-=0.55');
	tl.fromTo(pillEls,{opacity:0,y:10,scale:0.9},{opacity:1,y:0,scale:1,duration:0.35,stagger:0.09,ease:'back.out(1.8)'},'-=0.1');
	if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.5},'-=0.2');
}

// ── 13 · RECAP · the whole application, every component built ──
function renderRecap(){
	const step=stepById('recap'), scene=buildScene(step);
	const arch=buildArch(true);
	const vals=el('chip-row');
	[['recapV1','check'],['recapV2','bolt'],['recapV3','window'],['recapV4','cube']].forEach(function(p){
		vals.appendChild(el('value-chip', icon(p[1])+'<span>'+t(p[0])+'</span>'));
	});
	const foot=el('recap-foot', t('recapFoot'));
	scene.appendChild(arch); scene.appendChild(vals); scene.appendChild(foot);
	mount(scene);
	const c=maybeCallout(step);
	const valEls=vals.querySelectorAll('.value-chip');
	if(motionPaused){ gsap.set([].concat(headerEls(scene),[foot]),{opacity:1}); gsap.set(valEls,{opacity:1}); setArchStatic(arch); if(c) gsap.set(c,{opacity:1}); animating=false; return; }
	const tl=baseTl(scene);
	animateArch(tl, arch, '-=0.1');
	tl.fromTo(valEls,{opacity:0,y:12,scale:0.85},{opacity:1,y:0,scale:1,duration:0.4,stagger:0.1,ease:'back.out(1.8)'},'+=0.05');
	tl.fromTo(foot,{opacity:0,y:10},{opacity:1,y:0,duration:0.45,ease:'power2.out'},'-=0.1');
	if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.5},'-=0.2');
}

const RENDERERS={ problem:renderProblem, overview:renderOverview, blueprint:renderBlueprint, arch:renderArch,
	ground:renderGround, limits:renderLimits, mcp:renderMcp, approval:renderApproval, client:renderClient,
	functions:renderFunctions, mcpserver:renderMcpServer, hosted:renderHosted, recap:renderRecap };

// ── CONTROLS ──────────────────────────────
function interruptAnimation(){ liveTimelines.forEach(tl=>tl.kill()); liveTimelines=[]; animating=false; }
function next(){ interruptAnimation(); if(current<STEPS.length-1) renderStep(current+1); }
function prev(){ interruptAnimation(); if(current>0) renderStep(current-1); }
function reset(){ interruptAnimation(); renderStep(0); }
function replay(){ if(current<0) return; interruptAnimation(); renderStep(current); }
document.getElementById('next-btn').addEventListener('click',next);
document.getElementById('prev-btn').addEventListener('click',prev);
document.getElementById('replay-btn').addEventListener('click',replay);
document.getElementById('reset-btn').addEventListener('click',reset);

// ── Drag (outline + callout) ──────────────
function dragify(elm, key){
	if(!elm) return;
	let dragging=false, sx=0, sy=0, bl=0, bt=0;
	elm.addEventListener('pointerdown',e=>{
		if(e.target.closest('button')) return;
		dragging=true; sx=e.clientX; sy=e.clientY;
		const r=elm.getBoundingClientRect(); bl=r.left; bt=r.top;
		elm.style.position='fixed'; elm.style.left=bl+'px'; elm.style.top=bt+'px';
		elm.style.right='auto'; elm.style.bottom='auto';
		try{ elm.setPointerCapture(e.pointerId); }catch(_){}
	});
	elm.addEventListener('pointermove',e=>{
		if(!dragging) return;
		elm.style.left=(bl+e.clientX-sx)+'px'; elm.style.top=(bt+e.clientY-sy)+'px';
	});
	function end(e){ if(!dragging) return; dragging=false;
		try{ elm.releasePointerCapture(e.pointerId); }catch(_){}
		if(key){ try{ const r=elm.getBoundingClientRect(); localStorage.setItem(key, JSON.stringify({left:r.left,top:r.top})); }catch(_){} } }
	elm.addEventListener('pointerup',end); elm.addEventListener('pointercancel',end);
	if(key){ try{ const s=JSON.parse(localStorage.getItem(key)||'null');
		if(s&&isFinite(s.left)&&isFinite(s.top)){ elm.style.position='fixed'; elm.style.left=s.left+'px'; elm.style.top=s.top+'px'; elm.style.right='auto'; } }catch(_){} }
}
dragify(outlinePanel,'aw-lab-outline-pos');

// ── Speed ─────────────────────────────────
const SPEED_STEPS=[0.5,0.75,1,1.25,1.5,2], BASE_TIMESCALE=0.25;
let speedIndex=SPEED_STEPS.indexOf(1);
try{ const sp=parseInt(localStorage.getItem('aw-lab-speed'),10); if(!isNaN(sp)&&sp>=0&&sp<SPEED_STEPS.length) speedIndex=sp; }catch(_){}
const speedLabel=document.getElementById('speed-label'), speedDownBtn=document.getElementById('speed-down'), speedUpBtn=document.getElementById('speed-up');
function syncSpeedUI(){
	speedLabel.textContent=SPEED_STEPS[speedIndex]+'\u00d7';
	speedDownBtn.disabled=speedIndex===0; speedUpBtn.disabled=speedIndex===SPEED_STEPS.length-1;
	gsap.globalTimeline.timeScale(SPEED_STEPS[speedIndex]*BASE_TIMESCALE);
}
syncSpeedUI();
speedDownBtn.addEventListener('click',()=>{ if(speedIndex>0){speedIndex--;syncSpeedUI();try{localStorage.setItem('aw-lab-speed',String(speedIndex));}catch(_){}} });
speedUpBtn.addEventListener('click',()=>{ if(speedIndex<SPEED_STEPS.length-1){speedIndex++;syncSpeedUI();try{localStorage.setItem('aw-lab-speed',String(speedIndex));}catch(_){}} });

// ── Keyboard + swipe ──────────────────────
if (window.AW && AW.keyboard) { AW.keyboard.bind({ next, prev, reset, replay }); }
else { document.addEventListener('keydown', e => {
	const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return;
	if(['Space','ArrowRight','Enter'].includes(e.code)){ e.preventDefault(); next(); }
	else if(e.code==='ArrowLeft'){ e.preventDefault(); prev(); }
	else if(e.code==='KeyR'){ e.preventDefault(); reset(); }
	else if(e.code==='KeyP'){ e.preventDefault(); replay(); }
}); }
(function(){
	const surf=document.getElementById('stage'); if(!surf) return;
	let x0=null,y0=null,t0=0;
	surf.addEventListener('touchstart',e=>{ if(e.touches.length!==1){x0=null;return;} x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
	surf.addEventListener('touchend',e=>{
		if(x0===null) return; const tc=e.changedTouches[0], dx=tc.clientX-x0, dy=tc.clientY-y0; x0=null;
		if(Date.now()-t0>800) return;
		if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.6){ if(dx<0) next(); else prev(); }
	},{passive:true});
})();

// ── Resize (re-fit only — never rebuild or replay) ──
let resizeTimer, lastW=0, lastH=0;
window.addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{
	if(current<0) return;
	const box=stage.getBoundingClientRect();
	if(Math.abs(box.width-lastW)<1 && Math.abs(box.height-lastH)<1) return;
	lastW=box.width; lastH=box.height;
	const s=stage.querySelector('.scene:not(.scene-out)'); if(s) fitScene(s);
},200); });

// ── Init ──────────────────────────────────
applyFontScale();
const urlStep=parseInt(new URLSearchParams(location.search).get('step'),10);
renderStep((!isNaN(urlStep)&&urlStep>=1&&urlStep<=STEPS.length) ? urlStep-1 : 0);
</script>

<script>
// ── Start gate · hold the first animation until the viewer presses Play ──
(function () {
	if (new URLSearchParams(location.search).has('present')) return;
	var stageEl = document.getElementById('stage');
	if (!stageEl) return;
	function freeze(){ try{ if(window.gsap && gsap.globalTimeline) gsap.globalTimeline.pause(); }catch(_){} }
	freeze(); requestAnimationFrame(freeze);
	stageEl.style.transition='opacity .55s ease';
	stageEl.style.opacity='0';

	var style=document.createElement('style');
	style.textContent =
		'#aw-play-card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;box-sizing:border-box;width:min(90vw,23rem);padding:1.5rem;border-radius:16px;background:var(--theme-card-background,#fff);color:var(--theme-text,#222);border:1px solid var(--theme-border,rgba(0,0,0,.1));box-shadow:0 24px 60px rgba(0,0,0,.28);text-align:center;transition:opacity .3s ease,transform .3s ease}' +
		'#aw-play-card.aw-hide{opacity:0;transform:translate(-50%,-50%) scale(.96);pointer-events:none}' +
		'body.theme-dark #aw-play-card{border-color:rgba(255,255,255,.12)}' +
		'.aw-card-title{margin:0 0 .35rem;font-size:1.1rem;font-weight:700}' +
		'.aw-card-sub{margin:0 0 1.2rem;font-size:.9rem;opacity:.75;line-height:1.45}' +
		'#aw-start{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1rem;border:none;border-radius:11px;cursor:pointer;background:var(--theme-primary,#0078d4);color:#fff;font-size:.95rem;font-weight:600;box-shadow:0 8px 22px var(--theme-primary-translucent,rgba(0,120,212,.45));transition:transform .15s ease}' +
		'#aw-start:hover{transform:translateY(-2px)}#aw-start svg{width:18px;height:18px}';
	document.head.appendChild(style);

	var card=document.createElement('div');
	card.id='aw-play-card'; card.setAttribute('role','dialog'); card.setAttribute('aria-modal','true');
	card.innerHTML='<p class="aw-card-title">Ready to begin?</p>'+
		'<p class="aw-card-sub">An overview of what you\u2019ll build, then all six tasks of the lab.</p>'+
		'<button type="button" id="aw-start"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg><span>Start</span></button>';
	document.body.appendChild(card);

	var done=false;
	function gateKeys(e){
		if(done) return;
		if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].indexOf(e.key)>=0){ e.preventDefault(); e.stopPropagation(); }
	}
	document.addEventListener('keydown', gateKeys, true);

	document.getElementById('aw-start').addEventListener('click', function () {
		if(done) return; done=true;
		document.removeEventListener('keydown', gateKeys, true);
		card.classList.add('aw-hide');
		setTimeout(function(){ if(card.parentNode) card.parentNode.removeChild(card); if(style.parentNode) style.parentNode.removeChild(style); }, 420);
		setTimeout(function(){
			try{ if(window.gsap && gsap.globalTimeline) gsap.globalTimeline.play(); }catch(_){}
			stageEl.style.opacity='1';
			try{ interruptAnimation(); renderStep(typeof current==='number' && current>=0 ? current : 0); }catch(_){}
		}, 380);
	});
}());
</script>
