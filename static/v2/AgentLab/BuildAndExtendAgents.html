<!DOCTYPE html>
<!--
	Build and extend an AI agent — visual companion to the Microsoft Learn lab
	"Build and extend AI agents" (Tasks 1-3).

	The lab is text-only, so learners follow steps without ever seeing the SHAPE of what
	they're assembling. Step 2 shows the finished assistant greyed out, every middle step
	lights one more piece of it, and the recap is the same diagram fully assembled.

	EXPERIMENTAL: English only, no narration. Lives one level under static/v2/, so shared
	lib paths are ../lib/ (not ../../lib/ as in _TEMPLATE.html).

	Code shown on stage is taken from the lab, not invented:
	  https://ivorb.github.io/mslearn-ai-agents/Instructions/Exercises/A-build-and-extend-ai-agents.html

	Narration script: /static/narration/v2/AgentLab/BuildAndExtendAgents.md
-->
<html lang="en">
<head>
	<script src="/js/tracking.js"></script>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<meta name="description" content="A visual walkthrough of the Build and extend AI agents lab - ground an agent in the Foundry portal, extend it with a remote MCP server, and call it from a client app." />
	<title>Build &amp; extend an AI agent &mdash; Azure Animations</title>

	<link rel="stylesheet" href="https://unpkg.com/@microsoft/atlas-css/dist/index.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

	<script src="../lib/js/aw-easings.js"></script>
	<script src="../lib/js/aw-motion.js"></script>
	<script src="../lib/js/aw-theme.js"></script>
	<script src="../lib/js/aw-keyboard.js"></script>
	<script src="../lib/js/aw-captions.js"></script>

<style>
	/* ══ WARM "PARCHMENT" PALETTE · the single source of truth ══
	   Surfaces are FLAT — no gradients anywhere. Accents lighten in the dark theme,
	   so titles, borders and the per-task hues stay legible without dark overrides.
	   --task-1..6 are read from JS (TASK_COLORS) and pushed into --tc / --sc / --hc. */
	:root {
		--bg:            #f4ead6;
		--bg-soft:       #fbf6ea;
		--bg-translucent: rgba(251,246,234,0.88);
		--ink:           #241f18;
		--ink-soft:      #5b5245;
		--card:          #ffffff;
		--card-border:   #ddd2bb;
		--shadow:        0 6px 18px rgba(60,48,30,0.10);
		--shadow-strong: 0 12px 28px rgba(60,48,30,0.16);

		--accent-blue:   #1f6dff;
		--accent-purple: #9b2bd9;
		--accent-pink:   #ec3f7d;
		--accent-orange: #ff7a1a;
		--accent-green:  #2ea043;
		--accent-plum:   #7b4ddc;
		--accent-teal:   #0e7490;
		--accent-red:    #d13438;

		--accent-blue-soft:   rgba(31,109,255,0.12);
		--accent-purple-soft: rgba(155,43,217,0.10);
		--accent-green-soft:  rgba(46,160,67,0.10);

		/* Text ON a filled accent. Must flip with the theme: dark-theme accents are
		   LIGHTENED, so white-on-accent drops to ~2:1 there. */
		--on-accent: #ffffff;

		--task-1: var(--accent-green);
		--task-2: var(--accent-orange);
		--task-3: var(--accent-blue);
		--task-4: var(--accent-pink);
		--task-5: var(--accent-plum);
		--task-6: var(--accent-teal);

		/* legacy aliases so blocks copied from sibling pages still resolve */
		--aw-purple: var(--accent-purple); --aw-blue: var(--accent-blue); --aw-green: var(--accent-green);
		--aw-orange: var(--accent-orange); --aw-pink: var(--accent-pink); --aw-red: var(--accent-red);
	}
	/* Dark theme — a WARM charcoal in the parchment family, not a near-black. */
	body.theme-dark {
		--bg:            #2e2823;
		--bg-soft:       #38312a;
		--bg-translucent: rgba(56,49,42,0.88);
		--ink:           #f6f0e2;
		--ink-soft:      #cdc4b2;
		--card:          #423a31;
		--card-border:   #635948;
		--shadow:        0 6px 18px rgba(0,0,0,0.34);
		--shadow-strong: 0 12px 28px rgba(0,0,0,0.44);

		--accent-blue:   #6fa5ff;
		--accent-purple: #cd90ec;
		--accent-pink:   #f4739f;
		--accent-orange: #ff9d4d;
		--accent-green:  #5ac96f;
		--accent-plum:   #b39aff;
		--accent-teal:   #4fc2d8;
		--accent-red:    #ff8a80;

		--accent-blue-soft:   rgba(111,165,255,0.18);
		--accent-purple-soft: rgba(205,144,236,0.18);
		--accent-green-soft:  rgba(90,201,111,0.16);

		--on-accent: var(--bg);

		/* Must be re-declared here: a custom property containing var() is substituted
		   where it is DECLARED, so the :root copies would stay frozen at the light hues. */
		--task-1: var(--accent-green);
		--task-2: var(--accent-orange);
		--task-3: var(--accent-blue);
		--task-4: var(--accent-pink);
		--task-5: var(--accent-plum);
		--task-6: var(--accent-teal);
	}
	/* Map onto atlas-css's --theme-* names. Needs [data-theme-preset] PLUS a theme
	   class to outrank atlas's own body[data-theme-preset]. */
	body[data-theme-preset].theme-light,
	body[data-theme-preset].theme-dark {
		--theme-body-background:             var(--bg);
		--theme-body-background-translucent: var(--bg-translucent);
		--theme-card-background:             var(--card);
		--theme-text:                        var(--ink);
		--theme-body-text:                   var(--ink);
		--theme-text-subtle:                 var(--ink-soft);
		--theme-border:                      var(--card-border);
		--theme-primary:                     var(--accent-blue);
		--theme-primary-translucent:         var(--accent-blue-soft);
		--theme-primary-invert:              #ffffff;
		--theme-tertiary:                    var(--accent-purple);
		--theme-box-shadow-medium:           var(--shadow);
	}
	html, body { height:100%; margin:0; }
	html { font-size:100%; }
	body {
		display:flex; flex-direction:column; height:100vh; overflow:hidden;
		font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; color:var(--ink);
	}
	body.theme-light, body.theme-dark { background: var(--bg); }
	.app-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-shrink:0; font-size:16px; background:var(--bg-soft); }
	#stage {
		position:relative; flex:1 1 auto; width:100%; min-height:0;
		display:flex; align-items:center; justify-content:center;
		overflow:hidden; container-type:size; padding:1.5rem 2.5rem 5rem;
	}
	#stage:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--accent-blue); outline-offset:3px; border-radius:4px; }
	#stage-frame {
		position:relative; overflow:hidden; box-sizing:border-box;
		width:min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio:16/9; max-width:100%; max-height:100%;
		border-radius:16px; border:2px solid var(--card-border);
		background:var(--bg-soft); box-shadow:var(--shadow-strong);
	}

	.scene {
		position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); transform-origin:center center;
		width:min(1150px, 96%); z-index:10;
		display:flex; flex-direction:column; align-items:center; gap:1.1rem;
	}
	@keyframes awSceneIn { from { opacity:0; } to { opacity:1; } }
	@keyframes awSceneOut { from { opacity:1; } to { opacity:0; } }
	.scene.scene-in { animation:awSceneIn 0.2s ease both; }
	.scene.scene-out { animation:awSceneOut 0.2s ease both; }
	.scene-title { font-size:2.3rem; font-weight:700; color:var(--accent-purple); margin:0; text-align:center; opacity:0; }
	.scene-lead { margin:0; text-align:center; font-size:1.25rem; color:var(--ink); max-width:min(1080px,96%); line-height:1.5; opacity:0; }

	.callout {
		position:absolute; max-width:340px; padding:1rem 1.2rem;
		background:color-mix(in srgb, var(--card) 88%, transparent);
		-webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
		border:1px solid var(--card-border); border-left:4px solid var(--accent-purple);
		border-radius:8px; box-shadow:var(--shadow);
		font-size:1.02rem; line-height:1.45; color:var(--ink); z-index:14; opacity:0; cursor:grab; touch-action:none;
	}
	.callout:active { cursor:grabbing; }

	/* ── task ribbon · which lab task the current step belongs to ── */
	.task-ribbon { display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap; justify-content:center; opacity:0; }
	.task-chip {
		display:inline-flex; align-items:center; gap:0.4rem; padding:0.24rem 0.7rem; border-radius:999px;
		font-size:0.85rem; font-weight:600; border:1.5px solid var(--card-border);
		color:var(--ink-soft); background:transparent; transition:all .2s ease;
	}
	.task-chip.is-now { border-color:var(--tc); color:var(--on-accent); background:var(--tc); }
	.task-chip.is-done { border-color:var(--tc); color:var(--tc); }
	/* dashed = optional task, solid = core — so the split stays visible on every task step */
	.task-chip.is-opt { border-style:dashed; }

	/* ── ACHIEVEMENT · closes each task with what the learner can now do ── */
	.achieve { display:flex; align-items:center; gap:0.65rem; max-width:min(1000px,98%);
		padding:0.45rem 1.05rem; border-radius:999px; border:2px solid var(--accent-green);
		background:var(--accent-green-soft); opacity:0; }
	.achieve .ach-tag { flex:none; padding:2px 10px; border-radius:999px; font-size:0.78rem; font-weight:600;
		letter-spacing:0.06em; text-transform:uppercase; color:var(--on-accent); background:var(--accent-green); }
	.achieve .ach-tag.is-opt { background:var(--ink-soft); }
	.achieve .ach-lead { flex:none; font-size:1.05rem; color:var(--accent-green); }
	.achieve .ach-t { font-size:1rem; line-height:1.35; }

	/* ── ASSEMBLY · the persistent "what you're building" diagram ── */
	.asm { position:relative; display:flex; flex-direction:column; align-items:center; gap:2.4rem; width:min(1060px,98%); }
	/* Wire tree from the core down to each slot — measured in JS, so it can be drawn in. */
	.asm-wires { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; z-index:0; }
	.asm-wire { fill:none; stroke:var(--sc, var(--card-border)); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
	.asm-core {
		position:relative; z-index:1;
		display:flex; align-items:center; gap:0.85rem; padding:0.7rem 1.35rem; border-radius:16px;
		border:2.5px solid var(--accent-purple); background:var(--accent-purple-soft);
		box-shadow:var(--shadow); opacity:0;
	}
	.asm-core .ac-ico { font-size:1.9rem; line-height:1; color:var(--accent-purple); }
	.asm-core .ac-name { font-size:1.25rem; font-weight:600; }
	.asm-core .ac-sub { font-size:0.95rem; color:var(--ink-soft); }
	.asm-row { position:relative; z-index:1; display:flex; gap:0.85rem; width:100%; align-items:stretch; }
	.slot {
		position:relative; flex:1 1 0; min-width:0; padding:0.85rem 0.9rem 0.9rem;
		border:2px dashed var(--card-border); border-radius:14px; background:var(--bg-soft);
		display:flex; flex-direction:column; gap:0.35rem; opacity:0;
		transition:border-color .35s ease, background .35s ease, box-shadow .35s ease;
	}
	.slot .slot-task {
		align-self:flex-start; font-size:0.8rem; font-weight:600; letter-spacing:0.04em;
		padding:2px 8px; border-radius:5px; border:1px solid var(--card-border); color:var(--ink-soft);
	}
	.slot .slot-h { display:flex; align-items:center; gap:0.45rem; font-size:1.1rem; font-weight:600; }
	.slot .slot-h .ic { color:var(--ink-soft); transition:color .35s ease; }
	.slot .slot-p { font-size:0.95rem; line-height:1.4; color:var(--ink-soft); }
	.slot.is-dim { opacity:0.42; }
	.slot.is-on {
		opacity:1; border-style:solid; border-color:var(--sc);
		background:color-mix(in srgb, var(--sc) 12%, var(--bg-soft));
		box-shadow:0 6px 22px color-mix(in srgb, var(--sc) 26%, transparent);
	}
	.slot.is-on .slot-h .ic { color:var(--sc); }
	.slot.is-on .slot-task { border-color:var(--sc); color:var(--sc); }
	.slot .slot-flag {
		position:absolute; top:-0.7rem; right:0.6rem; padding:2px 9px; border-radius:999px;
		font-size:0.8rem; font-weight:600; color:var(--on-accent); background:var(--accent-orange);
		box-shadow:var(--shadow); opacity:0; white-space:nowrap;
	}
	.slot .slot-flag.is-live { background:var(--accent-green); }

	/* ── CHAT ── */
	.chat { display:flex; flex-direction:column; gap:0.65rem; width:min(820px,96%); }
	.bubble {
		padding:0.75rem 1.1rem; border-radius:14px; font-size:1.1rem; line-height:1.45; opacity:0;
		border:1.5px solid var(--card-border); background:var(--card); color:var(--ink);
	}
	.bubble.is-user { align-self:flex-start; border-bottom-left-radius:4px; max-width:90%; }
	.bubble.is-bot { align-self:flex-end; border-bottom-right-radius:4px; max-width:90%; }
	.bubble .bub-who { display:block; font-size:0.82rem; font-weight:600; letter-spacing:0.05em;
		text-transform:uppercase; color:var(--ink-soft); margin-bottom:0.25rem; }
	.bubble.is-bad { border-color:var(--accent-red); background:color-mix(in srgb, var(--accent-red) 10%, var(--card)); }
	.bubble.is-good { border-color:var(--accent-green); background:color-mix(in srgb, var(--accent-green) 10%, var(--card)); }
	.verdict {
		display:inline-flex; align-items:center; gap:0.45rem; padding:0.42rem 1rem; border-radius:999px;
		font-size:1.02rem; font-weight:600; opacity:0; align-self:center;
	}
	.verdict.is-bad { border:2px solid var(--accent-red); color:var(--accent-red); background:color-mix(in srgb, var(--accent-red) 10%, transparent); }
	.verdict.is-good { border:2px solid var(--accent-green); color:var(--accent-green); background:color-mix(in srgb, var(--accent-green) 10%, transparent); }
	.cite { display:flex; align-items:center; gap:0.35rem; margin-top:0.45rem; font-size:0.9rem;
		font-weight:600; color:var(--accent-green); }
	.cite .ic { font-size:0.95rem; }

	/* ── PORTAL MOCK · a browser window showing the Foundry portal ── */
	.ui-win {
		width:min(760px,96%); border:1.5px solid var(--card-border); border-radius:10px; overflow:hidden;
		background:var(--bg-soft); box-shadow:var(--shadow-strong); opacity:0;
	}
	.ui-chrome { display:flex; align-items:flex-end; gap:0.5rem; padding:0.35rem 0.5rem 0;
		background:color-mix(in srgb, var(--ink) 10%, transparent); }
	.ui-tab { display:flex; align-items:center; gap:0.4rem; padding:0.32rem 0.75rem; font-size:0.82rem; font-weight:500;
		background:var(--bg-soft); border:1px solid var(--card-border); border-bottom:none;
		border-radius:7px 7px 0 0; color:var(--ink); }
	.ui-tab img { width:15px; height:15px; display:block; }
	.ui-tab .tab-x { color:var(--ink-soft); font-size:0.75rem; margin-left:0.15rem; }
	.ui-winbtns { display:flex; margin-left:auto; align-self:flex-start; }
	.ui-winbtns span { display:inline-flex; align-items:center; justify-content:center; width:1.9rem; height:1.4rem;
		font-size:0.7rem; color:var(--ink-soft); }
	.ui-winbtns span.win-close:hover { background:#e81123; color:#fff; }
	.ui-addr { display:flex; align-items:center; gap:0.5rem; padding:0.4rem 0.6rem;
		background:var(--bg-soft); border-bottom:1px solid var(--card-border); }
	.ui-nav { display:flex; gap:0.3rem; color:var(--ink-soft); font-size:0.9rem; }
	.ui-url { flex:1; display:flex; align-items:center; gap:0.4rem; padding:0.22rem 0.65rem; border-radius:999px;
		border:1px solid var(--card-border); background:color-mix(in srgb, var(--ink) 5%, transparent);
		font-size:0.82rem; color:var(--ink-soft); }
	.ui-portal { display:flex; align-items:center; gap:0.5rem; padding:0.55rem 1rem;
		border-bottom:1px solid var(--card-border); }
	.ui-portal img { width:22px; height:22px; display:block; }
	.ui-brand { font-size:1rem; font-weight:600; color:var(--ink); }
	.ui-crumb { margin-left:auto; font-size:0.85rem; color:var(--ink-soft); }
	.ui-body { padding:0.85rem 1rem; display:flex; flex-direction:column; gap:0.55rem;
		background:var(--card); }
	.ui-row { display:flex; align-items:center; gap:0.55rem; padding:0.5rem 0.75rem; border-radius:9px;
		border:1.5px solid var(--card-border); font-size:1.02rem; opacity:0;
		background:var(--bg-soft); color:var(--ink); }
	.ui-row.is-add { border-style:dashed; color:var(--ink-soft); background:transparent; }
	.ui-row.is-new { border-color:var(--accent-green); background:color-mix(in srgb, var(--accent-green) 10%, var(--card)); }
	.ui-row .ui-tag { margin-left:auto; font-size:0.82rem; font-weight:600; color:var(--accent-green); }
	.ui-row .ic { color:var(--ink-soft); }
	.ui-row.is-new .ic { color:var(--accent-green); }
	.ui-file { font-family:'Cascadia Code','Consolas',monospace; font-size:0.95rem; }

	/* ── CODE ── */
	.code-card { width:min(720px,96%); border:1px solid #30363d; border-radius:8px; background:#1e1e1e;
		overflow:hidden; opacity:0; box-shadow:0 8px 26px rgba(0,0,0,0.3); }
	.code-head { display:flex; align-items:center; justify-content:space-between; padding:0 0 0 0.85rem;
		background:#323233; border-bottom:1px solid #1e1e1e; }
	.code-file { font-size:0.88rem; color:#ccc; font-weight:500; padding:0.5rem 0; }
	.code-winctrls { display:flex; }
	.code-wbtn { display:flex; align-items:center; justify-content:center; width:2.3rem; padding:0.45rem 0;
		color:#ccc; font-size:0.68rem; }
	.code-wbtn.is-close:hover { background:#e81123; color:#fff; }
	.code-body { margin:0; padding:0.75rem 1rem; font-family:'Cascadia Code','Consolas',monospace;
		font-size:0.9rem; line-height:1.55; color:#d4d4d4; white-space:pre-wrap; }
	.code-body .tok-com { color:#6a9955; } .code-body .tok-kw { color:#569cd6; }
	.code-body .tok-str { color:#ce9178; } .code-body .tok-fn { color:#dcdcaa; }
	.code-hl { border-radius:4px; padding:0 0.15em; box-shadow:0 0 0 1px rgba(96,165,250,0.55); background:rgba(96,165,250,0.22); }

	/* ── HANDSHAKE · the MCP approval pause ── */
	.hs { display:flex; align-items:stretch; gap:0.7rem; width:min(1000px,98%); }
	.hs-node {
		flex:1 1 0; min-width:0; padding:0.85rem 0.9rem; border-radius:13px; border:2px solid var(--hc);
		background:color-mix(in srgb, var(--hc) 10%, transparent); opacity:0;
		display:flex; flex-direction:column; gap:0.3rem; text-align:center; align-items:center;
	}
	.hs-node .hs-n { font-size:0.82rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--hc); }
	.hs-node.is-cmd .hs-n { text-transform:none; letter-spacing:0; font-family:'Cascadia Code','Consolas',monospace; font-size:0.88rem; }
	.hs-node .hs-t { font-size:1.08rem; font-weight:600; line-height:1.3; }
	.hs-node .hs-s { font-size:0.92rem; color:var(--ink-soft); line-height:1.35; }
	.hs-arrow { align-self:center; font-size:1.7rem; color:var(--ink-soft); opacity:0; flex:none; }

	/* ── PILLS / RECAP ── */
	.chip-row { display:flex; flex-wrap:wrap; gap:0.6rem; justify-content:center; }
	.pill { display:inline-flex; align-items:center; gap:0.45rem; padding:0.45rem 1rem; border-radius:999px;
		font-size:1rem; font-weight:600; border:2px solid var(--accent-purple);
		background:var(--accent-purple-soft); color:var(--ink); opacity:0; }
	.value-chip { display:inline-flex; align-items:center; gap:0.4rem; padding:0.42rem 0.95rem; border-radius:999px;
		font-size:1rem; font-weight:600; border:2px solid var(--accent-green);
		background:var(--accent-green-soft); color:var(--ink); opacity:0; }
	.recap-foot { font-size:1.05rem; text-align:center; max-width:820px; opacity:0; color:var(--ink); }

	/* ── OUTCOMES · what core earned you, what optional added ── */
	.outcomes { display:flex; flex-direction:column; gap:0.5rem; width:min(1010px,98%); }
	.outcome { display:flex; align-items:center; gap:0.8rem; padding:0.55rem 1rem; border-radius:12px;
		border:2px solid var(--oc); background:color-mix(in srgb, var(--oc) 9%, transparent); opacity:0; }
	.outcome .oc-tag { flex:none; min-width:5.4rem; text-align:center; padding:2px 10px; border-radius:999px;
		font-size:0.78rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--on-accent); background:var(--oc); }
	.outcome .oc-task { flex:none; font-size:0.9rem; font-weight:600; color:var(--oc); }
	.outcome .oc-t { font-size:1rem; line-height:1.35; }
	.outcome .oc-v { margin-left:auto; flex:none; font-size:0.9rem; font-weight:600; color:var(--ink-soft); }

	/* ── OVERVIEW · the six tasks at a glance ── */
	.ov-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.7rem; width:min(1090px,98%); }

const themeToggleBtn = document.getElementById('theme-toggle');
function syncThemeBtn(){
	if(!themeToggleBtn) return;
	const isDark = document.body.classList.contains('theme-dark');
	themeToggleBtn.dataset.theme = isDark ? 'dark' : 'light';
	themeToggleBtn.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
}
if (window.AW && AW.theme) { AW.theme.onChange(syncThemeBtn); syncThemeBtn(); }
else {
	try { const s=localStorage.getItem('aw-theme'); if(s){ document.body.classList.remove('theme-dark','theme-light'); document.body.classList.add(s); } } catch(_){}
	syncThemeBtn();
	themeToggleBtn.addEventListener('click', () => {
		const dark = !document.body.classList.contains('theme-dark');
		document.body.classList.remove('theme-dark','theme-light');
		document.body.classList.add(dark ? 'theme-dark' : 'theme-light');
		try { localStorage.setItem('aw-theme', dark ? 'theme-dark':'theme-light'); } catch(_){}
		syncThemeBtn();
	});
}

// Wire tree core -> bus -> each slot. Measured after mount, in unscaled layout px
// (divide by the live scene scale so it works whether or not fitScene has run yet).
function drawAssemblyWires(asm){
	if(!asm) return [];
	const core=asm.querySelector('.asm-core'), slots=[...asm.querySelectorAll('.slot')];
	const old=asm.querySelector('.asm-wires'); if(old) old.remove();
	if(!core||!slots.length||!asm.offsetWidth) return [];
	const aB=asm.getBoundingClientRect(), k=(aB.width/asm.offsetWidth)||1;
	const rel=n=>{ const r=n.getBoundingClientRect();
		return { l:(r.left-aB.left)/k, t:(r.top-aB.top)/k, w:r.width/k, h:r.height/k }; };
	const c=rel(core), cx=c.l+c.w/2, y0=c.t+c.h;
	const NS='http://www.w3.org/2000/svg';
	const svg=document.createElementNS(NS,'svg');
	svg.setAttribute('class','asm-wires');
	svg.setAttribute('width', asm.offsetWidth); svg.setAttribute('height', asm.offsetHeight);
	const paths=slots.map(function(s){
		const b=rel(s), sx=b.l+b.w/2, y1=b.t, bus=y0+(y1-y0)/2;
		const p=document.createElementNS(NS,'path');
		p.setAttribute('d','M'+cx+','+y0+' V'+bus+' H'+sx+' V'+y1);
		p.setAttribute('class','asm-wire');
		const sc=s.style.getPropertyValue('--sc');
		if(sc && s.classList.contains('is-on')) p.style.setProperty('--sc', sc);
		svg.appendChild(p);
		return p;
	});
	asm.insertBefore(svg, asm.firstChild);
	return paths;
}
// Box by box: the wire draws from the core to a slot, then that slot lands.
function animateAssembly(tl, asm, at){
	const core=asm.querySelector('.asm-core'), slots=[...asm.querySelectorAll('.slot')];
	const wires=drawAssemblyWires(asm);
	wires.forEach(function(p){ const L=p.getTotalLength(); gsap.set(p,{strokeDasharray:L, strokeDashoffset:L}); });
	tl.fromTo(core,{opacity:0,y:14,scale:0.97},{opacity:1,y:0,scale:1,duration:0.5,ease:'back.out(1.4)'}, at);
	slots.forEach(function(s,i){
		const p=wires[i], flag=s.querySelector('.slot-flag');
		if(p) tl.to(p,{strokeDashoffset:0,duration:0.25,ease:'power1.inOut'}, i? '-=0.08' : '-=0.05');
		tl.fromTo(s,{opacity:0,y:12},{opacity:s.classList.contains('is-dim')?0.42:1,y:0,duration:0.28,ease:'power2.out'},'-=0.06');
		if(flag) tl.fromTo(flag,{opacity:0,scale:0.6},{opacity:1,scale:1,duration:0.28,ease:'back.out(2)'},'-=0.12');
	});
}

// ── RENDER DISPATCH ───────────────────────
function renderStep(i){
	if(i<0||i>=STEPS.length) return;
	if(animating){ liveTimelines.forEach(tl=>tl.kill()); liveTimelines=[]; animating=false; }
	animating=true;
	const step=STEPS[i];
	const outgoing=stage.querySelector('.scene:not(.scene-out)');
	if(outgoing) liveEls=liveEls.filter(x=>x!==outgoing);
	clearStage();
	if(outgoing){
		outgoing.style.zIndex='5';
		if(motionPaused) outgoing.remove();
		else { outgoing.classList.remove('scene-in'); outgoing.classList.add('scene-out'); setTimeout(()=>outgoing.remove(),240); }
	}
	RENDERERS[step.id]();
	const incoming=stage.querySelector('.scene:not(.scene-out)');
	if(incoming && !motionPaused) incoming.classList.add('scene-in');
	fitScene(incoming);
	current=i;
	try{ const u=new URL(location.href); u.searchParams.set('step',String(i+1)); history.replaceState(null,'',u); }catch(_){}
	counter.textContent=(current+1)+' / '+STEPS.length;
	breadcrumb.textContent=t(step.captionKey);
	progress.style.width=((current+1)/STEPS.length*100)+'%';
	renderOutline(step,i);
	announcer.textContent='Step '+(i+1)+' of '+STEPS.length+': '+t(step.titleKey)+'. '+t(step.descKey);
	if(typeof playStepAudio==='function') playStepAudio(i);
}

const TASK_PANELS = {
	1:{ titleKey:'groundTitle', descKey:'groundDesc', noteKey:'gapNote',       build:panelGround },
	2:{ titleKey:'mcpTitle',    descKey:'mcpDesc',    noteKey:'apprCallout',   build:panelMcp },

	6:{ titleKey:'hoTitle',     descKey:'hoDesc',     noteKey:'hoCallout',     build:panelHosted }
};
let taskTl=null;

function buildTaskPanel(n){
	const cfg=TASK_PANELS[n], panel=el('task-panel');
	cfg.build().forEach(e=>panel.appendChild(e));
	panel.appendChild(achievement(n));
	panel.appendChild(el('task-note', t(cfg.noteKey)));
	return panel;
}

// The six panels differ in height (Task 1 is much the tallest), and fitScene scales the whole
// scene to fit — so without a reserve the UI visibly resizes on every task switch. Measure all
// six once and pin the body to the tallest, giving every task ONE scale.
function reserveTaskBody(scene){
	const body=scene&&scene.querySelector('.task-body'); if(!body) return;
	const keep=body.firstChild;
	body.style.minHeight='';
	let max=0;
	for(let n=1;n<=6;n++){
		body.innerHTML='';
		const p=buildTaskPanel(n); body.appendChild(p);
		if(p.offsetHeight>max) max=p.offsetHeight;
	}
	body.innerHTML='';
	if(keep) body.appendChild(keep);
	body.style.minHeight=(max+1)+'px';   // +1: offsetHeight rounds, so the tallest panel must not exceed its own reserve
}

function selectTask(n, initial){
	const scene=stage.querySelector('.scene:not(.scene-out)');
	if(!scene) return;
	const cfg=TASK_PANELS[n];
	scene.querySelector('.scene-title').textContent=t(cfg.titleKey);
	scene.querySelector('.scene-lead').textContent=t(cfg.descKey);
	scene.querySelectorAll('.task-btn').forEach(function(b){
		const on=+b.getAttribute('data-task')===n;
		b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', on?'true':'false');
	});
	const body=scene.querySelector('.task-body');
	if(taskTl){ taskTl.kill(); taskTl=null; }
	body.innerHTML='';
	const panel=buildTaskPanel(n);
	body.appendChild(panel);
	fitScene(scene);
	const parts=[...panel.querySelectorAll('.ui-win,.ui-row,.code-card,.bubble,.hs-node,.hs-arrow,.pill,.achieve,.task-note')];
	if(motionPaused) gsap.set(parts,{opacity:1,x:0,y:0,scale:1});
	else {
		taskTl=gsap.timeline(); liveTimelines.push(taskTl);
		taskTl.fromTo(parts,{opacity:0,y:12},{opacity:1,y:0,duration:0.36,stagger:0.08,ease:'power2.out'});
	}
	if(!initial){ try{ const u=new URL(location.href); u.searchParams.set('task',String(n)); history.replaceState(null,'',u); }catch(_){} }
	announcer.textContent=t('tTaskLong'+n)+'. '+t(cfg.titleKey)+'. '+t(cfg.descKey);
}

function renderTasks(){
	const step=stepById('tasks'), scene=buildScene(step);
	scene.classList.add('is-top');
	const picker=el('task-picker');
	const row=el('task-picker-row');
	for(let n=1;n<=6;n++){
		const b=document.createElement('button');
		b.type='button'; b.className='task-btn';
		b.setAttribute('data-task', n); b.setAttribute('aria-pressed','false');
		if(!TASK_CORE[n]) b.classList.add('is-opt');
		b.style.setProperty('--tc', TASK_COLORS[n]);
		b.innerHTML='<i></i><span>'+t('tTaskLong'+n)+'</span>';
		b.addEventListener('click', ()=>selectTask(n));
		// Space/Enter are bound to "next step" on document, so keep them on the button
		b.addEventListener('keydown', e=>{ if(e.code==='Space'||e.code==='Enter') e.stopPropagation(); });
		row.appendChild(b);
	}
	picker.appendChild(row);
	picker.appendChild(el('task-picker-hint', t('tasksHint')));
	// first child, so nothing above it can shift it as panels change height
	scene.insertBefore(picker, scene.firstChild);
	scene.appendChild(el('task-body'));
	mount(scene);
	const c=maybeCallout(step);
	if(motionPaused){ gsap.set([].concat(headerEls(scene),[picker]),{opacity:1}); if(c) gsap.set(c,{opacity:1}); animating=false; }
	else {
		const tl=baseTl(scene);
		tl.fromTo(picker,{opacity:0,y:-8},{opacity:1,y:0,duration:0.35},'-=0.15');
		if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.5},'-=0.1');
	}
	const q=new URLSearchParams(location.search);
	const wanted=parseInt(q.get('task'),10);
	reserveTaskBody(scene);
	selectTask(wanted>=1&&wanted<=6 ? wanted : 1, true);
	// the audience window can't be clicked, so walk the tasks automatically
	if(q.has('present')){
		const walk=gsap.timeline({delay:1.4}); liveTimelines.push(walk);
		for(let n=2;n<=6;n++) walk.call(()=>selectTask(n, true), null, '+=1.0');
	}
}

// Captions can run WITHOUT sound — with CC on and audio off the clip plays muted purely as the
// timing source, so the caption still reveals at the narrator's pace.
const AUDIO_BASE='audio/BuildAndExtendAgents/';
const AUDIO_FILES=['step-01.mp3','step-02.mp3','step-03.mp3','step-04.mp3','step-05.mp3','step-06.mp3'];
let audioEnabled=false, ccPref=false, currentAudio=null, audioTimeout=null;
const audioBtn=document.getElementById('audio-toggle'), ccBtn=document.getElementById('cc-toggle');
if(audioBtn) audioBtn.innerHTML='<span class="aw-audio-ico" aria-hidden="true">\uD83D\uDD07</span><span class="aw-audio-time" aria-hidden="true">--:--</span>';
const audioIco=audioBtn&&audioBtn.querySelector('.aw-audio-ico'), audioTimeEl=audioBtn&&audioBtn.querySelector('.aw-audio-time');
function playbackOn(){ return audioEnabled || ccPref; }
function fmtDur(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateAudioTime(){ if(audioTimeEl&&currentAudio&&isFinite(currentAudio.duration)&&currentAudio.duration>0) audioTimeEl.textContent=fmtDur(currentAudio.duration-currentAudio.currentTime); }
function syncAudioBtn(){
	if(!audioBtn) return;
	if(audioIco) audioIco.textContent=audioEnabled?'\uD83D\uDD0A':'\uD83D\uDD07';
	if(audioTimeEl&&!playbackOn()) audioTimeEl.textContent='--:--';
	audioBtn.classList.toggle('toggle-active',audioEnabled);
	audioBtn.setAttribute('aria-pressed',audioEnabled?'true':'false');
	audioBtn.setAttribute('data-tip','Narration: '+(audioEnabled?'On':'Off'));
}
function speakFallback(i){
	if(!window.speechSynthesis) return;
	const step=STEPS[i]; const u=new SpeechSynthesisUtterance(t(step.titleKey)+'. '+t(step.descKey));
	u.lang='en'; try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(_){}
}
function stopAudio(){
	if(currentAudio){ currentAudio.pause(); currentAudio.currentTime=0; currentAudio=null; }
	if(audioTimeout){ clearTimeout(audioTimeout); audioTimeout=null; }
	if(audioTimeEl) audioTimeEl.textContent='--:--';
	try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
	if(window.AWCaptions) AWCaptions.clear();
}
function playStepAudio(i){
	stopAudio();
	if(document.body.classList.contains('aw-prestart')) return;   // the start gate holds audio too
	if(!playbackOn() || i<0 || i>=STEPS.length) return;
	audioTimeout=setTimeout(function(){
		audioTimeout=null;
		const file=AUDIO_FILES[i];
		if(!file){ if(audioEnabled) speakFallback(i); return; }
		currentAudio=new Audio(AUDIO_BASE+file);
		currentAudio.volume=audioEnabled?1:0;
		if(window.AWCaptions) AWCaptions.bind(currentAudio,i);
		currentAudio.addEventListener('loadedmetadata',updateAudioTime);
		currentAudio.addEventListener('timeupdate',updateAudioTime);
		currentAudio.addEventListener('ended',function(){ if(audioTimeEl) audioTimeEl.textContent='0:00'; });
		currentAudio.addEventListener('error',function(){ if(audioEnabled) speakFallback(i); });
		currentAudio.play().catch(function(){});
	},400);
}
function syncCcBtn(){
	if(!ccBtn) return;
	ccBtn.classList.toggle('toggle-active',ccPref);
	ccBtn.setAttribute('aria-pressed',ccPref?'true':'false');
	ccBtn.setAttribute('data-tip','Captions: '+(ccPref?'On':'Off'));
	document.body.classList.toggle('cc-on',ccPref);
}
function applyCc(){
	if(window.AWCaptions){ AWCaptions.setEnabled(ccPref); if(ccPref&&currentAudio) AWCaptions.bind(currentAudio,current); }
	syncCcBtn();
}
if(window.AWCaptions){ AWCaptions.configure({ page:'BuildAndExtendAgents', base:'../../narration/v2/AgentLab/',
	lang:()=>'en', fallback:(i)=>(STEPS[i]?t(STEPS[i].descKey):''), reserve:false }); }
if(audioBtn) audioBtn.addEventListener('click',function(){
	audioEnabled=!audioEnabled; try{localStorage.setItem('aw-lab-audio',audioEnabled?'1':'0');}catch(_){}
	syncAudioBtn();
	if(current>=0){
		if(!playbackOn()) stopAudio();
		else if(currentAudio) currentAudio.volume=audioEnabled?1:0;   // flip sound without restarting
		else playStepAudio(current);
	}
	applyCc();
});
if(ccBtn) ccBtn.addEventListener('click',function(){
	ccPref=!ccPref; try{localStorage.setItem('aw-lab-cc',ccPref?'1':'0');}catch(_){}
	applyCc();
	if(current>=0){
		if(playbackOn()&&!currentAudio) playStepAudio(current);
		else if(!playbackOn()&&currentAudio) stopAudio();
	}
});
(function(){
	let p=null; try{ p=new URLSearchParams(location.search).get('audio'); }catch(_){}
	if(p==='on'){ audioEnabled=true; ccPref=true; }        // silent start unless the URL opts in
	else if(p==='off'){ audioEnabled=false; ccPref=false; }
	else { try{
		const a=localStorage.getItem('aw-lab-audio'); if(a==='1') audioEnabled=true; else if(a==='0') audioEnabled=false;
		const c=localStorage.getItem('aw-lab-cc');    if(c==='1') ccPref=true;      else if(c==='0') ccPref=false;
	}catch(_){} }
}());

// ── CONTROLS ──────────────────────────────
function interruptAnimation(){ liveTimelines.forEach(tl=>tl.kill()); liveTimelines=[]; animating=false; }
function next(){ interruptAnimation(); if(current<STEPS.length-1) renderStep(current+1); }
function prev(){ interruptAnimation(); if(current>0) renderStep(current-1); }
function reset(){ interruptAnimation(); renderStep(0); }
function replay(){ if(current<0) return; interruptAnimation(); renderStep(current); }
document.getElementById('next-btn').addEventListener('click',next);
document.getElementById('prev-btn').addEventListener('click',prev);
document.getElementById('replay-btn').addEventListener('click',replay);
document.getElementById('reset-btn').addEventListener('click',reset);

// ── Drag (outline · callout · caption) ────
// Panels snap to position:fixed on first grab, stay inside the viewport, and grow a
// reset pin once moved or resized. The caption also persists its size.
function dragify(elm, key){
	if(!elm || elm.__awDrag) return; elm.__awDrag=true;
	let dragging=false, sx=0, sy=0, bl=0, bt=0, moved=false;
	const resizable=getComputedStyle(elm).resize!=='none';
	const sizeKey=key?key+'-size':null;
	const home={ position:elm.style.position, left:elm.style.left, top:elm.style.top, right:elm.style.right,
		bottom:elm.style.bottom, margin:elm.style.margin, transform:elm.style.transform,
		width:elm.style.width, height:elm.style.height };
	const pin=document.createElement('button');
	pin.type='button'; pin.className='aw-drag-reset';
	pin.title='Reset to default position'; pin.setAttribute('aria-label','Reset to default position');
	pin.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';
	const oy=getComputedStyle(elm).overflowY, clips=(oy==='auto'||oy==='scroll'||oy==='hidden');
	pin.style.top=clips?'8px':'-10px'; pin.style.right=clips?'8px':'-10px';
	elm.appendChild(pin);
	function showPin(on){ pin.style.display=on?'flex':'none'; }
	pin.addEventListener('pointerdown',e=>e.stopPropagation());
	pin.addEventListener('click',e=>{
		e.preventDefault(); e.stopPropagation();
		Object.keys(home).forEach(k=>{ elm.style[k]=home[k]; });
		if(key){ try{ localStorage.removeItem(key); }catch(_){} }
		if(sizeKey){ try{ localStorage.removeItem(sizeKey); }catch(_){} }
		showPin(false);
	});
	function fix(left,top){
		const w=elm.offsetWidth, h=elm.offsetHeight;
		left=Math.max(6, Math.min(left, window.innerWidth-w-6));
		top =Math.max(6, Math.min(top,  window.innerHeight-h-6));
		elm.style.position='fixed'; elm.style.left=left+'px'; elm.style.top=top+'px';
		elm.style.right='auto'; elm.style.bottom='auto'; elm.style.margin='0'; elm.style.transform='none';
	}
	if(resizable && typeof ResizeObserver!=='undefined'){
		let rt;
		new ResizeObserver(()=>{
			if(elm.style.width || elm.style.height){
				showPin(true);
				if(sizeKey){ clearTimeout(rt); rt=setTimeout(()=>{ try{ localStorage.setItem(sizeKey, JSON.stringify({w:elm.style.width,h:elm.style.height})); }catch(_){} },150); }
			}
		}).observe(elm);
	}
	elm.addEventListener('pointerdown',e=>{
		if(e.button!==0 || (e.target.closest && e.target.closest('a,button,select,input,textarea'))) return;
		if(resizable){ const r=elm.getBoundingClientRect(); if(e.clientX>r.right-18 && e.clientY>r.bottom-18) return; }  // let the resize grip win
		dragging=true; moved=false;
		const r=elm.getBoundingClientRect(); bl=r.left; bt=r.top; sx=e.clientX; sy=e.clientY;
		fix(bl,bt);
		try{ elm.setPointerCapture(e.pointerId); }catch(_){}
		e.preventDefault();
	});
	elm.addEventListener('pointermove',e=>{
		if(!dragging) return;
		const dx=e.clientX-sx, dy=e.clientY-sy;
		if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
		fix(bl+dx, bt+dy);
	});
	function end(e){ if(!dragging) return; dragging=false;
		try{ elm.releasePointerCapture(e.pointerId); }catch(_){}
		if(moved){ showPin(true); if(key){ try{ const r=elm.getBoundingClientRect(); localStorage.setItem(key, JSON.stringify({left:r.left,top:r.top})); }catch(_){} } } }
	elm.addEventListener('pointerup',end); elm.addEventListener('pointercancel',end);
	if(sizeKey){ try{ const z=JSON.parse(localStorage.getItem(sizeKey)||'null'); if(z&&(z.w||z.h)){ if(z.w) elm.style.width=z.w; if(z.h) elm.style.height=z.h; showPin(true); } }catch(_){} }
	if(key){ try{ const s=JSON.parse(localStorage.getItem(key)||'null'); if(s&&isFinite(s.left)&&isFinite(s.top)){ fix(s.left,s.top); showPin(true); } }catch(_){} }
}
dragify(outlinePanel,'aw-lab-outline-pos');
dragify(document.getElementById('aw-caption'),'aw-lab-caption-pos');

// ── Movable / pinnable control dock ───────
(function(){
	const dock=document.getElementById('controls'), grip=document.getElementById('ctrl-grip'), pin=document.getElementById('ctrl-pin');
	if(!dock||!grip) return;
	const KEY='aw-lab-controls-pos';
	let dragging=false, sx=0, sy=0, bl=0, bt=0, moved=false;
	function place(left,top){
		const w=dock.offsetWidth, h=dock.offsetHeight;
		left=Math.max(6, Math.min(left, window.innerWidth-w-6));
		top =Math.max(6, Math.min(top,  window.innerHeight-h-6));
		dock.style.left=left+'px'; dock.style.top=top+'px';
		dock.style.right='auto'; dock.style.bottom='auto'; dock.style.transform='none';
		document.body.classList.add('controls-floating');
	}
	function recenter(){
		dock.style.left=dock.style.top=dock.style.right=dock.style.bottom=dock.style.transform='';
		document.body.classList.remove('controls-floating');
		try{ localStorage.removeItem(KEY); }catch(_){}
	}
	grip.addEventListener('pointerdown',e=>{
		e.preventDefault(); dragging=true; moved=false;
		const r=dock.getBoundingClientRect(); bl=r.left; bt=r.top; sx=e.clientX; sy=e.clientY;
		try{ grip.setPointerCapture(e.pointerId); }catch(_){}
	});
	grip.addEventListener('pointermove',e=>{
		if(!dragging) return;
		const dx=e.clientX-sx, dy=e.clientY-sy;
		if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
		place(bl+dx, bt+dy);
	});
	function end(e){ if(!dragging) return; dragging=false;
		try{ grip.releasePointerCapture(e.pointerId); }catch(_){}
		if(moved){ try{ const r=dock.getBoundingClientRect(); localStorage.setItem(KEY, JSON.stringify({left:r.left,top:r.top})); }catch(_){} } }
	grip.addEventListener('pointerup',end); grip.addEventListener('pointercancel',end);
	grip.addEventListener('keydown',e=>{
		const d=e.shiftKey?40:12, r=dock.getBoundingClientRect(); let ok=true;
		if(e.key==='ArrowLeft') place(r.left-d, r.top);
		else if(e.key==='ArrowRight') place(r.left+d, r.top);
		else if(e.key==='ArrowUp') place(r.left, r.top-d);
		else if(e.key==='ArrowDown') place(r.left, r.top+d);
		else ok=false;
		if(ok){ e.preventDefault(); e.stopPropagation(); }
	});
	if(pin) pin.addEventListener('click',e=>{ e.stopPropagation(); recenter(); });
	window.addEventListener('resize',()=>{ if(document.body.classList.contains('controls-floating')){ const r=dock.getBoundingClientRect(); place(r.left,r.top); } });
	try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s.left==='number') place(s.left,s.top); }catch(_){}
})();

// ── Keyboard shortcut help overlay (? key / the ? button) ──
(function(){
	const overlay=document.getElementById('shortcut-overlay'), btn=document.getElementById('help-toggle'),
		closeBtn=document.getElementById('sc-close'), list=document.getElementById('sc-list');
	if(!overlay||!list) return;
	const ROWS=[[['\u2192','Space'],'Next step'],[['\u2190'],'Previous step'],[['R'],'Restart'],
		[['P'],'Replay this step'],[['H'],'Hide / show top bar'],[['F'],'Full screen'],[['?'],'Toggle this help']];
	window.buildShortcuts=function(){
		list.innerHTML=ROWS.map(([keys,label])=>`<li><span>${label}</span><span class="sc-keys">${keys.map(k=>`<kbd>${k}</kbd>`).join('')}</span></li>`).join('');
	};
	buildShortcuts();
	function open(){ overlay.removeAttribute('hidden'); if(closeBtn) closeBtn.focus(); }
	function close(){ overlay.setAttribute('hidden',''); if(btn) btn.focus(); }
	function toggle(){ overlay.hasAttribute('hidden')?open():close(); }
	if(btn) btn.addEventListener('click',e=>{ e.stopPropagation(); toggle(); });
	if(closeBtn) closeBtn.addEventListener('click',e=>{ e.stopPropagation(); close(); });
	const bd=overlay.querySelector('.sc-backdrop'); if(bd) bd.addEventListener('click',close);
	document.addEventListener('keydown',e=>{
		const tag=(e.target.tagName||'').toLowerCase();
		if(tag==='input'||tag==='textarea'||tag==='select') return;
		if(e.key==='?'){ e.preventDefault(); e.stopPropagation(); toggle(); }
		else if(e.key==='Escape' && !overlay.hasAttribute('hidden')){ e.preventDefault(); close(); }
	});
})();

// ── Speed ─────────────────────────────────
const SPEED_STEPS=[0.5,0.75,1,1.25,1.5,2], BASE_TIMESCALE=0.25;
let speedIndex=SPEED_STEPS.indexOf(1);
try{ const sp=parseInt(localStorage.getItem('aw-lab-speed'),10); if(!isNaN(sp)&&sp>=0&&sp<SPEED_STEPS.length) speedIndex=sp; }catch(_){}
const speedLabel=document.getElementById('speed-label'), speedDownBtn=document.getElementById('speed-down'), speedUpBtn=document.getElementById('speed-up');
function syncSpeedUI(){
	speedLabel.textContent=SPEED_STEPS[speedIndex]+'\u00d7';
	speedDownBtn.disabled=speedIndex===0; speedUpBtn.disabled=speedIndex===SPEED_STEPS.length-1;
	gsap.globalTimeline.timeScale(SPEED_STEPS[speedIndex]*BASE_TIMESCALE);
}
syncSpeedUI();
speedDownBtn.addEventListener('click',()=>{ if(speedIndex>0){speedIndex--;syncSpeedUI();try{localStorage.setItem('aw-lab-speed',String(speedIndex));}catch(_){}} });
speedUpBtn.addEventListener('click',()=>{ if(speedIndex<SPEED_STEPS.length-1){speedIndex++;syncSpeedUI();try{localStorage.setItem('aw-lab-speed',String(speedIndex));}catch(_){}} });

// ── Hide / show the top bar (H) ───────────
(function(){
	const hideBtn=document.getElementById('header-hide'), revealBtn=document.getElementById('header-reveal');
	if(!hideBtn||!revealBtn) return;
	const topBtn=document.getElementById('header-hide-top');
	if(topBtn) topBtn.addEventListener('click',e=>{ e.stopPropagation(); hideBtn.click(); });
	const hidePath=hideBtn.querySelector('svg path');
	const UP='M6 15l6-6 6 6', DOWN='M6 9l6 6 6-6';
	function setHidden(h){
		document.body.classList.toggle('chrome-hidden',h);
		hideBtn.setAttribute('aria-expanded',String(!h));
		hideBtn.setAttribute('aria-label',h?'Show top bar':'Hide top bar');
		hideBtn.setAttribute('data-tip',(h?'Show top bar':'Hide top bar')+' (H)');
		if(hidePath) hidePath.setAttribute('d',h?DOWN:UP);
		try{ localStorage.setItem('aw-lab-chrome-hidden',h?'1':'0'); }catch(_){}
		// the stage grows/shrinks, so re-fit the scene — never re-render it
		if(current>=0) requestAnimationFrame(()=>{ const s=stage.querySelector('.scene:not(.scene-out)'); if(s) fitScene(s); });
	}
	hideBtn.addEventListener('click',e=>{ e.stopPropagation(); setHidden(!document.body.classList.contains('chrome-hidden')); });
	revealBtn.addEventListener('click',e=>{ e.stopPropagation(); setHidden(false); });
	try{ if(localStorage.getItem('aw-lab-chrome-hidden')==='1') setHidden(true); }catch(_){}
	document.addEventListener('keydown',e=>{
		if(e.code!=='KeyH'||e.metaKey||e.ctrlKey||e.altKey) return;
		const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
		e.preventDefault(); setHidden(!document.body.classList.contains('chrome-hidden'));
	});
})();

// ── Full screen (F) ───────────────────────
(function(){
	const fsBtn=document.getElementById('fs-toggle'); if(!fsBtn) return;
	function inFs(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
	function syncFs(){
		document.body.classList.toggle('is-fs',inFs());
		fsBtn.setAttribute('aria-pressed',inFs()?'true':'false');
		fsBtn.setAttribute('data-tip',(inFs()?'Exit full screen':'Full screen')+' (F)');
	}
	function toggle(){
		try{
			if(inFs()) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
			else { const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
		}catch(_){}
	}
	fsBtn.addEventListener('click',e=>{ e.stopPropagation(); toggle(); });
	document.addEventListener('fullscreenchange',syncFs);
	document.addEventListener('webkitfullscreenchange',syncFs);
	document.addEventListener('keydown',e=>{
		if(e.code!=='KeyF'||e.metaKey||e.ctrlKey||e.altKey) return;
		const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
		e.preventDefault(); toggle();
	});
	syncFs();
})();

// ── Keyboard + swipe ──────────────────────
if (window.AW && AW.keyboard) { AW.keyboard.bind({ next, prev, reset, replay }); }
else { document.addEventListener('keydown', e => {
	const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return;
	if(['Space','ArrowRight','Enter'].includes(e.code)){ e.preventDefault(); next(); }
	else if(e.code==='ArrowLeft'){ e.preventDefault(); prev(); }
	else if(e.code==='KeyR'){ e.preventDefault(); reset(); }
	else if(e.code==='KeyP'){ e.preventDefault(); replay(); }
}); }
(function(){
	const surf=document.getElementById('stage'); if(!surf) return;
	let x0=null,y0=null,t0=0;
	surf.addEventListener('touchstart',e=>{ if(e.touches.length!==1){x0=null;return;} x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
	surf.addEventListener('touchend',e=>{
		if(x0===null) return; const tc=e.changedTouches[0], dx=tc.clientX-x0, dy=tc.clientY-y0; x0=null;
		if(Date.now()-t0>800) return;
		if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.6){ if(dx<0) next(); else prev(); }
	},{passive:true});
})();

// ── Resize (re-fit only — never rebuild or replay) ──
let resizeTimer, lastW=0, lastH=0;
window.addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{
	if(current<0) return;
	const box=stage.getBoundingClientRect();
	if(Math.abs(box.width-lastW)<1 && Math.abs(box.height-lastH)<1) return;
	lastW=box.width; lastH=box.height;
	const s=stage.querySelector('.scene:not(.scene-out)');
	if(s && !animating) reserveTaskBody(s);   // a narrower scene rewraps panel text
	if(s) fitScene(s);
},200); });

// ── Init ──────────────────────────────────
applyFontScale();
const urlStep=parseInt(new URLSearchParams(location.search).get('step'),10);
renderStep((!isNaN(urlStep)&&urlStep>=1&&urlStep<=STEPS.length) ? urlStep-1 : 0);

		'<p class="aw-card-sub">An overview of what you\u2019ll build, then all six tasks of the lab.</p>'+
		'<div class="aw-row" data-k="audio"><span class="aw-row-ico" aria-hidden="true">\uD83D\uDD0A</span><span class="aw-row-lbl">Sound</span><span class="aw-row-state"></span><button type="button" class="aw-switch" role="switch"></button></div>'+
		'<div class="aw-row" data-k="cc"><span class="aw-row-ico" aria-hidden="true">\uD83D\uDCAC</span><span class="aw-row-lbl">Subtitles (CC)</span><span class="aw-row-state"></span><button type="button" class="aw-switch" role="switch"></button></div>'+
		'<button type="button" id="aw-start"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg><span>Start</span></button>';
	document.body.appendChild(card);

	// The rows mirror the real overlay buttons, so the gate never owns the state itself.
	var ROWS=[
		{ el:card.querySelector('.aw-row[data-k="audio"]'), lbl:'Sound',          toggle:'audio-toggle', read:function(){ return typeof audioEnabled!=='undefined' && audioEnabled; } },
		{ el:card.querySelector('.aw-row[data-k="cc"]'),    lbl:'Subtitles (CC)', toggle:'cc-toggle',    read:function(){ return typeof ccPref!=='undefined' && ccPref; } }
	];
	function renderRows(){
		ROWS.forEach(function(r){
			var on=r.read();
			var st=r.el.querySelector('.aw-row-state'); st.textContent=on?'ON':'OFF'; st.classList.toggle('on',on);
			var sw=r.el.querySelector('.aw-switch'); sw.classList.toggle('on',on);
			sw.setAttribute('aria-checked',on?'true':'false');
			sw.setAttribute('aria-label',r.lbl+' \u2014 '+(on?'on':'off'));
		});
	}
	ROWS.forEach(function(r){
		r.el.querySelector('.aw-switch').addEventListener('click',function(e){
			e.stopPropagation();
			var b=document.getElementById(r.toggle); if(b) b.click();
			renderRows();
		});
	});
	renderRows();

	var done=false;
	function gateKeys(e){
		if(done) return;
		if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].indexOf(e.key)>=0){ e.preventDefault(); e.stopPropagation(); }
	}
	document.addEventListener('keydown', gateKeys, true);

	document.getElementById('aw-start').addEventListener('click', function () {
		if(done) return; done=true;
		document.removeEventListener('keydown', gateKeys, true);
		document.body.classList.remove('aw-prestart');
		card.classList.add('aw-hide');
		setTimeout(function(){ if(card.parentNode) card.parentNode.removeChild(card); if(style.parentNode) style.parentNode.removeChild(style); }, 420);
		setTimeout(function(){
			try{ if(window.gsap && gsap.globalTimeline) gsap.globalTimeline.play(); }catch(_){}
			stageEl.style.opacity='1';
			try{ interruptAnimation(); renderStep(typeof current==='number' && current>=0 ? current : 0); }catch(_){}
		}, 380);
	});
}());
</script>
<script src="../lib/js/aw-present.js"></script>
<script src="../lib/js/aw-declutter.js"></script>
<script src="../lib/js/aw-url-state.js"></script>

</body>
