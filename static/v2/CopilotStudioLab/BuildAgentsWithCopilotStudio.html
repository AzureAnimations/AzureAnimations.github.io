// ── THEME ──
const themeToggleBtn=document.getElementById('theme-toggle');
function syncThemeBtn(){ if(!themeToggleBtn) return; const d=document.body.classList.contains('theme-dark');
	themeToggleBtn.dataset.theme=d?'dark':'light';
	themeToggleBtn.setAttribute('aria-label', d?'Switch to light theme':'Switch to dark theme'); }
if(window.AW&&AW.theme){ AW.theme.onChange(syncThemeBtn); syncThemeBtn(); }
else { syncThemeBtn(); themeToggleBtn.addEventListener('click',()=>{ const d=!document.body.classList.contains('theme-dark');
	document.body.classList.remove('theme-dark','theme-light'); document.body.classList.add(d?'theme-dark':'theme-light');
	try{localStorage.setItem('aw-theme',d?'theme-dark':'theme-light');}catch(_){} syncThemeBtn(); });
	try{ const s=localStorage.getItem('aw-theme'); if(s){ document.body.classList.remove('theme-dark','theme-light'); document.body.classList.add(s); syncThemeBtn(); } }catch(_){} }

// ══════════════════════════════════════════════════════════════════════
// LAB DATA — mirrors the published PL-7008 exercises (see header comment)
// ══════════════════════════════════════════════════════════════════════
const LAB_URL='https://microsoftlearning.github.io/mslearn-copilotstudio/Instructions/Labs/';
// The only split the labs state: classic UI (L1-L4) vs the new experience (L5).
const LAB_TRACK={ 1:'classic', 2:'classic', 3:'classic', 4:'classic', 5:'new' };
const LABS=[
	{ n:1, key:'create', file:'01-create-agents.html', c:'var(--accent-blue)',
	  name:'Create agents', min:45, ex:2,
	  agent:'Safe Travels (template) &amp; US Benefits Assistant (from a description)',
	  build:[ 'Create an agent from the <b>Safe Travels</b> template, then review its topics and classic orchestration.',
	          'Create a second agent by <b>describing it in a sentence</b>, then name it and edit its instructions.',
	          'Add <code>usa.gov/benefits</code> as a public-website knowledge source.',
	          'Publish to the <b>Demo website</b> channel with a welcome message and conversation starters.' ],
	  ach:'You can stand an agent up two ways — from a template and from a plain-English description — ground it in a public website, and publish it somewhere you can click.',
	  note:'Instructions guide behaviour, they don\u2019t enforce it. The lab says so explicitly \u2014 that\u2019s the whole reason topics, knowledge and tools exist in the labs that follow.' },
	{ n:2, key:'topics', file:'02-manage-topics.html', c:'var(--accent-teal)',
	  name:'Manage topics', min:45, ex:6,
	  agent:'An insurance-claims agent',
	  build:[ 'Disable the <b>Escalate</b> system topic \u2014 there are no humans to hand off to.',
	          'Create a <b>Customer Details</b> topic from a description, then edit its nodes in natural language.',
	          'Add an <b>adaptive card</b> and a Yes/No question node, both via Edit with Copilot.',
	          'Build <b>Estimate Repair</b> from blank: message \u2192 go-to-topic \u2192 condition \u2192 question nodes.',
	          'Widen variable scope so <code>Name</code> and <code>DetailsCorrect</code> cross topic boundaries.' ],
	  ach:'You can force a predictable, step-by-step conversation \u2014 collecting fields in a fixed order and branching on the answer \u2014 while generative orchestration stays switched on.',
	  note:'Disabling unused system topics isn\u2019t tidying. It removes ambiguity when several topics could all plausibly handle the same request.' },
	{ n:3, key:'knowledge', file:'03-knowledge.html', c:'var(--accent-green)',
	  name:'Manage knowledge', min:60, ex:5,
	  agent:'An expense-claims agent',
	  build:[ 'Have Copilot generate a <b>Dataverse</b> Expenses table from a prompt.',
	          'Ground the agent three ways: an uploaded <b>policy document</b>, a <b>public website</b> (IRS p463) and the <b>Dataverse table</b>.',
	          'Add <b>synonyms</b> and a <b>glossary</b> term so the agent understands your vocabulary.',
	          'Turn <b>ungrounded responses</b> and <b>web search</b> off, then on again at the generative-answers node.',
	          'Publish to <b>Microsoft Teams</b> with Entra ID authentication.' ],
	  ach:'You can ground an agent in three different kinds of knowledge and then control exactly when it is \u2014 and isn\u2019t \u2014 allowed to answer from anything else.',
	  note:'File indexing can take 10 minutes or more. The lab deliberately sends you to the next exercise and back; don\u2019t sit watching the status.' },
	{ n:4, key:'tools', file:'04-workflow-tools.html', c:'var(--accent-orange)',
	  name:'Workflows as tools', min:60, ex:3,
	  agent:'A task-analysis agent',
	  build:[ 'Build a <b>Send Summary to Teams</b> agent flow and add it as a tool.',
	          'Replace the auto-generated instructions with an explicit Purpose / Guidelines / Skills / Steps set.',
	          'Build a second flow, <b>Get Task List</b>, that filters an <b>Excel table</b> in OneDrive by priority.',
	          'Call that tool from inside a <b>Priority Tasks</b> topic using a global variable.' ],
	  ach:'Your agent performs real work in other systems \u2014 posting to a Teams channel and reading rows out of Excel \u2014 either on its own initiative or on rails inside a topic.',
	  note:'The instructions Copilot generates are long and vague, and will quietly stop the agent calling your tools. Lab 4 makes you delete them and write explicit ones \u2014 that step is the lab.' },
	{ n:5, key:'new', file:'05-create-agent-new-experience.html', c:'var(--accent-purple)',
	  name:'The new experience', min:30, ex:3,
	  agent:'A Contoso IT-support agent',
	  build:[ 'Switch to the new experience \u2014 note there is <b>no Topics section</b> at all.',
	          'Create an agent from a description and answer the <b>clarifying questions</b> it asks back.',
	          'Refine the auto-generated instructions with your own guidelines.',
	          'Add a <b>prebuilt Send-an-email action</b> \u2014 no Power Automate workflow to author.',
	          'Read the <b>reasoning trace</b> in Preview to see why the agent did what it did.' ],
	  ach:'You can build a working agent with no topic canvas at all \u2014 instructions plus a prebuilt action \u2014 and inspect its reasoning to understand its choices.',
	  note:'If the build prompt box is missing from Home, open <code>copilotstudio.preview.microsoft.com</code>. The lab flags this as an environment quirk, not a mistake.' }
];
const TOTAL_MIN=LABS.reduce((a,b)=>a+b.min,0);

// Anatomy pieces (step 3) — which labs light each one up
const PARTS=[
	{ k:'inst',  nm:'Instructions', by:'Labs 1 &middot; 4 &middot; 5', c:'var(--accent-blue)',   ic:'\uD83D\uDCDD' },
	{ k:'know',  nm:'Knowledge',    by:'Labs 1 &middot; 3',           c:'var(--accent-green)',  ic:'\uD83D\uDCDA' },
	{ k:'top',   nm:'Topics',       by:'Labs 2 &middot; 4',           c:'var(--accent-teal)',   ic:'\uD83E\uDDED' },
	{ k:'tool',  nm:'Tools',        by:'Labs 4 &middot; 5',           c:'var(--accent-orange)', ic:'\uD83D\uDD27' },
	{ k:'chan',  nm:'Channels',     by:'Labs 1 &middot; 3',           c:'var(--accent-pink)',   ic:'\uD83D\uDCE1' }
];

const AUDIO_BASE='audio/BuildAgentsWithCopilotStudio/';

const audioIco=audioBtn&&audioBtn.querySelector('.aw-audio-ico'), audioTimeEl=audioBtn&&audioBtn.querySelector('.aw-audio-time');
function playbackOn(){ return audioEnabled||ccPref; }
function audioDir(){ return (currentLang&&currentLang!=='en')?currentLang+'/':''; }
function fmtDur(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateAudioTime(){ if(audioTimeEl&&currentAudio&&isFinite(currentAudio.duration)&&currentAudio.duration>0) audioTimeEl.textContent=fmtDur(currentAudio.duration-currentAudio.currentTime); }
function syncAudioBtn(){ if(!audioBtn) return; if(audioIco) audioIco.textContent=audioEnabled?'\uD83D\uDD0A':'\uD83D\uDD07';
	if(audioTimeEl&&!playbackOn()) audioTimeEl.textContent='--:--';
	audioBtn.classList.toggle('toggle-active',audioEnabled); audioBtn.setAttribute('aria-pressed',audioEnabled?'true':'false'); }
function speakFallback(i){ if(!window.speechSynthesis) return; const s=STEPS[i];
	const u=new SpeechSynthesisUtterance(t(s.titleKey)+'. '+t(s.descKey)); u.lang=currentLang||'en';
	try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(_){} }
function stopAudio(){ if(currentAudio){ currentAudio.pause(); currentAudio.currentTime=0; currentAudio=null; }
	if(audioTimeout){ clearTimeout(audioTimeout); audioTimeout=null; }
	if(audioTimeEl) audioTimeEl.textContent='--:--';
	try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
	if(window.AWCaptions) AWCaptions.clear(); }
function playStepAudio(i){ stopAudio();
	if(document.body.classList.contains('aw-prestart')) return;
	if(!playbackOn()||i<0||i>=STEPS.length) return;
	audioTimeout=setTimeout(()=>{ audioTimeout=null; const f=AUDIO_FILES[i];
		if(!f){ if(audioEnabled) speakFallback(i); return; }
		currentAudio=new Audio(AUDIO_BASE+audioDir()+f);
		currentAudio.volume=audioEnabled?1:0;
		if(window.AWCaptions) AWCaptions.bind(currentAudio,i);
		currentAudio.addEventListener('loadedmetadata',updateAudioTime);
		currentAudio.addEventListener('timeupdate',updateAudioTime);
		currentAudio.addEventListener('error',()=>{ if(audioEnabled) speakFallback(i); });
		currentAudio.play().catch(()=>{}); },400); }
if(audioBtn) audioBtn.addEventListener('click',()=>{ audioEnabled=!audioEnabled;
	try{localStorage.setItem('aw-pl7008-audio',audioEnabled?'1':'0');}catch(_){} syncAudioBtn();
	if(current>=0){ if(!playbackOn()) stopAudio(); else if(currentAudio) currentAudio.volume=audioEnabled?1:0; else playStepAudio(current); }
	if(typeof applyCc==='function') applyCc(); });
(function(){ let p=null; try{ p=new URLSearchParams(location.search).get('audio'); }catch(_){}

(function(){ const b=document.getElementById('fs-toggle'); if(!b) return;

	function tg(){ try{ if(inFs()) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
		else { const e=document.documentElement; (e.requestFullscreen||e.webkitRequestFullscreen).call(e); } }catch(_){} }
	b.addEventListener('click',e=>{e.stopPropagation();tg();});
	document.addEventListener('fullscreenchange',sync); document.addEventListener('webkitfullscreenchange',sync);
	document.addEventListener('keydown',e=>{ if(e.code==='KeyF'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){

// ── helpers ──
function clearStage(){ liveTimelines.forEach(t=>t.kill()); liveTimelines=[]; liveEls.forEach(e=>e.remove()); liveEls=[];
	Array.from(svg.children).forEach(c=>{ if(c.tagName.toLowerCase()!=='defs') c.remove(); }); }
function el(cls,html){ const d=document.createElement('div'); if(cls) d.className=cls; if(html!=null) d.innerHTML=html; return d; }
function stepById(id){ return STEPS.find(s=>s.id===id); }
function fitScene(scene){ if(!scene) return;
	const topAnchored=scene.classList.contains('is-top');
	const base=topAnchored?'translate(-50%,0)':'translate(-50%,-50%)';
	scene.style.transform=base+' scale(1)';
	const box=stage.getBoundingClientRect(), availW=box.width-32, availH=box.height-(topAnchored?46:28);
	const sw=scene.offsetWidth, sh=scene.offsetHeight; if(!sw||!sh) return;
	const k=Math.min(1, availW/sw, availH/sh);
	scene.style.transform=base+' scale('+k+')'; }
function headerEls(s){ return [s.querySelector('.scene-title'), s.querySelector('.scene-lead')]; }
function buildScene(step){ const s=el('scene'); s.appendChild(el('scene-title',t(step.titleKey)));
	s.appendChild(el('scene-lead',t(step.descKey))); return s; }
function maybeCallout(step){ if(!calloutEnabled) return null; const c=el('callout',t(step.calloutKey));
	c.style.left='1.5rem'; c.style.top='1.5rem'; stage.appendChild(c); liveEls.push(c);
	dragify(c,'aw-pl7008-callout-pos'); return c; }
function renderOutline(step,i){ const rows=(step.stats||[]).map(([k,v])=>`<div class="stat-row"><span>${t(k)}</span><span>${t(v)}</span></div>`).join('');
	outlineBody.innerHTML=`<div class="outline-section"><strong>${t('stepOf')} ${i+1} / ${STEPS.length}: ${t(step.titleKey)}</strong><p style="margin-top:.4rem;">${t(step.descKey)}</p></div>${rows?`<div class="outline-section">${rows}</div>`:''}`; }
function announceStep(step,i){ announcer.textContent=`${t('stepOf')} ${i+1} / ${STEPS.length}: ${t(step.titleKey)}. ${t(step.descKey)}`; }
function trackPill(n){ const tr=LAB_TRACK[n];
	return `<span class="trk ${tr==='new'?'is-new':''}">${tr==='new'?'New experience':'Classic'}</span>`; }
// aw-keyboard binds Space/Enter on document (bubble) — without this a keyboard user's
// press both cancels the click AND advances the step.
function guardKeys(b){ b.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter') e.stopPropagation(); }); }

// ── render dispatch ──
function renderStep(i){
	if(i<0||i>=STEPS.length) return;
	if(animating){ liveTimelines.forEach(t=>t.kill()); liveTimelines=[]; animating=false; }
	animating=true;
	const step=STEPS[i];
	const outgoing=stage.querySelector('.scene:not(.scene-out)');
	if(outgoing) liveEls=liveEls.filter(x=>x!==outgoing);
	clearStage();
	if(outgoing){ outgoing.style.zIndex='5';
		if(motionPaused) outgoing.remove();
		else { outgoing.classList.remove('scene-in'); outgoing.classList.add('scene-out'); setTimeout(()=>outgoing.remove(),240); } }
	if(step.id==='problem') renderProblem();
	else if(step.id==='glance') renderGlance();
	else if(step.id==='parts') renderParts();
	else if(step.id==='arch') renderArch();
	else if(step.id==='labs') renderLabs();
	else if(step.id==='recap') renderRecap();
	const incoming=stage.querySelector('.scene:not(.scene-out)');
	if(incoming&&!motionPaused) incoming.classList.add('scene-in');
	fitScene(incoming);
	current=i;
	try{ const u=new URL(location.href); u.searchParams.set('step',String(i+1));
		if(step.id==='labs') u.searchParams.set('task',String(activeLab)); else u.searchParams.delete('task');
		history.replaceState(null,'',u); }catch(_){}
	counter.textContent=`${t('stepOf')} ${current+1} / ${STEPS.length}`;
	breadcrumb.textContent=t(step.captionKey);
	progress.style.width=((current+1)/STEPS.length*100)+'%';
	renderOutline(step,i); announceStep(step,i);
	playStepAudio(i);
}

// ── STEP 1 · problem ──
function renderProblem(){
	const step=stepById('problem'), scene=buildScene(step);
	const card=el('card',`<span class="card-icon">\uD83E\uDDE9</span><span class="card-h">${t('problemCardH')}</span><span class="card-p">${t('problemCardP')}</span>`);
	scene.appendChild(card); stage.appendChild(scene); liveEls.push(scene);
	const c=maybeCallout(step);
	if(motionPaused){ gsap.set([...headerEls(scene),card],{opacity:1}); if(c) gsap.set(c,{opacity:1}); animating=false; return; }
	const tl=gsap.timeline({onComplete:()=>animating=false}); liveTimelines.push(tl);
	tl.fromTo(headerEls(scene),{opacity:0,y:-14},{opacity:1,y:0,duration:.55,stagger:.12,ease:'power2.out'});
	tl.fromTo(card,{opacity:0,y:20,scale:.97},{opacity:1,y:0,scale:1,duration:.6,ease:'back.out(1.5)'},'-=.1');
	if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:.6},'-=.3');
}

// ── STEP 2 · labs at a glance ──
function renderGlance(){
	const step=stepById('glance'), scene=buildScene(step);
	const grid=el('lab-grid');
	LABS.forEach(L=>{
		const card=el('lab-card',`<span class="lab-no">LAB ${L.n}</span><span class="lab-nm">${L.name}</span>
			<span class="lab-meta">${trackPill(L.n)}<span class="lab-min">${L.min} min</span><span>&middot; ${L.ex} exercises</span></span>`);
		card.style.setProperty('--lc',L.c); grid.appendChild(card);
	});
	const paths=el('paths');
	[['Start here','Setup','ILT Setup builds the environment and the <b>Lab Exercises</b> solution every lab writes into.','var(--ink-soft)'],
	 ['Classic experience','Labs 1\u20134','Topics, knowledge and Power Automate workflows \u2014 3 h 30 m of the course.','var(--accent-blue)'],
	 ['New experience','Lab 5','Instruction-driven, no topic canvas, prebuilt actions \u2014 30 minutes.','var(--accent-purple)']
	].forEach(([h,tag,txt,col])=>{
		const p=el('path',`<b>${h} &middot; ${tag}</b><span>${txt}</span>`); p.style.setProperty('--pc',col); paths.appendChild(p);
	});
	scene.appendChild(grid); scene.appendChild(paths); stage.appendChild(scene); liveEls.push(scene);
	const c=maybeCallout(step);
	const cards=grid.querySelectorAll('.lab-card'), ps=paths.querySelectorAll('.path');
	if(motionPaused){ gsap.set([...headerEls(scene),...cards,...ps],{opacity:1}); if(c) gsap.set(c,{opacity:1}); animating=false; return; }
	const tl=gsap.timeline({onComplete:()=>animating=false}); liveTimelines.push(tl);

// ── STEP 5 · lab picker (radio) ──
function renderLabs(){
	const step=stepById('labs'), scene=buildScene(step);
	scene.classList.add('is-top');
	const picker=el('picker');
	const host=el('');                                   // panel host, swapped in place
	function paint(){
		const L=LABS.find(x=>x.n===activeLab)||LABS[0];
		const items=L.build.map(b=>`<span class="p-item"><i></i><span>${b}</span></span>`).join('');
		host.innerHTML=`<div class="panel">
			<div class="p-top">${trackPill(L.n)}<span class="p-agent">You build: <b>${L.agent}</b></span>
				<span class="p-agent" style="margin-left:auto;">${L.min} min &middot; ${L.ex} exercises</span></div>
			<div class="p-build">${items}</div>
			<div class="ach"><span class="ach-ic">\u2713</span><span class="ach-tx">${L.ach}</span></div>
			<p class="task-note"><b>Watch out</b><span>${L.note}</span></p>
		</div>`;
		host.querySelector('.panel').style.setProperty('--pc',L.c);
		picker.querySelectorAll('.task-btn').forEach(b=>b.setAttribute('aria-pressed', parseInt(b.dataset.lab,10)===activeLab?'true':'false'));
		announcer.textContent='Lab '+L.n+': '+L.name+'. '+L.ach;
		try{ const u=new URL(location.href); u.searchParams.set('task',String(activeLab)); history.replaceState(null,'',u); }catch(_){}
		requestAnimationFrame(()=>fitScene(scene));
	}
	LABS.forEach(L=>{
		const b=document.createElement('button'); b.type='button';
		b.className='task-btn'+(LAB_TRACK[L.n]==='new'?' is-new':'');
		b.style.setProperty('--tc',L.c); b.dataset.lab=String(L.n);
		b.innerHTML=`<span class="tn">LAB ${L.n}</span><span>${L.name}</span>`;
		b.addEventListener('click',e=>{ e.stopPropagation(); activeLab=L.n; paint(); });
		guardKeys(b); picker.appendChild(b);
	});
	// picker must be the scene's FIRST child: the scene is top-anchored with transform-origin
	// top center, so only an element flush with the scene's top edge is immune to the
	// per-panel scale change that fitScene applies. Anything above it drifts.
	scene.insertBefore(picker, scene.firstChild);
	scene.appendChild(host); stage.appendChild(scene); liveEls.push(scene);
	const c=maybeCallout(step);
	paint();
	// presenter mode can't be clicked — walk the panels so the audience still sees all five
	if(IS_PRESENT&&!motionPaused){
		let k=0; const iv=setInterval(()=>{ k++; if(k>=LABS.length){ clearInterval(iv); return; }
			activeLab=LABS[k].n; paint(); },4200);
		liveTimelines.push({ kill:()=>clearInterval(iv) });
	}
	if(motionPaused){ gsap.set(headerEls(scene),{opacity:1}); if(c) gsap.set(c,{opacity:1}); animating=false; return; }
	const tl=gsap.timeline({onComplete:()=>animating=false}); liveTimelines.push(tl);
	tl.fromTo(headerEls(scene),{opacity:0,y:-14},{opacity:1,y:0,duration:.55,stagger:.12,ease:'power2.out'});
	tl.fromTo(picker.querySelectorAll('.task-btn'),{opacity:0,y:10},{opacity:1,y:0,duration:.35,stagger:.06,ease:'back.out(1.6)'},'-=.1');
	if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:.6},'-=.2');
}

(function(){ const dock=document.getElementById('controls'), grip=document.getElementById('ctrl-grip'), pin=document.getElementById('ctrl-pin');
	if(!dock||!grip) return; const KEY='aw-pl7008-controls-pos';
	let dr=false,sx=0,sy=0,bl=0,bt=0,mv=false;
	function place(l,t2){ const w=dock.offsetWidth,h=dock.offsetHeight;
		l=Math.max(6,Math.min(l,window.innerWidth-w-6)); t2=Math.max(6,Math.min(t2,window.innerHeight-h-6));
		dock.style.left=l+'px'; dock.style.top=t2+'px'; dock.style.right='auto'; dock.style.bottom='auto'; dock.style.transform='none';
		document.body.classList.add('controls-floating'); }
	function recenter(){ dock.style.left=dock.style.top=dock.style.right=dock.style.bottom=dock.style.transform='';
		document.body.classList.remove('controls-floating'); try{localStorage.removeItem(KEY);}catch(_){} }
	grip.addEventListener('pointerdown',e=>{ e.preventDefault(); dr=true; mv=false;
		const r=dock.getBoundingClientRect(); bl=r.left; bt=r.top; sx=e.clientX; sy=e.clientY;
		try{grip.setPointerCapture(e.pointerId);}catch(_){} });
	grip.addEventListener('pointermove',e=>{ if(!dr) return; const dx=e.clientX-sx,dy=e.clientY-sy;
		if(Math.abs(dx)>2||Math.abs(dy)>2) mv=true; place(bl+dx,bt+dy); });
	function end(e){ if(!dr) return; dr=false; try{grip.releasePointerCapture(e.pointerId);}catch(_){}
		if(mv){ try{ const r=dock.getBoundingClientRect(); localStorage.setItem(KEY,JSON.stringify({left:r.left,top:r.top})); }catch(_){} } }
	grip.addEventListener('pointerup',end); grip.addEventListener('pointercancel',end);
	if(pin) pin.addEventListener('click',e=>{e.stopPropagation();recenter();});
	try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s.left==='number') place(s.left,s.top); }catch(_){} })();

function dragify(el2,key){
	if(!el2||el2.__awDrag) return; el2.__awDrag=true;
	let dr=false,sx=0,sy=0,bl=0,bt=0,mv=false;
	const resizable=getComputedStyle(el2).resize!=='none', sizeKey=key?key+'-size':null;
	const home={position:el2.style.position,left:el2.style.left,top:el2.style.top,right:el2.style.right,
		bottom:el2.style.bottom,margin:el2.style.margin,transform:el2.style.transform,width:el2.style.width,height:el2.style.height};
	const pin=document.createElement('button'); pin.type='button'; pin.className='aw-drag-reset';
	pin.title=t('resetPos'); pin.setAttribute('aria-label',t('resetPos'));
	pin.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';
	const oy=getComputedStyle(el2).overflowY, clips=(oy==='auto'||oy==='scroll'||oy==='hidden');
	pin.style.top=clips?'8px':'-10px'; pin.style.right=clips?'8px':'-10px';
	el2.appendChild(pin);
	function showPin(on){ pin.style.display=on?'flex':'none'; }
	pin.addEventListener('pointerdown',e=>e.stopPropagation());
	pin.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation();
		Object.assign(el2.style,home); if(key){try{localStorage.removeItem(key);}catch(_){}}
		if(sizeKey){try{localStorage.removeItem(sizeKey);}catch(_){}} showPin(false); });
	function fix(l,t2){ const w=el2.offsetWidth,h=el2.offsetHeight;
		l=Math.max(6,Math.min(l,window.innerWidth-w-6)); t2=Math.max(6,Math.min(t2,window.innerHeight-h-6));
		el2.style.position='fixed'; el2.style.left=l+'px'; el2.style.top=t2+'px';
		el2.style.right='auto'; el2.style.bottom='auto'; el2.style.margin='0'; el2.style.transform='none'; }
	if(resizable&&typeof ResizeObserver!=='undefined'){ let rt;
		new ResizeObserver(()=>{ if(el2.style.width||el2.style.height){ showPin(true);
			if(sizeKey){ clearTimeout(rt); rt=setTimeout(()=>{ try{localStorage.setItem(sizeKey,JSON.stringify({w:el2.style.width,h:el2.style.height}));}catch(_){} },150); } } }).observe(el2); }
	el2.addEventListener('pointerdown',e=>{ if(e.button!==0||(e.target.closest&&e.target.closest('a,button,select,input,textarea'))) return;
		if(resizable){ const r=el2.getBoundingClientRect(); if(e.clientX>r.right-18&&e.clientY>r.bottom-18) return; }
		dr=true; mv=false; const r=el2.getBoundingClientRect(); bl=r.left; bt=r.top; sx=e.clientX; sy=e.clientY;
		fix(bl,bt); try{el2.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
	el2.addEventListener('pointermove',e=>{ if(!dr) return; const dx=e.clientX-sx,dy=e.clientY-sy;
		if(Math.abs(dx)>2||Math.abs(dy)>2) mv=true; fix(bl+dx,bt+dy); });
	function end(e){ if(!dr) return; dr=false; try{el2.releasePointerCapture(e.pointerId);}catch(_){}
		if(mv){ showPin(true); if(key){ try{ const r=el2.getBoundingClientRect(); localStorage.setItem(key,JSON.stringify({left:r.left,top:r.top})); }catch(_){} } } }
	el2.addEventListener('pointerup',end); el2.addEventListener('pointercancel',end);
	if(sizeKey){ try{ const z=JSON.parse(localStorage.getItem(sizeKey)||'null'); if(z&&(z.w||z.h)){ if(z.w) el2.style.width=z.w; if(z.h) el2.style.height=z.h; showPin(true); } }catch(_){} }
	if(key){ try{ const s=JSON.parse(localStorage.getItem(key)||'null'); if(s&&isFinite(s.left)&&isFinite(s.top)){ fix(s.left,s.top); showPin(true); } }catch(_){} }
}
