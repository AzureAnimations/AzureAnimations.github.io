<!DOCTYPE html>
<!--
	404 — served by GitHub Pages for any unmatched path.

	The site was restructured (static/v2/… → /journeys/…), so most 404s are old links
	that still have a valid destination. Rather than dumping everyone on the home page,
	this derives candidate new URLs, HEAD-checks each one, and redirects to the first
	that actually exists. Only genuinely dead links fall back to the home page, so a
	bad rule can never bounce a visitor into a second 404.
-->
<html lang="en">

<head>
	<script src="/js/tracking.js"></script>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<meta name="robots" content="noindex" />
	<title>Page moved &mdash; Azure Animations</title>
	<link rel="icon" type="image/png" href="/img/favicon.png" />
	<script src="/lib/js/aw-theme.js"></script>

	<style>
		:root {
			--bg: #f7f9fc; --ink: #161616; --ink-soft: #5b6270;
			--card: #ffffff; --line: #dfe4ec; --azure: #0a84e0; --shadow: 0 6px 18px rgba(20, 30, 60, 0.08);
		}
		body.theme-dark {
			--bg: #1b1c22; --ink: #f2f4f8; --ink-soft: #b7bdc9;
			--card: #2a2b34; --line: #3d3f4a; --azure: #6fa5ff; --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			margin: 0; background: var(--bg); color: var(--ink);
			font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.5;
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			padding: 2rem 1.5rem; text-align: center;
		}
		.brand { display: inline-flex; align-items: center; gap: 0.55rem; text-decoration: none; color: var(--ink); margin-bottom: 1.6rem; }
		.brand img { width: 30px; height: 30px; }
		.brand span { font-size: 1.05rem; font-weight: 700; }
		h1 { margin: 0 0 0.6rem; font-size: 1.75rem; font-weight: 700; }
		p { margin: 0 0 0.4rem; color: var(--ink-soft); max-width: 56ch; }
		code { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 0.1rem 0.4rem; font-size: 0.88rem; }
		.status { margin-top: 1.1rem; font-size: 0.92rem; color: var(--ink-soft); min-height: 1.5rem; }
		.spin { display: inline-block; width: 13px; height: 13px; margin-right: 0.45rem; vertical-align: -1px;
			border: 2px solid var(--line); border-top-color: var(--azure); border-radius: 50%; animation: sp 0.7s linear infinite; }
		@keyframes sp { to { transform: rotate(360deg); } }
		@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
		.actions { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
		.btn {
			display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.55rem 1.1rem;
			border-radius: 10px; border: 2px solid var(--azure); background: var(--azure);
			color: #fff; font-weight: 600; text-decoration: none; font-size: 0.95rem;
		}
		body.theme-dark .btn { color: #14151b; }
		.jump { margin-top: 1.6rem; display: none; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 720px; }
		.jump a {
			padding: 0.35rem 0.75rem; border-radius: 999px; border: 1px solid var(--line);
			background: var(--card); color: var(--ink-soft); text-decoration: none; font-size: 0.87rem;
		}
		.jump a:hover { border-color: var(--azure); color: var(--azure); }
	</style>
</head>

<body>
	<a class="brand" href="/">
		<img src="/img/AzureAnimations-Logo.svg" alt="" />
		<span>Azure Animations</span>
	</a>

	<h1 id="title">Looking for that page&hellip;</h1>
	<p id="msg">The site was reorganised, so this link may have a new address.</p>
	<p><code id="was"></code></p>

	<div class="status" id="status"><span class="spin"></span>Checking for a new location&hellip;</div>

	<div class="actions">
		<a class="btn" href="/">Go to all journeys</a>
	</div>

	<nav class="jump" id="jump" aria-label="Journeys">
		<a href="/journeys/AI/Foundry/index.html">AI Agents · Foundry</a>
		<a href="/journeys/Copilot/index.html">Microsoft 365 Copilot</a>
		<a href="/journeys/CopilotStudio/index.html">Copilot Studio</a>
		<a href="/journeys/Compute/index.html">PaaS Compute</a>
		<a href="/journeys/Container/index.html">Containers</a>
		<a href="/journeys/Network/index.html">Networking</a>
		<a href="/journeys/Storage/index.html">Storage</a>
		<a href="/journeys/Security/index.html">Security</a>
		<a href="/journeys/lab-guide/index.html">Lab guides</a>
	</nav>

	<script>
		// Exposed so the mapping can be tested directly, without provoking a real 404.
		window.__awResolve = function (pathname) {
			var out = [];
			var push = function (p) { if (p && out.indexOf(p) < 0) out.push(p); };

			// Docusaurus served the site out of /static/, so strip that first.
			var p = pathname.replace(/^\/static\//, '/');

			var v2 = p.match(/^\/v2\/(.*)$/);
			if (v2) {
				var rest = v2[1];
				if (!rest || /^index\.html$/i.test(rest)) { push('/'); return out; }
				// the three lab guides gained a lab-guide/ parent
				if (/^(AgentLab|CopilotLab|CopilotStudioLab)\//.test(rest)) push('/journeys/lab-guide/' + rest);
				push('/journeys/' + rest);
				push('/' + rest);
				return out;
			}
			if (/^\/v2\/?$/.test(p)) { push('/'); return out; }

			// the interim flat layout, before journeys were nested
			var flat = p.match(/^\/([A-Za-z][^/]*)\/(.*)$/);
			if (flat && flat[1] !== 'journeys') {
				if (/^(AgentLab|CopilotLab|CopilotStudioLab)$/.test(flat[1])) push('/journeys/lab-guide/' + flat[1] + '/' + flat[2]);
				push('/journeys/' + flat[1] + '/' + flat[2]);
			}
			if (p !== pathname) push(p);   // the plain /static/ strip, if nothing else matched
			return out;
		};

		(function () {
			var status = document.getElementById('status');
			var was = document.getElementById('was');
			var here = location.pathname;
			was.textContent = here;

			function fallback() {
				document.getElementById('title').textContent = 'That page has moved on';
				document.getElementById('msg').textContent =
					'We could not find a new home for this link. Pick a journey below, or start from the top.';
				status.textContent = '';
				document.getElementById('jump').style.display = 'flex';
			}

			var cands = window.__awResolve(here).filter(function (c) { return c !== here; });
			if (!cands.length) return fallback();

			var i = 0;
			(function next() {
				if (i >= cands.length) return fallback();
				var c = cands[i++];
				fetch(c, { method: 'HEAD' })
					.then(function (r) {
						if (!r.ok) return next();
						status.innerHTML = '<span class="spin"></span>Found it &mdash; taking you there&hellip;';
						location.replace(c + location.search + location.hash);   // keep ?lang= and #hash
					})
					.catch(next);
			}());
		}());
	</script>
</body>

</html>
