<!DOCTYPE html>
<!--
	Contents — every journey, page and step, each deep-linking straight to ?step=N.

	Data comes from toc.json, generated by scripts/build-toc.mjs off the narration
	scripts. Re-run that after adding or re-cutting a page.

	To map steps onto certification objectives, add an "exam" array to any page or
	step in toc.json and it renders as a tag automatically, e.g.
	    { "n": 3, "title": "Instructions", "exam": ["AI-102 · 2.1"] }
-->
<html lang="en">

<head>
	<script src="/js/tracking.js"></script>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<meta name="description" content="Every Azure Animations journey, page and step — jump straight to the moment you need." />
	<title>Contents &mdash; Azure Animations</title>
	<link rel="icon" type="image/png" href="/img/favicon.png" />
	<script src="/lib/js/aw-theme.js"></script>

	<style>
		:root {
			--bg: #f7f9fc; --ink: #161616; --ink-soft: #5b6270;
			--card: #ffffff; --line: #dfe4ec; --azure: #0a84e0; --shadow: 0 4px 14px rgba(20, 30, 60, 0.07);
		}
		body.theme-dark {
			--bg: #1b1c22; --ink: #f2f4f8; --ink-soft: #b7bdc9;
			--card: #2a2b34; --line: #3d3f4a; --azure: #6fa5ff; --shadow: 0 4px 14px rgba(0, 0, 0, 0.32);
		}
		* { box-sizing: border-box; }
		body { margin: 0; background: var(--bg); color: var(--ink);
			font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.5; }

		.topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
			padding: 0.6rem 1.4rem; border-bottom: 1px solid var(--line); position: sticky; top: 0;
			background: var(--bg); z-index: 20; }
		.brand { display: inline-flex; align-items: center; gap: 0.55rem; text-decoration: none; color: var(--ink); }
		.brand img { width: 28px; height: 28px; }
		.brand b { font-weight: 700; font-size: 1rem; }
		.theme-toggle { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
			background: var(--card); color: var(--ink); cursor: pointer; font-size: 1rem; }
		.theme-toggle .moon { display: none; }
		body.theme-dark .theme-toggle .sun { display: none; }
		body.theme-dark .theme-toggle .moon { display: inline; }

		main { max-width: 1080px; margin: 0 auto; padding: 1.6rem 1.4rem 3rem; }
		h1 { margin: 0 0 0.4rem; font-size: 1.8rem; }
		.lead { margin: 0 0 1.2rem; color: var(--ink-soft); }

		.tools { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-bottom: 1.4rem;
			position: sticky; top: 52px; background: var(--bg); padding: 0.6rem 0; z-index: 10; }
		#q { flex: 1 1 280px; padding: 0.6rem 0.9rem; border-radius: 10px; border: 2px solid var(--line);
			background: var(--card); color: var(--ink); font: inherit; }
		#q:focus { outline: none; border-color: var(--azure); }
		.count { font-size: 0.86rem; color: var(--ink-soft); }
		.tools button { padding: 0.5rem 0.9rem; border-radius: 10px; border: 1px solid var(--line);
			background: var(--card); color: var(--ink-soft); font: inherit; font-size: 0.86rem; cursor: pointer; }
		.tools button:hover { border-color: var(--azure); color: var(--azure); }

		.j { margin-bottom: 1.6rem; }
		.j-head { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.5rem; }
		.j-head h2 { margin: 0; font-size: 1.12rem; }
		.j-head a { color: var(--azure); text-decoration: none; font-size: 0.84rem; }
		.j-meta { font-size: 0.8rem; color: var(--ink-soft); }

		.p { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
			box-shadow: var(--shadow); margin-bottom: 0.5rem; overflow: hidden; }
		.p > summary { cursor: pointer; padding: 0.6rem 0.9rem; display: flex; align-items: center;
			gap: 0.6rem; list-style: none; }
		.p > summary::-webkit-details-marker { display: none; }
		.p > summary::before { content: "▸"; color: var(--ink-soft); font-size: 0.8rem; }
		.p[open] > summary::before { content: "▾"; }
		.p-title { font-weight: 600; font-size: 0.96rem; }
		.p-n { margin-left: auto; font-size: 0.78rem; color: var(--ink-soft); white-space: nowrap; }
		.p-open { font-size: 0.8rem; color: var(--azure); text-decoration: none; white-space: nowrap; }

		ol { margin: 0; padding: 0 0.9rem 0.7rem 0; list-style: none; }
		ol li { border-top: 1px solid var(--line); }
		ol a { display: flex; gap: 0.7rem; align-items: baseline; padding: 0.42rem 0.9rem;
			text-decoration: none; color: var(--ink); font-size: 0.9rem; }
		ol a:hover { background: color-mix(in srgb, var(--azure) 10%, transparent); }
		ol .n { flex: none; width: 1.9rem; color: var(--ink-soft); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
		.tag { margin-left: 0.4rem; padding: 0.02rem 0.4rem; border-radius: 999px; border: 1px solid var(--azure);
			color: var(--azure); font-size: 0.7rem; white-space: nowrap; }
		mark { background: color-mix(in srgb, var(--azure) 28%, transparent); color: inherit; border-radius: 3px; }
		.empty { color: var(--ink-soft); padding: 2rem 0; text-align: center; }
	</style>
</head>

<body>
	<header class="topbar">
		<a class="brand" href="/"><img src="/img/AzureAnimations-Logo.svg" alt="" /><b>Azure Animations</b></a>
		<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">
			<span class="sun" aria-hidden="true">&#9728;</span><span class="moon" aria-hidden="true">&#9790;</span>
		</button>
	</header>

	<main>
		<h1>Contents</h1>
		<p class="lead">Every journey, page and step. Pick a step to open the animation right at that moment
			&mdash; no need to start from the beginning.</p>

		<div class="tools">
			<input id="q" type="search" placeholder="Search steps, pages or journeys — e.g. &quot;agent&quot;, &quot;peering&quot;, &quot;SAS&quot;"
				aria-label="Search contents" autocomplete="off" />
			<span class="count" id="count"></span>
			<button id="expand" type="button">Expand all</button>
			<button id="collapse" type="button">Collapse all</button>
		</div>

		<div id="out"></div>
	</main>

	<script>
		(function () {
			var out = document.getElementById('out'), q = document.getElementById('q'), count = document.getElementById('count');
			var DATA = null;

			var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
			function hi(text, term) {
				if (!term) return esc(text);
				var i = text.toLowerCase().indexOf(term);
				if (i < 0) return esc(text);
				return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
			}
			function tags(x) {
				return (x && x.exam && x.exam.length)
					? x.exam.map(function (e) { return '<span class="tag">' + esc(e) + '</span>'; }).join('')
					: '';
			}

			function render(term) {
				term = (term || '').trim().toLowerCase();
				var html = '', shown = 0;

				DATA.journeys.forEach(function (j) {
					var jHit = j.label.toLowerCase().indexOf(term) > -1;
					var pages = j.pages.map(function (p) {
						var pHit = jHit || p.title.toLowerCase().indexOf(term) > -1;
						var steps = term && !pHit
							? p.steps.filter(function (s) { return s.title.toLowerCase().indexOf(term) > -1; })
							: p.steps;
						return (!term || pHit || steps.length) ? { p: p, steps: steps } : null;
					}).filter(Boolean);

					if (!pages.length) return;

					html += '<section class="j"><div class="j-head"><h2>' + hi(j.label, term) + '</h2>' +
						(j.hub ? '<a href="/' + esc(j.hub.path) + '">Open journey &rarr;</a>' : '') +
						'<span class="j-meta">' + pages.length + ' page' + (pages.length === 1 ? '' : 's') + '</span></div>';

					pages.forEach(function (e) {
						var p = e.p, url = '/' + p.path;
						shown += e.steps.length;
						html += '<details class="p"' + (term ? ' open' : '') + '>' +
							'<summary><span class="p-title">' + hi(p.title, term) + '</span>' + tags(p) +
							'<span class="p-n">' + p.steps.length + ' steps</span>' +
							'<a class="p-open" href="' + esc(url) + '">Open</a></summary>';
						if (e.steps.length) {
							html += '<ol>';
							e.steps.forEach(function (s) {
								html += '<li><a href="' + esc(url) + '?step=' + s.n + '">' +
									'<span class="n">' + s.n + '</span><span>' + hi(s.title, term) + tags(s) + '</span></a></li>';
							});
							html += '</ol>';
						}
						html += '</details>';
					});
					html += '</section>';
				});

				out.innerHTML = html || '<p class="empty">Nothing matches that. Try a shorter word.</p>';
				count.textContent = term ? shown + ' matching step' + (shown === 1 ? '' : 's') : total + ' steps in total';
			}

			var total = 0;
			fetch('/toc.json').then(function (r) { return r.json(); }).then(function (d) {
				DATA = d;
				total = d.journeys.reduce(function (a, j) { return a + j.pages.reduce(function (s, p) { return s + p.steps.length; }, 0); }, 0);
				render(q.value);   // honour anything typed while toc.json was still loading
				var t; q.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { render(q.value); }, 120); });
				document.getElementById('expand').addEventListener('click', function () { out.querySelectorAll('details').forEach(function (d) { d.open = true; }); });
				document.getElementById('collapse').addEventListener('click', function () { out.querySelectorAll('details').forEach(function (d) { d.open = false; }); });
			}).catch(function () {
				out.innerHTML = '<p class="empty">Could not load the contents index.</p>';
			});
		}());
	</script>
</body>

</html>
