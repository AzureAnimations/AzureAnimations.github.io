<!DOCTYPE html>
<!-- Preview gallery for the shared Cowork kit (lib/js/aw-cowork-ui.js + lib/css/aw-cowork-ui.css). Not published in the contents. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Cowork UI kit — preview</title>
<link rel="icon" href="../../img/favicon.png" />
<link rel="stylesheet" href="https://unpkg.com/@microsoft/atlas-css/dist/index.css" />
<link rel="stylesheet" href="../../lib/css/aw-cowork-ui.css" />
<script src="../../lib/js/aw-theme.js"></script>
<script src="../../lib/js/aw-cowork-ui.js"></script>
<style>
	body { margin:0; font-family:'Segoe UI',sans-serif; background:var(--theme-body-background); color:var(--theme-text); }
	.top { display:flex; align-items:center; justify-content:space-between; padding:0.8rem 1.6rem; border-bottom:1px solid var(--theme-border); }
	.top h1 { margin:0; font-size:1.05rem; font-weight:600; }
	.theme-toggle { width:2.3rem; height:2.3rem; border-radius:999px; border:1px solid var(--theme-border); background:transparent; color:var(--theme-text); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
	.theme-toggle .theme-icon { display:none; } .theme-toggle[data-theme="dark"] .icon-sun { display:block; } .theme-toggle[data-theme="light"] .icon-moon { display:block; }
	main { max-width:1200px; margin:0 auto; padding:1.6rem; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:1.6rem; }
	section { display:flex; flex-direction:column; gap:0.6rem; }
	section.wide { grid-column:1 / -1; }
	section > h2 { margin:0; font-size:0.9rem; font-weight:600; color:var(--theme-text-subtle); letter-spacing:0.06em; text-transform:uppercase; }
</style>
</head>
<body class="theme-dark" data-theme-preset="atlas">
	<header class="top">
		<h1>Cowork UI kit · preview (Act 5 of the Copilot journey)</h1>
		<!-- AW:theme --><button id="theme-toggle" type="button" class="theme-toggle" aria-label="Switch theme" title="Switch theme"><svg class="theme-icon icon-moon ico ico-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg><svg class="theme-icon icon-sun ico ico-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.5" y1="4.5" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19.5" y2="19.5"/><line x1="4.5" y1="19.5" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19.5" y2="4.5"/></g></svg></button><!-- /AW:theme -->
	</header>
	<main id="gallery"></main>
<script>
const C = AWCowork, g = document.getElementById('gallery');
const add = (title, html, wide) => g.insertAdjacentHTML('beforeend', `<section${wide ? ' class="wide"' : ''}><h2>${title}</h2>${html}</section>`);
const SIDE_T = { progress:'Progress', input:'Input folder', output:'Output folder', skills:'Skills', schedule:'Schedule', permissions:'Permissions' };

const ALEX = { name:'Alex', sub:'Contoso' };
add('Home', C.window({ user:ALEX, body: C.home({
	greet:'What’s first today?', placeholder:'Start a task…', model:'Auto', effort:'Medium',
	tip:'Tip: Try one of the workflow suggestions below to get started quickly.', nextTitle:'Try these next', more:'Show more',
	prompts:['Organize my inbox', 'Arrange my week', 'Create a new business pitch']
}) }), true);

add('Working, with the side panel', C.window({ user:ALEX,
	body: C.msg('user', 'Get me ready for Thursday’s Beacon migration review. Pull recent threads, summarize last time, and draft a one-page briefing I can review.')
		+ C.thinking('Planning the work…') + C.skillMsg('Preparing to create Word documents')
		+ C.steps([['Searching Outlook for Beacon threads', 'done'], ['Reading Beacon Rollout Plan.docx', 'done'], ['Drafting the briefing', 'run'], ['Drafting the agenda email', 'todo']]),
	side: C.side({ title: SIDE_T, pct: 60, input:['Beacon Rollout Plan.docx'], output:['Beacon-briefing.docx'], skills:['Email', 'Word', 'Meetings'], permissions:['Send email · only to Isaiah'] })
}), true);

add('Approval card', C.approval({ title:'Send email', tag:'Draft', risk:'Low risk', riskTone:'ok',
	fields:[['To', 'Isaiah Langer; Cameron White; Allan Deyoung'], ['Subject', 'Agenda · Beacon migration review']],
	preview:'Hi all,\nHere is the agenda for Thursday: 1) dry-run results 2) record-mapping fix 3) GA decision.',
	params:'Show parameters', cancel:'Cancel', action:'Send', more:true }));

add('Approval · More options', C.approval({ title:'Send email', risk:'Low risk', riskTone:'ok',
	fields:[['To', 'Isaiah Langer']], cancel:'Cancel', action:'Send', more:true,
	menu:['Send', 'Only to Isaiah Langer', 'Only to contoso.com recipients', 'Always allow in this session'], menuOn:1 }));

add('Question card', C.question({ q:'Who should get the agenda?', options:['Everyone invited', 'Only Isaiah', 'Just save a draft'], on:0, submit:'Submit', skip:'Skip' }));

add('Set up trigger?', C.form({ title:'Set up trigger?', fields:[['When', 'I receive an email'], ['From', 'Isaiah Langer · subject contains “GA”'], ['Run in', 'A new conversation'], ['Then do this', 'Summarize it and draft a reply for my review']],
	perm:'Needs permission to', perms:['Read email', 'Draft email'], cancel:'Cancel', action:'Set up' }));

add('Schedule confirmation', C.form({ title:'Create recurring task', fields:[['Name', 'Monday Beacon briefing'], ['Repeats', 'Every Monday'], ['Time', '9:00 AM'], ['Deliver to', 'This conversation']],
	check:'Run once now', action:'Schedule' }));

add('My tasks', C.list({ tabs:['Recent', 'Automations'], rows:[['Beacon status report', 'Today · 2 files', 'Complete', 'ok'], ['Prep the migration review', 'Waiting on you', 'Needs input', 'warn'], ['Organize my week', 'Running', 'In progress', 'accent']] }));

add('Automations', C.list({ tabs:['Manage schedules', 'Runs'], rows:[['Monday Beacon briefing', 'Every Monday · 9:00 AM', 'Active', 'ok'], ['When Isaiah emails about GA', 'Trigger · last fired never', 'Active', 'ok']] }));

add('SKILL.md', C.code('---\nname: Beacon status\ndescription: Weekly Beacon status report. Use when I ask\n  for the Beacon status or a Friday summary.\n---\nGather my Beacon threads and the last two syncs,\nthen write a one-page report: shipped, at risk,\ndecision needed. Use the layout in template.docx.'));

add('/cost', C.window({ user:ALEX, rail:'mini', body: C.msg('user', '/cost') + C.msg('cowork', '610.6 credits used for this task so far.') }));
</script>
</body>
</html>
