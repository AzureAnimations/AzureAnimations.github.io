<!DOCTYPE html>
<!--
	Draft, analyze and present with Microsoft 365 Copilot — visual companion to the Microsoft Learn
	lab course MS-4018, "Draft, analyze, and present with Microsoft 365 Copilot".

	The course is five separate labs across five apps, so a learner reading the text has no sense of
	how much there is or which app each part lives in. Step 2 lays all five out at once, and the task
	picker in step 4 carries the real prompts for each one.

	Lab titles, exercise counts, prompts, file names and warnings are taken verbatim from:
	  https://microsoftlearning.github.io/MS-4018-Draft-analyze-present-Microsoft-365-Copilot/
	Learning path:
	  https://learn.microsoft.com/training/paths/draft-analyze-present-microsoft-365-copilot/

	NOTE: MS-4018 publishes no Core/Optional split, no per-lab durations and no difficulty levels,
	so this page shows EXERCISE COUNTS instead. Do not add invented minutes or levels.

	Three levels under the site root, so shared lib paths are ../../../lib/ (not ../../lib/ as in _TEMPLATE.html).

	English, Spanish, Japanese, Korean and Portuguese. Product and in-app command names stay English
	in every locale — they are what the learner actually sees on screen.
-->
<html lang="en">
<head>
	<script src="/js/tracking.js"></script>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<meta name="description" content="A visual guide to the MS-4018 lab: prepare an interview with Copilot Chat, build a deck in PowerPoint, draft a report in Word, run a launch in Teams, and forecast sales in Excel." />
	<title>Draft, analyze and present with Microsoft 365 Copilot &mdash; Azure Animations</title>
	<link rel="icon" type="image/png" href="../../../img/favicon.png" />

	<link rel="stylesheet" href="https://unpkg.com/@microsoft/atlas-css/dist/index.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

	<script src="../../../lib/js/aw-easings.js"></script>
	<script src="../../../lib/js/aw-motion.js"></script>
	<script src="../../../lib/js/aw-theme.js"></script>
	<script src="../../../lib/js/aw-keyboard.js"></script>
	<script src="../../../lib/js/aw-captions.js"></script>

<style>
	/* ══ WARM "PARCHMENT" PALETTE · the single source of truth ══
	   Surfaces are FLAT — no gradients anywhere. Accents lighten in the dark theme,
	   so titles, borders and the per-task hues stay legible without dark overrides.
	   --task-1..6 are read from JS (TASK_COLORS) and pushed into --tc / --sc / --hc. */
	:root {
		--bg:            #f4ead6;
		--bg-soft:       #fbf6ea;
		--bg-translucent: rgba(251,246,234,0.88);
		--ink:           #241f18;
		--ink-soft:      #5b5245;
		--card:          #ffffff;
		--card-border:   #ddd2bb;
		--shadow:        0 6px 18px rgba(60,48,30,0.10);
		--shadow-strong: 0 12px 28px rgba(60,48,30,0.16);

		--accent-blue:   #1f6dff;
		--accent-purple: #9b2bd9;
		--accent-pink:   #ec3f7d;
		--accent-orange: #ff7a1a;
		--accent-green:  #2ea043;
		--accent-plum:   #7b4ddc;
		--accent-teal:   #0e7490;
		--accent-red:    #d13438;

		--accent-blue-soft:   rgba(31,109,255,0.12);
		--accent-purple-soft: rgba(155,43,217,0.10);
		--accent-green-soft:  rgba(46,160,67,0.10);

		/* Text ON a filled accent. Must flip with the theme: dark-theme accents are
		   LIGHTENED, so white-on-accent drops to ~2:1 there. */
		--on-accent: #ffffff;
		/* The light-theme green is too pale for white text (3.4:1). Filled badges use this
		   deeper shade instead; in dark the lightened accent already passes with dark ink. */
		--accent-green-deep: #1a7f37;

		--task-1: var(--accent-blue);
		--task-2: var(--accent-purple);
		--task-3: var(--accent-green);
		--task-4: var(--accent-orange);
		--task-5: var(--accent-teal);
		--task-6: var(--accent-plum);
	}
	/* Dark theme — a WARM charcoal in the parchment family, not a near-black. */
	body.theme-dark {
		--bg:            #2e2823;
		--bg-soft:       #38312a;
		--bg-translucent: rgba(56,49,42,0.88);
		--ink:           #f6f0e2;
		--ink-soft:      #cdc4b2;
		--card:          #423a31;
		--card-border:   #635948;
		--shadow:        0 6px 18px rgba(0,0,0,0.34);
		--shadow-strong: 0 12px 28px rgba(0,0,0,0.44);

		--accent-blue:   #6fa5ff;
		--accent-purple: #cd90ec;
		--accent-pink:   #f4739f;
		--accent-orange: #ff9d4d;
		--accent-green:  #5ac96f;
		--accent-plum:   #b39aff;
		--accent-teal:   #4fc2d8;
		--accent-red:    #ff8a80;

		--accent-blue-soft:   rgba(111,165,255,0.18);
		--accent-purple-soft: rgba(205,144,236,0.18);
		--accent-green-soft:  rgba(90,201,111,0.16);

		--on-accent: var(--bg);
		--accent-green-deep: var(--accent-green);

		/* Must be re-declared here: a custom property containing var() is substituted
		   where it is DECLARED, so the :root copies would stay frozen at the light hues. */
		--task-1: var(--accent-blue);
		--task-2: var(--accent-purple);
		--task-3: var(--accent-green);
		--task-4: var(--accent-orange);
		--task-5: var(--accent-teal);
		--task-6: var(--accent-plum);
	}
	/* Map onto atlas-css's --theme-* names. Needs [data-theme-preset] PLUS a theme
	   class to outrank atlas's own body[data-theme-preset]. */
	body[data-theme-preset].theme-light,
	body[data-theme-preset].theme-dark {
		--theme-body-background:             var(--bg);
		--theme-body-background-translucent: var(--bg-translucent);
		--theme-card-background:             var(--card);
		--theme-text:                        var(--ink);
		--theme-body-text:                   var(--ink);
		--theme-text-subtle:                 var(--ink-soft);
		--theme-border:                      var(--card-border);
		--theme-primary:                     var(--accent-blue);
		--theme-primary-translucent:         var(--accent-blue-soft);
		--theme-primary-invert:              #ffffff;
		--theme-tertiary:                    var(--accent-purple);
		--theme-box-shadow-medium:           var(--shadow);
	}
	html, body { height:100%; margin:0; }
	html { font-size:100%; }
	body {
		display:flex; flex-direction:column; height:100vh; overflow:hidden;
		font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; color:var(--ink);
	}
	body.theme-light, body.theme-dark { background: var(--bg); }
	.app-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-shrink:0; font-size:16px; background:var(--bg-soft); }
	#stage {
		position:relative; flex:1 1 auto; width:100%; min-height:0;
		display:flex; align-items:center; justify-content:center;
		overflow:hidden; container-type:size; padding:1.5rem 2.5rem 5rem;
	}
	#stage:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible { outline:2px solid var(--accent-blue); outline-offset:3px; border-radius:4px; }
	#stage-frame {
		position:relative; overflow:hidden; box-sizing:border-box;
		width:min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio:16/9; max-width:100%; max-height:100%;
		border-radius:16px; border:2px solid var(--card-border);
		background:var(--bg-soft); box-shadow:var(--shadow-strong);
	}

	.scene {
		position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); transform-origin:center center;
		width:min(1150px, 96%); z-index:10;
		display:flex; flex-direction:column; align-items:center; gap:1.1rem;
	}
	@keyframes awSceneIn { from { opacity:0; } to { opacity:1; } }
	@keyframes awSceneOut { from { opacity:1; } to { opacity:0; } }
	.scene.scene-in { animation:awSceneIn 0.2s ease both; }
	.scene.scene-out { animation:awSceneOut 0.2s ease both; }
	.scene-title { font-size:2.15rem; font-weight:700; color:var(--accent-purple); margin:0; text-align:center; opacity:0; }
	.scene-lead { margin:0; text-align:center; font-size:1.2rem; color:var(--ink); max-width:min(1080px,96%); line-height:1.5; opacity:0; }

	.callout {
		position:absolute; max-width:340px; padding:1rem 1.2rem;
		background:color-mix(in srgb, var(--card) 88%, transparent);
		-webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
		border:1px solid var(--card-border); border-left:4px solid var(--accent-purple);
		border-radius:8px; box-shadow:var(--shadow);
		font-size:1.02rem; line-height:1.45; color:var(--ink); z-index:14; opacity:0; cursor:grab; touch-action:none;
	}
	.callout:active { cursor:grabbing; }

	/* ── ACHIEVEMENT · closes each task with what the learner can now do ── */
	.achieve { display:flex; align-items:center; gap:0.65rem; max-width:min(1000px,98%);
		padding:0.45rem 1.05rem; border-radius:999px; border:2px solid var(--accent-green);
		background:var(--accent-green-soft); opacity:0; }
	.achieve .ach-tag { flex:none; padding:2px 10px; border-radius:999px; font-size:0.78rem; font-weight:600;
		letter-spacing:0.06em; text-transform:uppercase; color:var(--on-accent); background:var(--accent-green-deep); }
	.achieve .ach-tag.is-opt { background:var(--ink-soft); }
	.achieve .ach-lead { flex:none; font-size:1.05rem; color:var(--accent-green); }
	.achieve .ach-t { font-size:1rem; line-height:1.35; }

	/* ── PROBLEM · the idea, and the four things it isn't yet ── */
	.gap-row { display:flex; align-items:center; gap:1.5rem; width:min(1080px,98%); justify-content:center; }
	.have-card { flex:none; width:19rem; padding:1.5rem 1.3rem; border-radius:16px; border:2px solid var(--accent-blue);
		background:var(--accent-blue-soft); display:flex; flex-direction:column; gap:0.5rem; align-items:center;
		text-align:center; opacity:0; }
	.have-card img { width:3.4rem; height:3.4rem; display:block; }
	.have-card .hv-f { font-size:1.2rem; font-weight:600; }
	.have-card .hv-s { font-size:1rem; color:var(--ink-soft); line-height:1.4; }
	.gap-arrow { flex:none; width:3.4rem; color:var(--ink-soft); opacity:0; }
	.missing { display:flex; flex-direction:column; gap:0.7rem; flex:1 1 auto; min-width:0; }
	.miss { display:flex; align-items:center; gap:0.75rem; padding:0.72rem 1.1rem; border-radius:12px;
		border:2px dashed var(--card-border); color:var(--ink-soft); font-size:1.12rem; opacity:0; }
	.miss .ic { color:var(--accent-red); font-size:1.15rem; }

	/* ── CHAIN · the five deliverables, in the order the lab makes them ── */
	.chain { display:flex; align-items:stretch; gap:0.55rem; width:min(1140px,99%); }
	.chain-card { flex:1 1 0; min-width:0; padding:1.15rem 0.75rem 1.2rem; border-radius:15px;
		border:2px dashed var(--card-border); background:var(--bg-soft);
		display:flex; flex-direction:column; align-items:center; text-align:center; gap:0.45rem; opacity:0;
		transition:border-color .35s ease, background .35s ease, box-shadow .35s ease; }
	.chain-card img { width:3rem; height:3rem; display:block; }
	.chain-card .cc-task { font-size:0.84rem; font-weight:600; letter-spacing:0.04em; padding:2px 10px;
		border-radius:999px; border:1px solid var(--card-border); color:var(--ink-soft); }
	.chain-card .cc-f { font-size:1.12rem; font-weight:600; line-height:1.3; word-break:break-word; }
	.chain-card .cc-s { font-size:0.96rem; color:var(--ink-soft); line-height:1.38; }
	.chain-card.is-dim { opacity:0.42; }
	.chain-card.is-on { opacity:1; border-style:solid; border-color:var(--tc);
		background:color-mix(in srgb, var(--tc) 12%, var(--bg-soft));
		box-shadow:0 6px 22px color-mix(in srgb, var(--tc) 24%, transparent); }
	.chain-card.is-on .cc-task { border-color:var(--tc); color:var(--tc); }
	.chain-arrow { flex:none; align-self:center; width:2.4rem; color:var(--ink-soft); opacity:0; }
	/* A unicode arrow is a hairline — its visible ink is a fraction of its font-size, so raising
	   font-size never makes it read bigger. Every display arrow on this page is a solid SVG. */
	.gap-arrow svg, .chain-arrow svg, .flow-sep svg, .arch-link .al-a svg {
		display:block; width:100%; height:auto; fill:currentColor; }

	/* ── APP WINDOW MOCK · the prompt shown where it is actually typed: the Copilot pane
	   on the right of Word / Excel / PowerPoint / Outlook on the web.
	   The window is a product screenshot, so it stays LIGHT in both themes — which means it must
	   declare its own ink/line tokens locally, or the text inherits --ink and goes white-on-white. */
	.mk-win {
		--w-ink:#242424; --w-sub:#616161; --w-line:#e1dfdd; --w-soft:#faf9f8; --w-face:#ffffff;
		--w-accent:#185abd;
		/* ONE type scale for everything inside the mock — name / sub / tag. Never add a fourth size. */
		--fs-name:0.95rem; --fs-sub:0.85rem; --fs-tag:0.78rem;
		width:min(1280px,99%); border-radius:11px; overflow:hidden; opacity:0;
		border:1px solid var(--card-border); background:var(--w-face);
		box-shadow:var(--shadow-strong); color:var(--w-ink); text-align:left; }
	.mk-win[data-app="excel"]   { --w-accent:#107c41; }
	.mk-win[data-app="ppt"]     { --w-accent:#c43e1c; }
	.mk-win[data-app="outlook"] { --w-accent:#0f6cbd; }
	.mk-win[data-app="teams"]   { --w-accent:#5b5fc7; }
	.mk-win[data-app="chat"]    { --w-accent:#6f2fa8; }
	.mk-win[data-app="onedrive"]{ --w-accent:#0364b8; }

	/* ── EDGE BROWSER CHROME · every MS-4018 lab runs in the browser, and the lab's own setup
	   step says "Open a Microsoft Edge browser". The URL is the one the lab tells you to visit. ── */
	.mk-edge { background:#eff1f3; border-bottom:1px solid var(--w-line); }
	.mk-etabs { display:flex; align-items:flex-end; gap:0.3rem; padding:0.3rem 0.5rem 0; }
	.mk-etab { display:inline-flex; align-items:center; gap:0.35rem; max-width:62%; min-width:0;
		padding:0.26rem 0.6rem; border-radius:7px 7px 0 0; font-size:var(--fs-tag); color:var(--w-ink);
		background:var(--w-face); border:1px solid var(--w-line); border-bottom:none; }
	.mk-etab img { flex:none; width:0.85rem; height:0.85rem; display:block; }
	.mk-etab > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	.mk-ex { flex:none; font-style:normal; color:var(--w-sub); font-size:0.6rem; }
	.mk-enew { color:var(--w-sub); font-size:var(--fs-sub); padding:0 0.35rem 0.2rem; }
	.mk-eaddr { display:flex; align-items:center; gap:0.55rem; padding:0.3rem 0.6rem;
		background:var(--w-face); border-top:1px solid var(--w-line); }
	.mk-enav { display:inline-flex; gap:0.5rem; color:var(--w-sub); font-size:var(--fs-sub); }
	.mk-enav i { font-style:normal; }
	.mk-url { flex:1 1 auto; display:inline-flex; align-items:center; gap:0.4rem; min-width:0;
		padding:0.2rem 0.65rem; border-radius:999px; background:var(--w-soft);
		border:1px solid var(--w-line); font-size:var(--fs-tag); color:var(--w-sub); }
	.mk-url svg { flex:none; width:0.72rem; height:0.72rem; }
	.mk-url span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

	.mk-bar { display:flex; align-items:center; gap:0.5rem; padding:0.4rem 0.7rem;
		background:var(--w-soft); border-bottom:1px solid var(--w-line); }
	.mk-bar img { width:1.15rem; height:1.15rem; display:block; }
	.mk-file { font-size:var(--fs-name); font-weight:600; color:var(--w-ink); }
	.mk-save { font-size:var(--fs-tag); color:var(--w-sub); }

	.mk-ribbon { display:flex; align-items:center; gap:0.9rem; padding:0.35rem 0.75rem;
		border-bottom:1px solid var(--w-line); background:var(--w-face); }
	.mk-tab { font-size:var(--fs-tag); color:var(--w-sub); }
	.mk-tab.is-on { color:var(--w-accent); font-weight:600; box-shadow:inset 0 -2px 0 var(--w-accent); padding-bottom:2px; }
	.mk-cpbtn { margin-left:auto; display:inline-flex; align-items:center; gap:0.3rem; padding:0.16rem 0.6rem;
		border-radius:999px; border:1px solid #d9c8f0; background:#f6efff; color:#6f2fa8; font-size:var(--fs-tag); font-weight:600; }
	.mk-cpbtn img { width:0.95rem; height:0.95rem; display:block; }

	.mk-body { display:flex; align-items:stretch; min-height:4.4rem; }
	/* the window is now app CONTEXT only — the prompts live in the card row beneath it */
	.mk-canvas { flex:1 1 auto; min-width:0; padding:0.7rem 0.9rem; display:flex; flex-direction:column;
		gap:0.4rem; background:var(--w-face); }
	/* generic document furniture, reused by every app canvas */
	.mk-h { height:0.72rem; width:58%; border-radius:3px; background:var(--w-accent); opacity:0.75; }
	.mk-l { height:0.46rem; border-radius:3px; background:var(--w-line); }
	.mk-l.w90 { width:90%; } .mk-l.w75 { width:75%; } .mk-l.w60 { width:60%; }
	.mk-cap { font-size:var(--fs-sub); color:var(--w-sub); margin-top:0.15rem; }

	/* Teams · two stacked channel posts instead of a document body */
	.mk-post { border:1px solid var(--w-line); border-radius:5px; padding:0.5rem 0.55rem;
		display:flex; flex-direction:column; gap:0.32rem; }

	/* Setup · the OneDrive rule sits in the window; the three files are cards below it */
	.mk-rule { display:flex; align-items:flex-start; gap:0.45rem;
		font-size:var(--fs-sub); line-height:1.45; color:var(--w-sub); }
	.mk-rule .ic { flex:none; width:0.86rem; height:0.86rem; color:var(--accent-green-deep); }
	.mk-tbl { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:0.25rem; }
	.mk-tbl span { height:0.8rem; border-radius:2px; background:var(--w-line); }
	.mk-tbl span.hd { background:var(--w-accent); opacity:0.55; }
	.mk-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; }
	.mk-grid span { height:0.8rem; border-radius:2px; background:var(--w-soft); border:1px solid var(--w-line); }
	.mk-grid span.hd { background:var(--w-accent); opacity:0.6; border-color:transparent; }
	.mk-chart { display:flex; align-items:flex-end; gap:0.4rem; height:2.4rem; margin-top:0.3rem; }
	.mk-chart i { flex:1 1 0; border-radius:3px 3px 0 0; background:var(--w-accent); opacity:0.8; }
	.mk-slide { border:1px solid var(--w-line); border-radius:5px; padding:0.5rem; display:flex;
		flex-direction:column; gap:0.3rem; flex:1 1 auto; background:var(--w-soft); }
	.mk-rail { display:flex; gap:0.35rem; }
	.mk-rail i { flex:1 1 0; height:1.5rem; border-radius:4px; border:1px solid var(--w-line); background:var(--w-soft); }
	.mk-rail i.is-new { border-color:var(--w-accent); background:color-mix(in srgb, var(--w-accent) 14%, #fff); }
	.mk-cal { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; flex:1 1 auto; }
	.mk-cal i { border:1px solid var(--w-line); border-radius:4px; background:var(--w-soft); position:relative; }
	.mk-cal i.busy::after { content:""; position:absolute; left:2px; right:2px; height:26%;
		border-radius:3px; background:var(--w-accent); opacity:0.65; top:22%; }
	.mk-cal i.busy.late::after { top:58%; }

	/* ── PROMPT CARDS · the prompts sit in a ROW under the window, not in a vertical chat thread.
	   A stacked thread of three verbatim lab prompts is ~400px tall, which forced fitScene to shrink
	   the whole step to ~0.7 and made everything unreadable. Three columns cost ~150px instead. ── */
	.pc-row { width:min(1280px,99%); display:grid; grid-template-columns:repeat(3,1fr); gap:0.7rem; }
	.pc-row.is-2 { grid-template-columns:repeat(2,1fr); max-width:900px; }
	.pc-card { display:flex; flex-direction:column; gap:0.3rem; padding:0.6rem 0.7rem; text-align:left;
		border-radius:10px; border:2px solid var(--pcc); background:var(--theme-card-background,#fff);
		box-shadow:0 4px 14px rgba(0,0,0,0.07); }
	body.theme-dark .pc-card { background:var(--card); }
	.pc-top { display:flex; align-items:center; gap:0.4rem; }
	.pc-top img { flex:none; width:1.1rem; height:1.1rem; display:block; }
	.pc-n { flex:none; width:1.25rem; height:1.25rem; border-radius:50%; background:var(--pcc); color:var(--on-accent);
		display:inline-flex; align-items:center; justify-content:center; font-size:var(--fs-tag); font-weight:700; }
	.pc-where { font-size:var(--fs-tag); font-weight:600; color:var(--pcc); line-height:1.25; }
	.pc-p { font-size:var(--fs-name); line-height:1.34; color:var(--ink);
		padding:0.4rem 0.55rem; border-radius:8px; border:1px solid var(--card-border); background:var(--bg-soft); }
	.pc-p .mk-ref { padding:0 0.26em; border-radius:4px; font-weight:600;
		background:color-mix(in srgb, var(--pcc) 22%, transparent); }
	.pc-o { display:flex; gap:0.35rem; align-items:flex-start; font-size:var(--fs-sub);
		line-height:1.34; color:var(--ink-soft); }
	.pc-o .ic { flex:none; width:0.85rem; height:0.85rem; color:var(--accent-green-deep); margin-top:0.12rem; }
	@media (max-width:900px) { .pc-row, .pc-row.is-2 { grid-template-columns:1fr; } }

	/* ── RESULT PILLS · what lands on screen after the prompt runs ── */
	.chip-row { display:flex; flex-wrap:wrap; gap:0.55rem; justify-content:center; }
	.pill { display:inline-flex; align-items:center; gap:0.45rem; padding:0.42rem 0.95rem; border-radius:999px;
		font-size:0.98rem; font-weight:600; border:2px solid var(--accent-purple);
		background:var(--accent-purple-soft); color:var(--ink); opacity:0; }
	.recap-foot { font-size:1.05rem; text-align:center; max-width:860px; opacity:0; color:var(--ink); }

	/* ── OUTCOMES · what the five core tasks earned you ── */
	.outcomes { display:flex; flex-direction:column; gap:0.5rem; width:min(1010px,98%); }
	.outcome { display:flex; align-items:center; gap:0.8rem; padding:0.55rem 1rem; border-radius:12px;
		border:2px solid var(--oc); background:color-mix(in srgb, var(--oc) 9%, transparent); opacity:0; }
	.outcome .oc-tag { flex:none; min-width:5.4rem; text-align:center; padding:2px 10px; border-radius:999px;
		font-size:0.78rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--on-accent); background:var(--oc); }
	.outcome .oc-task { flex:none; font-size:0.9rem; font-weight:600; color:var(--oc); }
	.outcome .oc-t { font-size:1rem; line-height:1.35; }
	.outcome .oc-v { margin-left:auto; flex:none; font-size:0.9rem; font-weight:600; color:var(--ink-soft); }

	/* ── OVERVIEW · the lab at a glance ── */
	.ov-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.8rem; width:min(1130px,99%); }
	.ov-card { display:flex; flex-direction:column; gap:0.32rem; padding:0.95rem 1rem 1rem; border-radius:14px;
		border:2px solid var(--tc); background:color-mix(in srgb, var(--tc) 10%, var(--card)); opacity:0; }
	.ov-top { display:flex; align-items:center; gap:0.5rem; }
	.ov-top img { width:1.5rem; height:1.5rem; display:block; }
	.ov-n { font-size:0.86rem; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--tc); }
	.ov-kind { margin-left:auto; font-size:0.78rem; font-weight:600; padding:2px 9px; border-radius:999px;
		border:1px solid var(--card-border); color:var(--ink-soft); }
	.ov-kind.is-core { border-color:var(--accent-green); color:var(--accent-green); }
	.ov-h { font-size:1.08rem; font-weight:600; line-height:1.3; }
	.ov-p { font-size:0.95rem; color:var(--ink-soft); line-height:1.4; }
	.ov-meta { margin-top:auto; padding-top:0.45rem; display:flex; align-items:center; flex-wrap:wrap; gap:0.5rem;
		font-size:0.88rem; color:var(--ink-soft); }
	.ov-app { font-weight:600; color:var(--tc); }

	/* ── FLOW · the running example, one line ── */
	.flow { display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center; align-items:center; opacity:0; }
	.flow-node { display:inline-flex; align-items:center; gap:0.5rem; padding:0.5rem 1.05rem; border-radius:999px;
		border:2px solid var(--fc); background:color-mix(in srgb, var(--fc) 9%, transparent); font-size:1.05rem; font-weight:600; }
	.flow-node img { width:1.35rem; height:1.35rem; display:block; }
	.flow-sep { flex:none; width:2rem; color:var(--ink-soft); }

	/* ── WHERE IT LIVES · browser, Copilot, OneDrive — and which task uses each ── */
	.arch { display:flex; align-items:center; gap:0.45rem; width:min(1140px,99%); }
	.tier { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:0.45rem;
		padding:0.6rem 0.6rem 0.7rem; border-radius:14px; border:1.5px dashed var(--card-border); opacity:0; }
	.tier.is-copilot { border-style:solid; border-color:var(--accent-purple); background:var(--accent-purple-soft); }
	.tier-head { display:flex; align-items:center; gap:0.35rem; font-size:0.8rem; font-weight:600;
		letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); }
	.tier.is-copilot .tier-head { color:var(--accent-purple); }
	.tier-head .tier-mark { width:1.15rem; height:1.15rem; display:block; }
	.comp { position:relative; padding:0.42rem 0.55rem 0.48rem; border-radius:10px; display:flex; flex-direction:column; gap:0.1rem;
		border:1.5px solid var(--card-border); background:var(--card); transition:box-shadow .35s ease, border-color .35s ease; }
	.comp-name { font-size:0.95rem; font-weight:600; display:flex; align-items:center; gap:0.35rem; color:var(--ink); }
	.comp-name .ic { color:var(--tc); }
	.comp-name img { width:1.05rem; height:1.05rem; display:block; flex:none; }
	.comp-sub { font-size:0.83rem; color:var(--ink-soft); line-height:1.3; }
	/* tinted rather than filled: a solid task accent under white text fails AA in the light theme */
	.comp-task { position:absolute; top:-0.55rem; right:0.5rem; padding:1px 7px; border-radius:999px;
		font-size:0.72rem; font-weight:600; color:var(--ink); background:color-mix(in srgb, var(--tc) 24%, var(--card));
		border:1px solid var(--tc); white-space:nowrap; }
	.comp.is-lit { border-color:var(--tc); box-shadow:0 4px 18px color-mix(in srgb, var(--tc) 32%, transparent); }
	.arch-link { flex:0 0 auto; align-self:center; display:flex; flex-direction:column; align-items:center; gap:0.15rem; opacity:0; }
	.arch-link .al-a { width:2.6rem; color:var(--ink-soft); }
	.arch-link .al-t { font-size:0.76rem; line-height:1.25; text-align:center; max-width:8.5rem; color:var(--ink-soft); }
	.arch-legend { display:flex; flex-wrap:wrap; gap:0.65rem; justify-content:center; opacity:0; }
	.leg { display:inline-flex; align-items:center; gap:0.35rem; font-size:0.84rem; color:var(--ink-soft); }
	.leg i { width:0.68rem; height:0.68rem; border-radius:3px; background:var(--tc); }

	/* ── TASK BUTTONS · shared by the toggle step and the picker step ── */
	.arch-controls { display:flex; flex-direction:column; align-items:center; gap:0.5rem; opacity:0; }
	.arch-hint { font-size:0.92rem; color:var(--ink-soft); }
	.arch-btns { display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center; }
	.task-btn {
		-webkit-appearance:none; appearance:none; margin:0; font:inherit;
		display:inline-flex; align-items:center; gap:0.45rem; padding:0.4rem 1rem;
		border:2px solid color-mix(in srgb, var(--tc) 45%, transparent); border-radius:999px;
		background:transparent; color:var(--ink);
		font-size:0.92rem; font-weight:600; cursor:pointer; white-space:nowrap;
		transition:background .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
	}
	.task-btn i { width:0.7rem; height:0.7rem; border-radius:3px; background:var(--tc); flex:none; }
	.task-btn.is-opt { border-style:dashed; }
	.task-btn:hover { transform:translateY(-1px); background:color-mix(in srgb, var(--tc) 12%, transparent); }
	/* tinted, not filled — a solid accent fill drops the label under 4:1 in the light theme */
	.task-btn.is-on {
		border-color:var(--tc); background:color-mix(in srgb, var(--tc) 22%, var(--card));
		box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 20%, transparent);
	}

	/* ── TASK PICKER · the six tasks share one step, one panel at a time ── */
	/* The picker is persistent chrome, so this scene anchors to the TOP instead of
	   centring — otherwise each panel's height re-centres and the buttons drift. */
	.scene.is-top { top:1.4rem; transform:translate(-50%,0); transform-origin:top center; }
	.scene.is-top .scene-title { font-size:1.75rem; }
	.scene.is-top .scene-lead { min-height:3.4rem; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
	.task-picker { display:flex; flex-direction:column; align-items:center; gap:0.35rem; opacity:0; }
	.task-picker-row { display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center; }
	.task-picker-hint { font-size:0.9rem; color:var(--ink-soft); }
	/* centred, not top-aligned: the body is pinned to the TALLEST panel, so a short panel like Setup
	   would otherwise sit against the top with a visible hole beneath it */
	.task-body { width:100%; display:flex; justify-content:center; align-items:center; }
	.task-panel { display:flex; flex-direction:column; align-items:center; gap:0.5rem; width:100%; }
	/* On the picker step the PANEL is the hero and the heading changes on every click, so the title
	   and lead give their height back — the whole scene is scaled to fit, and a 2-line 2.15rem
	   heading was shrinking the mock everyone actually needs to read. */
	.scene.is-top .scene-title { font-size:1.8rem; }
	.scene.is-top .scene-lead { font-size:1.05rem; max-width:min(1180px,96%); }
	.task-note { max-width:min(920px,96%); padding:0.4rem 1rem; border-radius:10px;
		border:1px dashed var(--card-border); font-size:0.92rem; line-height:1.4;
		color:var(--ink-soft); text-align:center; opacity:0; }
	.task-app { display:inline-flex; align-items:center; gap:0.45rem; padding:0.3rem 0.9rem; border-radius:999px;
		border:2px solid var(--tc); background:color-mix(in srgb, var(--tc) 10%, transparent);
		font-size:0.92rem; font-weight:600; opacity:0; }
	.task-app img { width:1.15rem; height:1.15rem; display:block; }

	/* ── CONTROLS ── */
	#controls {
		position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:40;
		display:flex; align-items:center; gap:5px; padding:5px 7px;
		background:var(--bg-translucent);
		backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4);
		border:1px solid var(--card-border); border-radius:999px;
		box-shadow:var(--shadow-strong); font-size:13px; color:var(--ink);
	}
	#controls .ctrl-icon { width:2.15rem; height:2.15rem; min-width:0; padding:0; display:inline-flex;
		align-items:center; justify-content:center; border-radius:50%; font-size:0.95rem; font-weight:600;
		transition:background .18s ease, transform .12s ease; }
	#controls .ctrl-icon:hover { transform:translateY(-1px); }
	#controls .ctrl-icon-next { width:2.55rem; height:2.55rem; font-size:1.1rem;
		box-shadow:0 2px 8px var(--accent-blue-soft); }
	.step-counter { min-width:78px; text-align:center; font-variant-numeric:tabular-nums; font-size:14px;
		font-weight:600; padding:0 6px; white-space:nowrap; color:var(--ink); }
	.ctrl-sep { width:1px; align-self:stretch; margin:4px 2px; background:var(--card-border); }
	.speed-control { display:inline-flex; align-items:center; gap:1px; padding:2px 3px;
		border:1px solid var(--card-border); border-radius:999px; }
	.speed-control .speed-btn { width:1.7rem; height:1.7rem; min-width:0; padding:0; display:inline-flex;
		align-items:center; justify-content:center; font-size:0.95rem; font-weight:600; border-radius:50%; }
	.speed-control .speed-btn[disabled] { opacity:0.4; cursor:not-allowed; }
	.speed-label { min-width:2.4rem; text-align:center; font-variant-numeric:tabular-nums; font-size:0.82rem; font-weight:600; }

	/* Movable dock — drag by the grip, pin it back to centre */
	.ctrl-grip { display:inline-flex; align-items:center; justify-content:center; width:1.5rem; height:2.15rem;
		padding:0; border:none; background:transparent; color:var(--ink-soft); border-radius:8px;
		cursor:grab; touch-action:none; transition:background .18s ease, color .18s ease; }
	.ctrl-grip:hover { color:var(--ink); background:var(--accent-blue-soft); }
	.ctrl-grip:active { cursor:grabbing; }
	.ctrl-grip svg { width:13px; height:16px; pointer-events:none; }
	body.controls-floating .ctrl-grip { color:var(--accent-blue); }
	#controls .ctrl-pin { display:none; color:var(--accent-blue); }
	#controls .ctrl-pin svg { width:15px; height:15px; pointer-events:none; }
	body.controls-floating #controls .ctrl-pin { display:inline-flex; }
	body.controls-floating #controls { box-shadow:var(--shadow-strong), 0 0 0 1.5px var(--accent-blue); }

	/* Reset "pin" — shown on a panel once it has been dragged or resized off its home spot */
	.aw-drag-reset { position:absolute; width:24px; height:24px; padding:0; display:none;
		align-items:center; justify-content:center; border-radius:50%;
		background:var(--accent-purple); color:#fff; border:2px solid var(--card);
		box-shadow:0 2px 7px rgba(0,0,0,0.4); cursor:pointer; z-index:6; opacity:0.92;
		transition:opacity .14s ease, transform .14s ease; }
	.aw-drag-reset:hover { opacity:1; transform:scale(1.08); }
	.aw-drag-reset svg { width:13px; height:13px; display:block; }

	.stage-overlay { position:absolute; left:12px; bottom:10px; z-index:25; display:flex; align-items:center; gap:2px;
		padding:3px 6px; border-radius:999px; background:rgba(16,18,24,0.58);
		backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px); box-shadow:0 4px 16px rgba(0,0,0,0.32); }
	.ovl-btn { -webkit-appearance:none; appearance:none; margin:0; font:inherit; display:inline-flex;
		align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 8px;
		border:none !important; border-radius:999px !important; background:transparent !important;
		color:#fff !important; cursor:pointer; opacity:0.86; transition:background .15s ease, opacity .15s ease; }
	.ovl-btn:hover { background:rgba(255,255,255,0.16) !important; opacity:1; }
	.ovl-btn svg { width:18px; height:18px; fill:currentColor; display:block; }
	.ovl-btn.toggle-active { color:#5cc8ff !important; opacity:1; }
	.ovl-btn[data-tip] { position:relative; }
	.ovl-btn[data-tip]::after { content:attr(data-tip); position:absolute; left:0; bottom:calc(100% + 9px);
		padding:4px 8px; border-radius:6px; background:rgba(16,18,24,0.96); color:#fff; font-size:0.72rem;
		font-weight:600; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .14s ease; z-index:40; }
	.ovl-btn[data-tip]:hover::after { opacity:1; }
	.stage-overlay.is-right { left:auto; right:12px; }
	.ovl-btn.ovl-audio { gap:0.35rem; font-size:0.82rem; font-weight:600; }
	.ovl-btn .aw-audio-time { font-variant-numeric:tabular-nums; }
	.ovl-btn .fs-exit { display:none; }
	body.is-fs .ovl-btn .fs-enter { display:none; }
	body.is-fs .ovl-btn .fs-exit { display:block; }

	/* Hiding the top bar grows the stage — the scene is re-FITTED, never replayed. */
	body.chrome-hidden .app-header, body.chrome-hidden .progress-track { display:none; }
	#header-hide-top { display:inline-flex; align-items:center; justify-content:center; width:2.25rem; height:2.25rem;
		padding:0; background:transparent; border:1px solid var(--card-border); border-radius:999px;
		color:var(--ink-soft); cursor:pointer; transition:color .2s ease, transform .18s ease; }
	#header-hide-top:hover { color:var(--ink); transform:translateY(-1px); }
	#header-hide-top svg { width:16px; height:16px; }
	#header-reveal {
		position:fixed; top:0; left:50%; transform:translateX(-50%) translateY(-100%); z-index:45;
		display:inline-flex; align-items:center; gap:0.35rem; padding:5px 14px 6px;
		font-size:12px; font-weight:600; line-height:1; font-family:inherit;
		color:var(--ink-soft); background:var(--bg-translucent);
		backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
		border:1px solid var(--card-border); border-top:none; border-radius:0 0 12px 12px;
		box-shadow:var(--shadow); cursor:pointer;
		transition:transform .28s cubic-bezier(0.2,0.7,0.3,1), color .2s ease;
	}
	#header-reveal:hover { color:var(--ink); }
	body.chrome-hidden #header-reveal { transform:translateX(-50%) translateY(0); }
	#header-reveal svg { width:14px; height:14px; }

	/* Caption bar · synced to the step's clip by aw-captions.js */
	#aw-caption {
		position:absolute; left:50%; transform:translateX(-50%); bottom:64px; z-index:30;
		display:none; align-items:center; justify-content:center; text-align:center;
		max-width:min(880px,88%); min-width:140px; min-height:38px; max-height:44%;
		padding:0.55rem 1.1rem; border-radius:12px;
		background:rgba(16,18,24,0.84); color:#fff; font-size:1.02rem; line-height:1.45;
		-webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
		box-shadow:0 4px 16px rgba(0,0,0,0.32);
		overflow:auto; resize:both;   /* corner grip reshapes the bar */
		pointer-events:auto; cursor:grab; touch-action:none;
	}
	#aw-caption:active { cursor:grabbing; }
	#aw-caption::-webkit-resizer { background:linear-gradient(135deg, transparent 45%, rgba(255,255,255,0.55) 45%, rgba(255,255,255,0.55) 55%, transparent 55%); }
	body.cc-on #aw-caption.has-text { display:flex; }

	#step-outline { position:fixed; top:4.5rem; right:1rem; width:330px; max-height:calc(100vh - 8rem);
		overflow-y:auto; padding:1.1rem; background:color-mix(in srgb, var(--card) 90%, transparent);
		-webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); border:1px solid var(--card-border);
		border-radius:12px; box-shadow:var(--shadow-strong); z-index:35; font-size:0.98rem; line-height:1.55;
		color:var(--ink); cursor:grab; touch-action:none; }
	#step-outline[hidden] { display:none; }
	#step-outline h2 { font-size:0.82rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase;
		color:var(--accent-purple); margin:0 0 0.5rem; }
	#step-outline .outline-section { margin-top:0.6rem; padding-top:0.6rem; border-top:1px solid var(--card-border); }
	#step-outline .outline-section:first-child { margin-top:0; padding-top:0; border-top:0; }
	#step-outline p { margin:0.4rem 0 0; }
	#step-outline .stat-row { display:flex; justify-content:space-between; gap:0.75rem; padding:0.2rem 0; }
	#step-outline .stat-row span:first-child { color:var(--ink-soft); flex:0 0 auto; max-width:45%; }
	#step-outline .stat-row span:last-child { text-align:right; font-weight:600; color:var(--accent-purple); }

	.progress-track { position:relative; height:6px; background:var(--card-border); flex-shrink:0; }
	.progress-fill { position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--accent-purple);
		transition:width .5s cubic-bezier(0.2,0.8,0.2,1); }

	.theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:2.25rem; height:2.25rem;
		padding:0; background:transparent; border:1px solid var(--card-border); border-radius:999px;
		color:var(--ink); cursor:pointer; }
	.theme-toggle .theme-icon { display:none; }
	.theme-toggle[data-theme="dark"] .icon-sun { display:block; }
	.theme-toggle[data-theme="light"] .icon-moon { display:block; }
	.font-size-btn { background:transparent; color:var(--ink); border:1px solid var(--card-border);
		border-radius:4px; padding:3px 8px; font-size:0.8rem; font-weight:600; cursor:pointer; }
	#lang-select { background:var(--card); color:var(--ink); border:1px solid var(--card-border);
		border-radius:999px; padding:3px 10px; font-size:0.82rem; font-weight:600; cursor:pointer; }
	.header-back-link { display:inline-flex; align-items:center; gap:0.25rem; padding:0.2rem 0.6rem; font-size:0.8rem;
		font-weight:600; color:var(--ink-soft); border:1px solid var(--card-border); border-radius:999px;
		text-decoration:none; white-space:nowrap; }
	.lab-link { font-size:0.8rem; font-weight:600; color:var(--accent-blue); text-decoration:none;
		border:1px solid var(--card-border); border-radius:999px; padding:0.2rem 0.7rem; white-space:nowrap; }
	.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
	.ic { display:inline-flex; align-items:center; justify-content:center; vertical-align:-0.125em; }
	.ic svg { width:1em; height:1em; fill:currentColor; display:block; }
	.help-toggle svg { width:15px; height:15px; }

	/* Keyboard shortcut overlay */
	#shortcut-overlay { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; }
	#shortcut-overlay[hidden] { display:none; }
	.sc-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.5); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
	.sc-panel { position:relative; z-index:1; width:min(430px,92vw); max-height:82vh; overflow:auto;
		padding:1.5rem 1.6rem; background:var(--card); border:1px solid var(--card-border);
		border-radius:18px; box-shadow:var(--shadow-strong); color:var(--ink); }
	.sc-panel h2 { margin:0 0 1rem; font-size:1.25rem; color:var(--accent-purple); }
	.sc-close { position:absolute; top:0.7rem; right:0.7rem; width:2rem; height:2rem; display:inline-flex;
		align-items:center; justify-content:center; border:1px solid var(--card-border); border-radius:50%;
		background:transparent; color:var(--ink-soft); cursor:pointer; }
	.sc-close:hover { color:var(--ink); border-color:var(--accent-blue); }
	.sc-close svg { width:15px; height:15px; }
	.sc-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0.55rem; }
	.sc-list li { display:flex; align-items:center; justify-content:space-between; gap:1rem; font-size:1rem; }

// ── THEME ─────────────────────────────────
const themeToggleBtn = document.getElementById('theme-toggle');
function syncThemeBtn(){
	if(!themeToggleBtn) return;
	const isDark = document.body.classList.contains('theme-dark');
	themeToggleBtn.dataset.theme = isDark ? 'dark' : 'light';
	themeToggleBtn.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
}
if (window.AW && AW.theme) { AW.theme.onChange(syncThemeBtn); syncThemeBtn(); }
else {
	try { const s=localStorage.getItem('aw-theme'); if(s){ document.body.classList.remove('theme-dark','theme-light'); document.body.classList.add(s); } } catch(_){}
	syncThemeBtn();
	themeToggleBtn.addEventListener('click', () => {
		const dark = !document.body.classList.contains('theme-dark');
		document.body.classList.remove('theme-dark','theme-light');
		document.body.classList.add(dark ? 'theme-dark' : 'theme-light');
		try { localStorage.setItem('aw-theme', dark ? 'theme-dark':'theme-light'); } catch(_){}
		syncThemeBtn();
	});
}

// ── Font size ─────────────────────────────
const fontScales=[0.8,0.9,1,1.1,1.2,1.35]; let fontScaleIdx=2;
const baseFontSize=parseFloat(getComputedStyle(document.documentElement).fontSize);
function applyFontScale(){
	document.documentElement.style.fontSize=(baseFontSize*fontScales[fontScaleIdx])+'px';
	const c=document.getElementById('controls'); if(c) c.style.fontSize=baseFontSize+'px';
	const s=stage.querySelector('.scene:not(.scene-out)');
	// the panels rewrap at a new font size, so the task reserve must be redone
	if(s && !animating) reserveTaskBody(s);
	if(s) fitScene(s);
}
try{ const f=parseInt(localStorage.getItem('aw-cplab-font'),10); if(!isNaN(f)&&f>=0&&f<fontScales.length){ fontScaleIdx=f; } }catch(_){}
document.getElementById('font-decrease').addEventListener('click',()=>{ if(fontScaleIdx>0){fontScaleIdx--;applyFontScale();try{localStorage.setItem('aw-cplab-font',String(fontScaleIdx));}catch(_){}} });
document.getElementById('font-increase').addEventListener('click',()=>{ if(fontScaleIdx<fontScales.length-1){fontScaleIdx++;applyFontScale();try{localStorage.setItem('aw-cplab-font',String(fontScaleIdx));}catch(_){}} });

// ── Language ──────────────────────────────
const langSelect=document.getElementById('lang-select');
// The hub stores its language under `aw-lang`, this page under `aw-cplab-lang`, so returning with a
// plain link would drop the locale. Carry it in the URL, which the hub reads before either store.
function syncBackLink(){
	const a=document.getElementById('back-link');
	if(!a) return;
	a.setAttribute('href','../../Copilot/index.html?lang='+encodeURIComponent(currentLang));
	a.textContent='\u2190 '+t('backLabel');
	a.setAttribute('aria-label', t('backAria'));
}
function setLanguage(lang){
	currentLang=lang;
	document.documentElement.lang=lang;
	try{ localStorage.setItem('aw-cplab-lang',lang); }catch(_){}
	try{ const u=new URL(location.href); u.searchParams.set('lang',lang); history.replaceState(null,'',u); }catch(_){}
	document.getElementById('page-title').textContent=t('pageTitle');
	document.getElementById('stage-heading').textContent=t('stageHeading');
	if(langSelect) langSelect.value=lang;
	syncBackLink();
	if(current>=0) renderStep(current);
}
(function(){
	let want=null;
	try{ want=new URLSearchParams(location.search).get('lang'); }catch(_){}
	if(!want){ try{ want=localStorage.getItem('aw-cplab-lang'); }catch(_){} }
	if(want && I18N[want]) currentLang=want;
	document.documentElement.lang=currentLang;
	syncBackLink();
	if(langSelect){ langSelect.value=currentLang; langSelect.addEventListener('change',e=>setLanguage(e.target.value)); }
}());

function syncCalloutBtn(){ calloutBtn.classList.toggle('toggle-active',calloutEnabled); calloutBtn.setAttribute('aria-pressed',calloutEnabled?'true':'false'); calloutBtn.setAttribute('data-tip',calloutEnabled?'Callouts: On':'Callouts: Off'); }
calloutBtn.addEventListener('click',()=>{
	calloutEnabled=!calloutEnabled; syncCalloutBtn();
	if(current<0) return;
	const existing=stage.querySelectorAll('.callout');
	if(calloutEnabled){ if(!existing.length){ const c=maybeCallout(STEPS[current]); if(c) gsap.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.4,overwrite:true}); } }
	else { existing.forEach(c=>{ const i=liveEls.indexOf(c); if(i>-1) liveEls.splice(i,1); gsap.killTweensOf(c); c.remove(); }); }
}); syncCalloutBtn();
function syncOutlineBtn(){ const on=!outlinePanel.hasAttribute('hidden'); outlineBtn.classList.toggle('toggle-active',on); outlineBtn.setAttribute('aria-expanded',on?'true':'false'); outlineBtn.setAttribute('data-tip',on?'Outline: On':'Outline: Off'); }
outlineBtn.addEventListener('click',()=>{ if(outlinePanel.hasAttribute('hidden')) outlinePanel.removeAttribute('hidden'); else outlinePanel.setAttribute('hidden',''); syncOutlineBtn(); }); syncOutlineBtn();

function icon(n){ return '<span class="ic">'+(ICONS[n]||'')+'</span>'; }
// Solid arrows, drawn rather than typed: a thick shaft plus a real arrowhead, so they stay
// legible at the sizes these diagrams use.
const ARROW_R='<svg viewBox="0 0 64 44" aria-hidden="true"><rect x="2" y="16" width="40" height="12" rx="3"/><path d="M63 22 L38 5 L38 39 Z"/></svg>';
const ARROW_BI='<svg viewBox="0 0 76 44" aria-hidden="true"><rect x="18" y="16" width="40" height="12" rx="3"/><path d="M1 22 L26 5 L26 39 Z"/><path d="M75 22 L50 5 L50 39 Z"/></svg>';
function img(src,cls){ return '<img'+(cls?' class="'+cls+'"':'')+' src="'+src+'" alt="" aria-hidden="true">'; }
function stepById(id){ return STEPS.find(s=>s.id===id); }
function fitScene(scene){
	if(!scene) return;
	const topAnchored=scene.classList.contains('is-top');
	const base=topAnchored ? 'translate(-50%,0)' : 'translate(-50%,-50%)';
	scene.style.transform=base+' scale(1)';
	const box=stage.getBoundingClientRect();
	const availW=box.width-32, availH=box.height-(topAnchored?50:28);
	const sw=scene.offsetWidth, sh=scene.offsetHeight;
	if(!sw||!sh) return;
	scene.style.transform=base+' scale('+Math.min(1, availW/sw, availH/sh)+')';
}
function headerEls(s){ return [s.querySelector('.scene-title'), s.querySelector('.scene-lead')]; }
function buildScene(step){
	const s=el('scene');
	s.appendChild(el('scene-title', t(step.titleKey)));
	s.appendChild(el('scene-lead', t(step.descKey)));
	return s;
}
function maybeCallout(step){
	if(!calloutEnabled) return null;
	const c=el('callout', t(step.calloutKey));
	c.style.left='1.5rem'; c.style.top='1.5rem';
	stage.appendChild(c); liveEls.push(c); dragify(c,'aw-cplab-callout-pos');
	return c;
}
// Shown on each panel — the capability just unlocked, tagged with that lab's exercise count.
function achievement(task){
	return el('achieve',
		'<span class="ach-tag">'+t(TASK_COUNT[task])+'</span>'+
		'<span class="ach-lead">'+icon('check')+'</span>'+
		'<span class="ach-t">'+t('ach'+task)+'</span>');
}

// ── The deliverable chain · shared by the blueprint and the recap ──
// Setup (panel 1) produces no artefact, so the chain starts at Lab 1 (panel 2).
const CHAIN=[
	['prep', 'chat',  2,'dlF1','dlS1'],
	['deck', 'ppt',   3,'dlF2','dlS2'],
	['doc',  'word',  4,'dlF3','dlS3'],
	['meet', 'teams', 5,'dlF4','dlS4'],
	['data', 'excel', 6,'dlF5','dlS5']
];
function buildChain(on){
	on=on||[];
	const wrap=el('chain');
	CHAIN.forEach(function(d,i){
		if(i) wrap.appendChild(el('chain-arrow',ARROW_R));
		const c=el('chain-card',
			img(APP_ICON[d[1]])+
			'<span class="cc-task">'+t('tTaskLong'+d[2])+'</span>'+
			'<span class="cc-f">'+t(d[3])+'</span>'+
			'<span class="cc-s">'+t(d[4])+'</span>');
		c.style.setProperty('--tc', TASK_COLORS[d[2]]);
		c.setAttribute('data-link', d[0]);
		c.classList.add(on.indexOf(d[0])>-1 ? 'is-on' : 'is-dim');
		wrap.appendChild(c);
	});
	return wrap;
}
function animateChain(tl, chain, at){
	const cards=[...chain.querySelectorAll('.chain-card')], arrows=[...chain.querySelectorAll('.chain-arrow')];
	cards.forEach(function(c,i){
		tl.fromTo(c,{opacity:0,y:14,scale:0.96},{opacity:c.classList.contains('is-dim')?0.42:1,y:0,scale:1,duration:0.34,ease:'back.out(1.4)'}, i?'-=0.04':at);
		if(arrows[i]) tl.fromTo(arrows[i],{opacity:0,x:-6},{opacity:1,x:0,duration:0.22,ease:'power2.out'},'-=0.14');
	});
}
function setChainStatic(chain){
	// gsap.set() warns on an empty NodeList, and the blueprint step has no lit cards yet
	const set=(sel,vars)=>{ const n=chain.querySelectorAll(sel); if(n.length) gsap.set(n,vars); };
	set('.chain-arrow',{opacity:1});
	set('.chain-card.is-on',{opacity:1});
	set('.chain-card.is-dim',{opacity:0.42});
}

function renderOutline(step,idx){
	const rows=(step.stats||[]).map(function(p){ return '<div class="stat-row"><span>'+t(p[0])+'</span><span>'+t(p[1])+'</span></div>'; }).join('');
	outlineBody.innerHTML='<div class="outline-section"><strong>Step '+(idx+1)+' of '+STEPS.length+': '+t(step.titleKey)+'</strong>'+
		'<p>'+t(step.descKey)+'</p></div>'+(rows?'<div class="outline-section">'+rows+'</div>':'');
}

// ── RENDER DISPATCH ───────────────────────
function renderStep(i){
	if(i<0||i>=STEPS.length) return;
	if(animating){ liveTimelines.forEach(tl=>tl.kill()); liveTimelines=[]; animating=false; }
	animating=true;
	const step=STEPS[i];
	// Drop any half-faded scene from a previous transition before starting another, so a
	// rapid step change (or the start gate re-rendering) can never leave a ghost behind.
	stage.querySelectorAll('.scene.scene-out').forEach(s=>s.remove());
	const outgoing=stage.querySelector('.scene:not(.scene-out)');
	if(outgoing) liveEls=liveEls.filter(x=>x!==outgoing);
	clearStage();
	if(outgoing){
		outgoing.style.zIndex='5';
		if(motionPaused) outgoing.remove();
		else { outgoing.classList.remove('scene-in'); outgoing.classList.add('scene-out'); setTimeout(()=>outgoing.remove(),240); }
	}
	RENDERERS[step.id]();
	const incoming=stage.querySelector('.scene:not(.scene-out)');
	if(incoming && !motionPaused) incoming.classList.add('scene-in');
	fitScene(incoming);
	current=i;
	try{ const u=new URL(location.href); u.searchParams.set('step',String(i+1)); history.replaceState(null,'',u); }catch(_){}
	counter.textContent=(current+1)+' / '+STEPS.length;
	breadcrumb.textContent=t(step.captionKey);
	progress.style.width=((current+1)/STEPS.length*100)+'%';
	renderOutline(step,i);
	announcer.textContent='Step '+(i+1)+' of '+STEPS.length+': '+t(step.titleKey)+'. '+t(step.descKey);
	if(typeof playStepAudio==='function') playStepAudio(i);
}
function baseTl(scene){
	const tl=gsap.timeline({onComplete:()=>animating=false}); liveTimelines.push(tl);
	tl.fromTo(headerEls(scene),{opacity:0,y:-14},{opacity:1,y:0,duration:0.55,stagger:0.12,ease:'power2.out'});
	return tl;
}
function mount(scene){ stage.appendChild(scene); liveEls.push(scene); }

// ── 1 · PROBLEM ───────────────────────────
function renderProblem(){
	const step=stepById('problem'), scene=buildScene(step);
	const row=el('gap-row');
	const have=el('have-card',
		img(APP_ICON.onedrive)+
		'<span class="hv-f">'+t('problemFile')+'</span>'+
		'<span class="hv-s">'+t('problemFileSub')+'</span>');
	const arrow=el('gap-arrow',ARROW_R);
	const miss=el('missing');
	['problemM1','problemM2','problemM3','problemM4'].forEach(function(k){
		miss.appendChild(el('miss', icon('cross')+'<span>'+t(k)+'</span>'));
	});
	row.appendChild(have); row.appendChild(arrow); row.appendChild(miss);
	scene.appendChild(row);
	mount(scene);
	const c=maybeCallout(step);
	const misses=miss.querySelectorAll('.miss');
	if(motionPaused){ gsap.set([].concat(headerEls(scene),[have,arrow]),{opacity:1}); gsap.set(misses,{opacity:1}); if(c) gsap.set(c,{opacity:1}); animating=false; return; }
	const tl=baseTl(scene);
	tl.fromTo(have,{opacity:0,x:-24,scale:0.96},{opacity:1,x:0,scale:1,duration:0.45,ease:'back.out(1.4)'},'-=0.1');
	tl.fromTo(arrow,{opacity:0},{opacity:1,duration:0.25},'-=0.1');
	tl.fromTo(misses,{opacity:0,x:20},{opacity:1,x:0,duration:0.34,stagger:0.11,ease:'power2.out'},'-=0.05');
	if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.5},'-=0.2');
}

// ── 2 · LAB AT A GLANCE ───────────────────
function renderGlance(){
	const step=stepById('glance'), scene=buildScene(step);
	const grid=el('ov-grid');
	[[1,'onedrive'],[2,'chat'],[3,'ppt'],[4,'word'],[5,'teams'],[6,'excel']].forEach(function(d){
		const n=d[0];
		const card=el('ov-card',
			'<span class="ov-top">'+img(APP_ICON[d[1]])+'<span class="ov-n">'+t('tTaskLong'+n)+'</span>'+
			'<span class="ov-kind is-core">'+t(TASK_COUNT[n])+'</span></span>'+
			'<span class="ov-h">'+t('ovH'+n)+'</span>'+
			'<span class="ov-p">'+t('ovP'+n)+'</span>'+
			'<span class="ov-meta"><span class="ov-app">'+t('t'+n+'App')+'</span></span>');
		card.style.setProperty('--tc', TASK_COLORS[n]);
		grid.appendChild(card);
	});
	scene.appendChild(grid);
	mount(scene);
	const c=maybeCallout(step);
	const cards=grid.querySelectorAll('.ov-card');
	if(motionPaused){ gsap.set(headerEls(scene),{opacity:1}); gsap.set(cards,{opacity:1}); if(c) gsap.set(c,{opacity:1}); animating=false; return; }
	const tl=baseTl(scene);
	tl.fromTo(cards,{opacity:0,y:16,scale:0.95},{opacity:1,y:0,scale:1,duration:0.4,stagger:0.09,ease:'back.out(1.5)'},'-=0.1');
	if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.5},'-=0.2');
}

// ── 3 · THE DELIVERABLES ──────────────────
function renderDeliver(){
	const step=stepById('deliver'), scene=buildScene(step);
	const chain=buildChain([]);
	scene.appendChild(chain);
	mount(scene);
	const c=maybeCallout(step);
	if(motionPaused){ gsap.set(headerEls(scene),{opacity:1}); setChainStatic(chain); if(c) gsap.set(c,{opacity:1}); animating=false; return; }
	const tl=baseTl(scene);
	animateChain(tl, chain, '-=0.05');
	if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.5},'-=0.2');
}

// Every lab in MS-4018 runs in the browser — the setup step literally says "Open a Microsoft Edge

const LOCK='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V11a1 1 0 0 0-1-1h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 1 1 6 0v3H9V7z"/></svg>';

// A light sketch of each app's content — enough to recognise the app, not enough to read.

		'<div class="mk-rail"><i></i><i></i><i></i><i class="is-new"></i></div>'+

// The window shows WHERE you are (Edge tab, URL, app, ribbon). The prompts themselves are rendered
// separately by promptCards(), because a stacked chat thread is far too tall for a 16:9 stage.
function appWindow(cfg){
	const chrome=APP_CHROME[cfg.win] || APP_CHROME.word;
	const w=el('mk-win');
	w.setAttribute('data-app', cfg.win);
	w.innerHTML=
		edgeChrome(cfg, chrome)+
		'<div class="mk-bar">'+img(APP_ICON[chrome.icon])+'<span class="mk-file">'+cfg.file+'</span>'+
			// only a real document autosaves to OneDrive — a chat or a Teams channel does not
			(/\.(docx|xlsx|pptx)$/.test(cfg.file) ? '<span class="mk-save">Saved to OneDrive</span>' : '')+'</div>'+
		'<div class="mk-ribbon">'+chrome.tabs.map((x,i)=>'<span class="mk-tab'+(i?'':' is-on')+'">'+x+'</span>').join('')+
			'<span class="mk-cpbtn">'+img(COPILOT_ICON)+'<span>Copilot</span></span></div>'+
		'<div class="mk-body">'+
			'<div class="mk-canvas">'+mkCanvas(cfg.win, cfg.canvas)+'</div>'+
		'</div>';
	return w;
}

// One card per prompt, laid out in a row: where you type it, the verbatim prompt, what you get back.
function promptCards(cfg, n){
	const row=el('pc-row');
	if(cfg.prompts.length===2) row.classList.add('is-2');
	row.style.setProperty('--pcc', TASK_COLORS[n]);
	row.innerHTML=cfg.prompts.map(function(p,i){
		// The lab's prompts carry [bracketed] placeholders you are meant to swap out — mark them.
		const raw=t(p[2]).replace(/\[[^\]]+\]/g, function(m){ return '<span class="mk-ref">'+m+'</span>'; });
		return '<div class="pc-card">'+
			'<div class="pc-top"><span class="pc-n">'+(i+1)+'</span><span class="pc-where">'+t(p[1])+'</span></div>'+
			'<div class="pc-p">'+raw+'</div>'+
			'<div class="pc-o">'+icon('check')+'<span>'+t(p[3])+'</span></div>'+
		'</div>';
	}).join('');
	return row;
}

let taskTl=null;

function buildTaskPanel(n){
	const cfg=TASK_PANELS[n], panel=el('task-panel');
	const app=el('task-app', img(APP_ICON[cfg.appIcon])+'<span>'+t(cfg.appKey)+'</span>');
	app.style.setProperty('--tc', TASK_COLORS[n]);
	panel.appendChild(app);
	panel.appendChild(n===1 ? setupPanel() : appWindow(cfg));
	panel.appendChild(n===1 ? setupCards() : promptCards(cfg, n));
	panel.appendChild(achievement(n));
	panel.appendChild(el('task-note', t(cfg.noteKey)));
	return panel;
}

// The six panels differ in height (Task 1 has three prompts), and fitScene scales the whole
// scene to fit — so without a reserve the UI visibly resizes on every task switch. Measure all
// six once and pin the body to the tallest, giving every task ONE scale.
function reserveTaskBody(scene){
	const body=scene&&scene.querySelector('.task-body'); if(!body) return;
	const keep=body.firstChild;
	body.style.minHeight='';
	let max=0;
	for(let n=1;n<=6;n++){
		body.innerHTML='';
		const p=buildTaskPanel(n); body.appendChild(p);
		if(p.offsetHeight>max) max=p.offsetHeight;
	}
	body.innerHTML='';
	if(keep) body.appendChild(keep);
	body.style.minHeight=(max+1)+'px';   // +1: offsetHeight rounds, so the tallest panel must not exceed its own reserve
}

function selectTask(n, initial){
	const scene=stage.querySelector('.scene:not(.scene-out)');
	if(!scene) return;
	const cfg=TASK_PANELS[n];
	scene.querySelector('.scene-title').textContent=t(cfg.titleKey);
	scene.querySelector('.scene-lead').textContent=t(cfg.descKey);
	scene.querySelectorAll('.task-btn').forEach(function(b){
		const on=+b.getAttribute('data-task')===n;
		b.classList.toggle('is-on', on);
		if(b.tagName==='BUTTON') b.setAttribute('aria-pressed', on?'true':'false');
	});
	const body=scene.querySelector('.task-body');
	if(taskTl){ taskTl.kill(); taskTl=null; }
	body.innerHTML='';
	const panel=buildTaskPanel(n);
	body.appendChild(panel);
	fitScene(scene);
	const parts=[...panel.querySelectorAll('.task-app,.mk-win,.pc-card,.achieve,.task-note')];
	if(motionPaused) gsap.set(parts,{opacity:1,x:0,y:0,scale:1});
	else {
		taskTl=gsap.timeline(); liveTimelines.push(taskTl);
		taskTl.fromTo(parts,{opacity:0,y:12},{opacity:1,y:0,duration:0.36,stagger:0.09,ease:'power2.out'});
	}
	if(!initial){ try{ const u=new URL(location.href); u.searchParams.set('task',String(n)); history.replaceState(null,'',u); }catch(_){} }
	announcer.textContent=t('tTaskLong'+n)+'. '+t(cfg.titleKey)+'. '+t(cfg.descKey);
}

function renderTasks(){
	const step=stepById('tasks'), scene=buildScene(step);
	scene.classList.add('is-top');
	const presenting=new URLSearchParams(location.search).has('present');
	const picker=el('task-picker');
	const row=el('task-picker-row');
	for(let n=1;n<=6;n++){
		// The audience window cannot be clicked, so there it is a progress strip, not a control.
		const b=document.createElement(presenting?'span':'button');
		b.className='task-btn';
		b.setAttribute('data-task', n);
		if(n===1) b.classList.add('is-opt');   // Setup is dashed — do it once, before the labs
		b.style.setProperty('--tc', TASK_COLORS[n]);
		b.innerHTML='<i></i><span>'+t('tTaskLong'+n)+'</span>';
		if(!presenting){
			b.type='button'; b.setAttribute('aria-pressed','false');
			b.addEventListener('click', ()=>selectTask(n));
			// Space/Enter are bound to "next step" on document, so keep them on the button
			b.addEventListener('keydown', e=>{ if(e.code==='Space'||e.code==='Enter') e.stopPropagation(); });
		}
		row.appendChild(b);
	}
	picker.appendChild(row);
	if(!presenting) picker.appendChild(el('task-picker-hint', t('tasksHint')));
	// first child, so nothing above it can shift it as panels change height
	scene.insertBefore(picker, scene.firstChild);
	scene.appendChild(el('task-body'));
	mount(scene);
	const c=maybeCallout(step);
	if(motionPaused){ gsap.set([].concat(headerEls(scene),[picker]),{opacity:1}); if(c) gsap.set(c,{opacity:1}); animating=false; }
	else {
		const tl=baseTl(scene);
		tl.fromTo(picker,{opacity:0,y:-8},{opacity:1,y:0,duration:0.35},'-=0.15');
		if(c) tl.fromTo(c,{opacity:0,y:10},{opacity:1,y:0,duration:0.5},'-=0.1');
	}
	const q=new URLSearchParams(location.search);
	const wanted=parseInt(q.get('task'),10);
	reserveTaskBody(scene);
	selectTask(wanted>=1&&wanted<=6 ? wanted : 1, true);
	// the audience window can't be clicked, so walk the tasks automatically
	// (timeline seconds x4 = real seconds, because the global timeScale is 0.25)
	if(q.has('present')){

		for(let n=2;n<=6;n++) walk.call(()=>selectTask(n, true), null, '+=0.9');

}

// Generate the clips with:
//   py scripts/generate_narration_audio.py --project draftanalyzepresentlab --langs en
// Captions can run WITHOUT sound — with CC on and audio off the clip still loads muted purely as
// the timing source, so the caption reveals at the narrator's pace. That also means captions need
// the mp3 to exist: AWCaptions.bind() returns early without an audio element.
const AUDIO_BASE='audio/DraftAnalyzePresent/';
const AUDIO_FILES=['step-01.mp3','step-02.mp3','step-03.mp3','step-04.mp3','step-05.mp3'];
function audioDir(){ return currentLang==='en' ? '' : currentLang+'/'; }
let audioEnabled=false, ccPref=false, currentAudio=null, audioTimeout=null;
const audioBtn=document.getElementById('audio-toggle'), ccBtn=document.getElementById('cc-toggle');
if(audioBtn) audioBtn.innerHTML='<span class="aw-audio-ico" aria-hidden="true">\uD83D\uDD07</span><span class="aw-audio-time" aria-hidden="true">--:--</span>';
const audioIco=audioBtn&&audioBtn.querySelector('.aw-audio-ico'), audioTimeEl=audioBtn&&audioBtn.querySelector('.aw-audio-time');
function playbackOn(){ return audioEnabled || ccPref; }
function fmtDur(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateAudioTime(){ if(audioTimeEl&&currentAudio&&isFinite(currentAudio.duration)&&currentAudio.duration>0) audioTimeEl.textContent=fmtDur(currentAudio.duration-currentAudio.currentTime); }
function syncAudioBtn(){
	if(!audioBtn) return;
	if(audioIco) audioIco.textContent=audioEnabled?'\uD83D\uDD0A':'\uD83D\uDD07';
	if(audioTimeEl&&!playbackOn()) audioTimeEl.textContent='--:--';
	audioBtn.classList.toggle('toggle-active',audioEnabled);
	audioBtn.setAttribute('aria-pressed',audioEnabled?'true':'false');
	audioBtn.setAttribute('data-tip','Narration: '+(audioEnabled?'On':'Off'));
}
function speakFallback(i){
	if(!window.speechSynthesis) return;
	const step=STEPS[i]; const u=new SpeechSynthesisUtterance(t(step.titleKey)+'. '+t(step.descKey));
	u.lang=currentLang; try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(_){}
}
function stopAudio(){
	if(currentAudio){ currentAudio.pause(); currentAudio.currentTime=0; currentAudio=null; }
	if(audioTimeout){ clearTimeout(audioTimeout); audioTimeout=null; }
	if(audioTimeEl) audioTimeEl.textContent='--:--';
	try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
	if(window.AWCaptions) AWCaptions.clear();
}
function playStepAudio(i){
	stopAudio();
	if(document.body.classList.contains('aw-prestart')) return;   // the start gate holds audio too
	if(!playbackOn() || i<0 || i>=STEPS.length) return;
	audioTimeout=setTimeout(function(){
		audioTimeout=null;
		const file=AUDIO_FILES[i];
		if(!file){ if(audioEnabled) speakFallback(i); return; }
		currentAudio=new Audio(AUDIO_BASE+audioDir()+file);
		currentAudio.volume=audioEnabled?1:0;
		if(window.AWCaptions) AWCaptions.bind(currentAudio,i);
		currentAudio.addEventListener('loadedmetadata',updateAudioTime);
		currentAudio.addEventListener('timeupdate',updateAudioTime);
		currentAudio.addEventListener('ended',function(){ if(audioTimeEl) audioTimeEl.textContent='0:00'; });
		currentAudio.addEventListener('error',function(){ if(audioEnabled) speakFallback(i); });
		currentAudio.play().catch(function(){});
	},400);
}

	if(!ccBtn) return;

// ── Drag (outline · callout · caption) ────
// Panels snap to position:fixed on first grab, stay inside the viewport, and grow a
// reset pin once moved or resized. The caption also persists its size.
function dragify(elm, key){
	if(!elm || elm.__awDrag) return; elm.__awDrag=true;
	let dragging=false, sx=0, sy=0, bl=0, bt=0, moved=false;
	const resizable=getComputedStyle(elm).resize!=='none';
	const sizeKey=key?key+'-size':null;
	const home={ position:elm.style.position, left:elm.style.left, top:elm.style.top, right:elm.style.right,
		bottom:elm.style.bottom, margin:elm.style.margin, transform:elm.style.transform,
		width:elm.style.width, height:elm.style.height };
	const pin=document.createElement('button');
	pin.type='button'; pin.className='aw-drag-reset';
	pin.title='Reset to default position'; pin.setAttribute('aria-label','Reset to default position');
	pin.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';
	const oy=getComputedStyle(elm).overflowY, clips=(oy==='auto'||oy==='scroll'||oy==='hidden');
	pin.style.top=clips?'8px':'-10px'; pin.style.right=clips?'8px':'-10px';
	elm.appendChild(pin);
	function showPin(on){ pin.style.display=on?'flex':'none'; }
	pin.addEventListener('pointerdown',e=>e.stopPropagation());
	pin.addEventListener('click',e=>{
		e.preventDefault(); e.stopPropagation();
		Object.keys(home).forEach(k=>{ elm.style[k]=home[k]; });
		if(key){ try{ localStorage.removeItem(key); }catch(_){} }
		if(sizeKey){ try{ localStorage.removeItem(sizeKey); }catch(_){} }
		showPin(false);
	});
	function fix(left,top){
		const w=elm.offsetWidth, h=elm.offsetHeight;
		left=Math.max(6, Math.min(left, window.innerWidth-w-6));
		top =Math.max(6, Math.min(top,  window.innerHeight-h-6));
		elm.style.position='fixed'; elm.style.left=left+'px'; elm.style.top=top+'px';
		elm.style.right='auto'; elm.style.bottom='auto'; elm.style.margin='0'; elm.style.transform='none';
	}
	if(resizable && typeof ResizeObserver!=='undefined'){
		let rt;
		new ResizeObserver(()=>{
			if(elm.style.width || elm.style.height){
				showPin(true);
				if(sizeKey){ clearTimeout(rt); rt=setTimeout(()=>{ try{ localStorage.setItem(sizeKey, JSON.stringify({w:elm.style.width,h:elm.style.height})); }catch(_){} },150); }
			}
		}).observe(elm);
	}
	elm.addEventListener('pointerdown',e=>{
		if(e.button!==0 || (e.target.closest && e.target.closest('a,button,select,input,textarea'))) return;
		if(resizable){ const r=elm.getBoundingClientRect(); if(e.clientX>r.right-18 && e.clientY>r.bottom-18) return; }  // let the resize grip win
		dragging=true; moved=false;
		const r=elm.getBoundingClientRect(); bl=r.left; bt=r.top; sx=e.clientX; sy=e.clientY;
		fix(bl,bt);
		try{ elm.setPointerCapture(e.pointerId); }catch(_){}
		e.preventDefault();
	});
	elm.addEventListener('pointermove',e=>{
		if(!dragging) return;
		const dx=e.clientX-sx, dy=e.clientY-sy;
		if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
		fix(bl+dx, bt+dy);
	});
	function end(e){ if(!dragging) return; dragging=false;
		try{ elm.releasePointerCapture(e.pointerId); }catch(_){}
		if(moved){ showPin(true); if(key){ try{ const r=elm.getBoundingClientRect(); localStorage.setItem(key, JSON.stringify({left:r.left,top:r.top})); }catch(_){} } } }
	elm.addEventListener('pointerup',end); elm.addEventListener('pointercancel',end);
	if(sizeKey){ try{ const z=JSON.parse(localStorage.getItem(sizeKey)||'null'); if(z&&(z.w||z.h)){ if(z.w) elm.style.width=z.w; if(z.h) elm.style.height=z.h; showPin(true); } }catch(_){} }
	if(key){ try{ const s=JSON.parse(localStorage.getItem(key)||'null'); if(s&&isFinite(s.left)&&isFinite(s.top)){ fix(s.left,s.top); showPin(true); } }catch(_){} }
}

// ── Movable / pinnable control dock ───────
(function(){
	const dock=document.getElementById('controls'), grip=document.getElementById('ctrl-grip'), pin=document.getElementById('ctrl-pin');
	if(!dock||!grip) return;
	const KEY='aw-cplab-controls-pos';
	let dragging=false, sx=0, sy=0, bl=0, bt=0, moved=false;
	function place(left,top){
		const w=dock.offsetWidth, h=dock.offsetHeight;
		left=Math.max(6, Math.min(left, window.innerWidth-w-6));
		top =Math.max(6, Math.min(top,  window.innerHeight-h-6));
		dock.style.left=left+'px'; dock.style.top=top+'px';
		dock.style.right='auto'; dock.style.bottom='auto'; dock.style.transform='none';
		document.body.classList.add('controls-floating');
	}
	function recenter(){
		dock.style.left=dock.style.top=dock.style.right=dock.style.bottom=dock.style.transform='';
		document.body.classList.remove('controls-floating');
		try{ localStorage.removeItem(KEY); }catch(_){}
	}
	grip.addEventListener('pointerdown',e=>{
		e.preventDefault(); dragging=true; moved=false;
		const r=dock.getBoundingClientRect(); bl=r.left; bt=r.top; sx=e.clientX; sy=e.clientY;
		try{ grip.setPointerCapture(e.pointerId); }catch(_){}
	});
	grip.addEventListener('pointermove',e=>{
		if(!dragging) return;
		const dx=e.clientX-sx, dy=e.clientY-sy;
		if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
		place(bl+dx, bt+dy);
	});
	function end(e){ if(!dragging) return; dragging=false;
		try{ grip.releasePointerCapture(e.pointerId); }catch(_){}
		if(moved){ try{ const r=dock.getBoundingClientRect(); localStorage.setItem(KEY, JSON.stringify({left:r.left,top:r.top})); }catch(_){} } }
	grip.addEventListener('pointerup',end); grip.addEventListener('pointercancel',end);
	grip.addEventListener('keydown',e=>{
		const d=e.shiftKey?40:12, r=dock.getBoundingClientRect(); let ok=true;
		if(e.key==='ArrowLeft') place(r.left-d, r.top);
		else if(e.key==='ArrowRight') place(r.left+d, r.top);
		else if(e.key==='ArrowUp') place(r.left, r.top-d);
		else if(e.key==='ArrowDown') place(r.left, r.top+d);
		else ok=false;
		if(ok){ e.preventDefault(); e.stopPropagation(); }
	});
	if(pin) pin.addEventListener('click',e=>{ e.stopPropagation(); recenter(); });
	window.addEventListener('resize',()=>{ if(document.body.classList.contains('controls-floating')){ const r=dock.getBoundingClientRect(); place(r.left,r.top); } });
	try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s.left==='number') place(s.left,s.top); }catch(_){}
})();
