<!DOCTYPE html>
<!-- Design concept A · "Road trip" — the AI Agent journey as a winding road with milestone rings. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>The AI Agent Journey — Road trip (design A)</title>
<link rel="icon" href="../../../img/favicon.png" />
<link rel="stylesheet" href="https://unpkg.com/@microsoft/atlas-css/dist/index.css" />
<script src="../../../lib/js/aw-theme.js"></script>
<style>
	:root { --p0:#8a5cd0; --p1:#0078d4; --p2:#00a2ad; --p3:#d24aa8; --road:#2f3038; --dash:#f2c14e; }
	body.theme-dark { --p0:#b896ee; --p1:#5cb0ff; --p2:#3fd4dc; --p3:#f07cc8; --road:#4a4b56; }
	html, body { margin:0; }
	body { min-height:100vh; font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; color:var(--theme-text); background:var(--theme-body-background); }
	a { color:inherit; }
	.top { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0.8rem 1.6rem; border-bottom:1px solid var(--theme-border); }
	.top .brand { display:flex; align-items:center; gap:0.55rem; text-decoration:none; font-weight:600; }
	.top .brand img { width:28px; height:28px; }
	.theme-toggle { width:2.3rem; height:2.3rem; border-radius:999px; border:1px solid var(--theme-border); background:transparent; color:var(--theme-text); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
	.theme-toggle .ico { display:none; } .theme-toggle[data-theme="dark"] .sun { display:block; } .theme-toggle[data-theme="light"] .moon { display:block; }

	.intro { max-width:1200px; margin:0 auto; padding:3rem 1.6rem 1rem; display:flex; align-items:flex-end; justify-content:space-between; gap:2rem; flex-wrap:wrap; }
	.intro h1 { margin:0; font-size:clamp(2.2rem,4.5vw,3.4rem); line-height:1.05; font-weight:700; }
	.intro h1 b { color:var(--p3); font-weight:700; }
	.intro p { margin:0.8rem 0 0; max-width:46ch; font-size:1.1rem; line-height:1.55; color:var(--theme-text-subtle); }
	.legend { display:flex; flex-wrap:wrap; gap:0.5rem; }
	.legend span { display:inline-flex; align-items:center; gap:0.45rem; padding:0.35rem 0.8rem; border-radius:999px; font-size:0.85rem; font-weight:600; border:2px solid var(--c); color:var(--c); background:color-mix(in srgb,var(--c) 10%,transparent); }

	.trip { position:relative; max-width:1200px; margin:1.5rem auto 0; padding:0 70px 4rem; display:grid; grid-template-columns:repeat(4,1fr); column-gap:1.6rem; row-gap:110px; }
	.road { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:0; }
	.road .rd { fill:none; stroke:var(--road); stroke-width:40; stroke-linecap:round; stroke-linejoin:round; }
	.road .mid { fill:none; stroke:var(--dash); stroke-width:3; stroke-dasharray:14 12; }
	.road .stem { stroke:var(--c); stroke-width:3; stroke-linecap:round; }
	.road .ring { fill:var(--theme-card-background,#fff); stroke:var(--c); stroke-width:7; }
	.road .num { fill:var(--c); font:700 17px 'Segoe UI',sans-serif; text-anchor:middle; dominant-baseline:central; }
	.road .flag { font-size:30px; text-anchor:middle; dominant-baseline:central; }

	.stop { position:relative; z-index:1; display:flex; flex-direction:column; text-decoration:none; border-radius:16px; overflow:hidden;
		background:var(--theme-card-background,#fff); border:2px solid var(--c); box-shadow:0 10px 26px rgba(0,0,0,0.12); transition:transform .2s ease, box-shadow .2s ease; }
	body.theme-dark .stop { background:color-mix(in srgb,var(--theme-text) 7%,var(--theme-body-background)); }
	.stop:hover { transform:translateY(-5px); box-shadow:0 18px 38px color-mix(in srgb,var(--c) 30%,transparent); }
	.pic { aspect-ratio:16/9; overflow:hidden; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb,var(--c) 14%,transparent); }
	.pic img.cover { width:100%; height:100%; object-fit:cover; }
	.pic img.icon { width:64px; height:64px; }
	.pic .glyph { font-size:3.4rem; }
	.body { padding:0.85rem 1rem 1rem; display:flex; flex-direction:column; gap:0.35rem; flex:1; }
	.kicker { font-size:0.78rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--c); display:flex; gap:0.5rem; align-items:center; }
	.opt { font-size:0.7rem; letter-spacing:0.08em; padding:0.1rem 0.5rem; border-radius:999px; border:1.5px solid var(--c); }
	.stop h3 { margin:0; font-size:1.05rem; font-weight:700; line-height:1.25; }
	.stop p { margin:0; font-size:0.9rem; line-height:1.45; color:var(--theme-text-subtle); }
	.stop.finish { border-style:dashed; }

	@media (max-width:900px) {
		.trip { grid-template-columns:repeat(2,1fr); padding:0 1.2rem 3rem; row-gap:1.4rem; }
		.trip .stop { grid-area:auto !important; }
		.road { display:none; }
	}
</style>
</head>
<body class="theme-dark" data-theme-preset="atlas">
	<header class="top">
		<a class="brand" href="index.html"><img src="../../../img/AzureAnimations-Logo.svg" alt="" /><span>AI Agents · Microsoft Foundry</span></a>
		<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">
			<svg class="ico moon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
			<svg class="ico sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>
		</button>
	</header>

	<section class="intro">
		<div>
			<h1>The <b>AI Agent</b> road trip</h1>
			<p>Ten stops, four stages. Follow the road from your first Foundry project to responsible, production-ready agents.</p>
		</div>
		<div class="legend" id="legend"></div>
	</section>

	<main class="trip" id="trip"><svg class="road" id="road" aria-hidden="true"></svg></main>

<script>
const AI='../../../lib/icons/Azure_Public_Service_Icons/ai + machine learning/';
const PHASES=[['Get started','--p0'],['Build agents','--p1'],['Apply AI services','--p2'],['Govern & choose','--p3']];
const STOPS=[
	{href:'FoundryHubProject.html',kicker:'Foundation',title:'Foundry Hub vs Project',desc:'How hubs and projects organize work and share resources.',img:'../../../images/animations-480thumbnails/ms-foundry-hub-project_thumbnail.gif',ph:0,opt:true},
	{href:'FoundryNew.html',kicker:'Orientation',title:'Foundry New Experience',desc:'Tour the redesigned Foundry and find where the tools live.',img:'../../../images/foundry-new-summary.png',ph:0},
	{href:'ModelDeployment.html',kicker:'Build',title:'Model Deployment vs Agent',desc:'Deploy a raw model or compose an agent — and when to use each.',img:'../../../images/animations-480thumbnails/Azure%20OpenAI%20-%20AI%20Foundry%20Studio_Provisioning_and_Deployment_Creation_-_thumbnail.gif',ph:1},
	{href:'WhatMakesAnAgent.html',kicker:'Ship',title:'What Makes an Agent',desc:'Model, instructions, tools and memory — the anatomy of an agent.',glyph:'🤖',ph:1},
	{href:'AgentTextAnalysis.html',kicker:'Apply',title:'Text Analysis with Azure Language',desc:'Detect language, key phrases, sentiment, PII and summaries.',icon:AI+'02876-icon-service-Language.svg',ph:2},
	{href:'AgentSpeech.html',kicker:'Apply',title:'Talking Apps with Azure AI Speech',desc:'Speech to text, text to speech, and Voice Live agents.',icon:AI+'00797-icon-service-Speech-Services.svg',ph:2},
	{href:'AgentVision.html',kicker:'Apply',title:'Seeing & Creating with AI Vision',desc:'Analyze images, then generate images and video in Foundry.',icon:AI+'00792-icon-service-Computer-Vision.svg',ph:2},
	{href:'AgentContentUnderstanding.html',kicker:'Apply',title:'Insights with Content Understanding',desc:'Turn invoices, audio and video into structured JSON.',icon:AI+'00819-icon-service-Form-Recognizers.svg',ph:2},
	{href:'ResponsibleAI.html',kicker:'Govern',title:'The Six Pillars of Responsible AI',desc:'What each pillar means, and what goes wrong without it.',glyph:'🛡️',ph:3},
	{href:'ChoosingYourSdk.html',kicker:'Build',title:'Choosing Your AI SDK',desc:'OpenAI SDK, Foundry SDK or Agent Framework — pick your layer.',glyph:'🧩',ph:3}
];
const FINISH=[
	{href:'index.html#journey',kicker:'Recap',title:'The big picture',desc:'Foundry → model → agent → MCP, end to end.',glyph:'🗺️',ph:3},
	{href:'index.html#certifications',kicker:'Finish line',title:'Get AI certified',desc:'AI-901 and the AI Apps & Agents Developer certification.',glyph:'🏆',ph:3}
];
// Snake placement on a 4-column grid: row 1 →, row 2 ←, row 3 →.
const SLOTS=[[1,1],[1,2],[1,3],[1,4],[2,4],[2,3],[2,2],[2,1],[3,1],[3,2],[3,3],[3,4]];
const trip=document.getElementById('trip'), road=document.getElementById('road');
document.getElementById('legend').innerHTML=PHASES.map(([n,v])=>`<span style="--c:var(${v})">${n}</span>`).join('');
function media(s){ return s.img?`<img class="cover" src="${s.img}" alt="" loading="lazy">`:s.icon?`<img class="icon" src="${s.icon}" alt="">`:`<span class="glyph">${s.glyph}</span>`; }
const all=[...STOPS,...FINISH];
all.forEach((s,i)=>{
	const a=document.createElement('a'); a.className='stop'+(i>=STOPS.length?' finish':''); a.href=s.href; if(i<STOPS.length){ a.target='_blank'; a.rel='noopener noreferrer'; }
	a.style.setProperty('--c',`var(${PHASES[s.ph][1]})`); a.style.gridArea=SLOTS[i][0]+'/'+SLOTS[i][1];
	a.innerHTML=`<div class="pic">${media(s)}</div><div class="body"><span class="kicker">${i<STOPS.length?'Stop '+String(i+1).padStart(2,'0')+' · ':''}${s.kicker}${s.opt?'<span class="opt">Optional</span>':''}</span><h3>${s.title}</h3><p>${s.desc}</p></div>`;
	trip.appendChild(a);
});
// Lanes run under each row; corners turn down the side margins (rounded switchbacks).
function draw(){
	if(getComputedStyle(road).display==='none') return;
	const W=trip.clientWidth, cards=[...trip.querySelectorAll('.stop')], rows=[0,1,2].map(r=>cards.filter((c,i)=>SLOTS[i][0]===r+1));
	const lane=rows.map(r=>Math.max(...r.map(c=>c.offsetTop+c.offsetHeight))+55), L=30, R=W-30, k=36;
	let d=`M${L+40} ${lane[0]} H${R-k} Q${R} ${lane[0]} ${R} ${lane[0]+k} V${lane[1]-k} Q${R} ${lane[1]} ${R-k} ${lane[1]} H${L+k} Q${L} ${lane[1]} ${L} ${lane[1]+k} V${lane[2]-k} Q${L} ${lane[2]} ${L+k} ${lane[2]} H${R-40}`;
	let h=`<path class="rd" d="${d}"/><path class="mid" d="${d}"/><text class="flag" x="${R-10}" y="${lane[2]-42}">🏁</text><text class="flag" x="${L+30}" y="${lane[0]-42}">🚦</text>`;
	cards.forEach((c,i)=>{ const cx=c.offsetLeft+c.offsetWidth/2, y=lane[SLOTS[i][0]-1], col=getComputedStyle(c).getPropertyValue('--c'), done=i>=STOPS.length;
		h+=`<g style="--c:${col}"><line class="stem" x1="${cx}" y1="${c.offsetTop+c.offsetHeight}" x2="${cx}" y2="${y-24}"/><circle class="ring" cx="${cx}" cy="${y}" r="24"/><text class="num" x="${cx}" y="${y}">${done?(i===STOPS.length?'↺':'★'):i+1}</text></g>`; });
	road.setAttribute('viewBox',`0 0 ${W} ${trip.clientHeight}`); road.innerHTML=h;
}
draw(); addEventListener('load',draw); if(window.ResizeObserver) new ResizeObserver(draw).observe(trip);
</script>
</body>
</html>
