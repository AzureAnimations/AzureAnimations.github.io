<!DOCTYPE html>
<!--
	The Six Pillars of Responsible AI
	=================================
	Part of the AI Agents · Microsoft Foundry journey.
	Narration script: ../../../narration/AI/Foundry/ResponsibleAI.md (+ es/ ja/ ko/ pt/)
	Audio clips:      audio/ResponsibleAI/step-NN.mp3 (+ <lang>/step-NN.mp3)
	Regenerate audio: python scripts/generate_narration_audio.py --project foundry --pages ResponsibleAI --langs en,es,ja,ko,pt

	Content is grounded in Microsoft's Responsible AI Standard (six principles):
	  https://learn.microsoft.com/azure/machine-learning/concept-responsible-ai
	  https://learn.microsoft.com/agents/center-of-excellence/responsible-ai

	Steps 2-6 all share renderPillarStep() so every pillar reads identically —
	same layout, same type sizes, only the accent colour and copy change.
	Paths assume journeys/AI/Foundry/ (three levels under the site root).
-->
<html lang="en">
<head>
	<script src="/js/tracking.js"></script>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<title>The Six Pillars of Responsible AI — Azure Animations</title>

	<link rel="stylesheet" href="https://unpkg.com/@microsoft/atlas-css/dist/index.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

	<!-- AnimationWorks shared lib -->
	<script src="../../../lib/js/aw-easings.js"></script>
	<script src="../../../lib/js/aw-motion.js"></script>
	<script src="../../../lib/js/aw-theme.js"></script>
	<script src="../../../lib/js/aw-keyboard.js"></script>
	<script src="../../../lib/js/aw-captions.js"></script>

<style>
	/* ── SHELL ─────────────────────────────── */
	/* Brand palette — reference these tokens; don't hardcode hex */
	:root {
		--aw-purple:#5c2d91;   /* primary accent — titles, callouts, arrows, progress, agents */
		--aw-blue:#0078d4;     /* secondary — inputs, links, "the model", primary button */
		--aw-green:#10a37f;    /* positive — success, grounded/correct results, value chips */
		--aw-orange:#e97526;   /* tools / actions — tool calls, function calling, side-effects */
		--aw-pink:#d24aa8;     /* highlight — a fourth category / emphasis */
		--aw-teal:#00847a;     /* sixth accent — accountability */
	}
	html, body { height:100%; margin:0; }
	html { font-size:100%; }
	body {
		display:flex; flex-direction:column; height:100vh;
		overflow:hidden;
		font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
		color: var(--theme-text);
		background:
			radial-gradient(circle at 15% 20%, rgba(92,45,145,0.18) 0%, transparent 55%),
			radial-gradient(circle at 85% 80%, rgba(0,120,212,0.18) 0%, transparent 55%),
			var(--theme-body-background);
	}
	.app-header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem; flex-shrink:0; font-size:16px; }
	.app-header > :last-child { justify-self:end; }

	/* #stage fills the space between the top bar and the control dock, and centers the fixed 16:9 frame. */
	#stage {
		position:relative; flex:1 1 auto; width:100%; min-height:0;
		display:flex; align-items:center; justify-content:center;
		overflow:hidden; container-type:size;
		padding:1.75rem 2.75rem 5rem;   /* breathing room around the frame; bottom clears the fixed #controls dock */
	}
	#stage:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible {
		outline:2px solid var(--theme-primary, #0078d4); outline-offset:3px; border-radius:4px;
	}
	/* The visible rectangle: the largest 16:9 box that fits the stage. All scenes are drawn inside it. */
	#stage-frame {
		position:relative; overflow:hidden;
		width: min(100cqw, calc(100cqh * 16 / 9));
		aspect-ratio: 16 / 9; max-width:100%; max-height:100%;
		border-radius:16px;
		background: rgba(0,0,0,0.015);
		box-shadow: 0 12px 44px rgba(0,0,0,0.22);
	}
	body.theme-dark #stage-frame { background: rgba(255,255,255,0.025); }
	#fx-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; overflow:visible; }

	/* ── SCENE ─────────────────────────────── */
	.scene {
		position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
		transform-origin:center center;
		width:min(1150px, 96%); z-index:10;
		display:flex; flex-direction:column; align-items:center; gap:1.4rem;
	}
	/* 200ms fade in / out between every step */
	@keyframes awSceneIn { from { opacity:0; } to { opacity:1; } }
	@keyframes awSceneOut { from { opacity:1; } to { opacity:0; } }
	.scene.scene-in { animation: awSceneIn 0.2s ease both; }
	.scene.scene-out { animation: awSceneOut 0.2s ease both; }
	.scene-title { font-size:2.5rem; font-weight:700; color:var(--theme-tertiary, #5c2d91); margin:0; text-align:center; opacity:0; }
	body.theme-dark .scene-title { color:#c9a5e8; }
	/* lead spans wide (near the scene width) to use the side gutters and stay within 2 lines — trim copy if it wraps to 3 */
	.scene-lead { margin:0; text-align:center; font-size:1.35rem; color:var(--theme-text); max-width:min(1180px,96%); line-height:1.5; opacity:0; }

	/* ── CALLOUT · draggable, slightly see-through so it never fully blocks the diagram ── */
	.callout {
		position:absolute; max-width:340px; padding:1rem 1.2rem;
		background:var(--theme-body-background);
		background:color-mix(in srgb, var(--theme-body-background) 84%, transparent);
		-webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
		border:1px solid var(--theme-border);
		border-left:4px solid var(--theme-tertiary, #5c2d91); border-radius:6px;
		box-shadow: var(--theme-box-shadow-medium, 0 4px 16px rgba(0,0,0,0.2));
		font-size:1.05rem; line-height:1.45; z-index:14; opacity:0;
		cursor:grab; touch-action:none;
	}
	.callout:active { cursor:grabbing; }

	/* ── RESET "PIN" · appears on a draggable panel once it has been moved off its home spot ── */
	.aw-drag-reset {
		position:absolute; width:24px; height:24px; padding:0; display:none;
		align-items:center; justify-content:center; border-radius:50%;
		background:var(--theme-tertiary,#5c2d91); color:#fff;
		border:2px solid var(--theme-body-background,#fff);
		box-shadow:0 2px 7px rgba(0,0,0,0.4); cursor:pointer; z-index:6;
		opacity:0.92; transition:opacity .14s ease, transform .14s ease;
	}
	.aw-drag-reset:hover { opacity:1; transform:scale(1.08); }
	.aw-drag-reset:focus-visible { outline:2px solid #5cc8ff; outline-offset:2px; }
	.aw-drag-reset svg { width:13px; height:13px; display:block; }

	/* ══════════════════════════════════════════════════════════ */
	/* ── REUSABLE BUILDING BLOCKS · keep what you use, drop rest ─ */
	/* ══════════════════════════════════════════════════════════ */

	/* Centered hero card */
	.card {
		width:min(680px, 96%); padding:1.6rem 1.8rem; border-radius:16px;
		background:var(--theme-card-background, #fff); border:2px solid var(--theme-border);
		box-shadow:0 8px 28px rgba(0,0,0,0.14); opacity:0;
		display:flex; flex-direction:column; gap:0.6rem; align-items:center; text-align:center;
	}
	body.theme-dark .card { background:rgba(255,255,255,0.05); }
	.card .card-icon { font-size:3rem; line-height:1; }
	.card .card-h { font-size:1.4rem; font-weight:700; }
	.card .card-p { font-size:1.05rem; color:var(--theme-text-subtle); line-height:1.5; }

	/* Wide info panel */
	.ta-card {
		width:min(1080px, 98%); border:1.5px solid var(--theme-border); border-radius:14px;
		background:var(--theme-card-background, #fff); box-shadow:0 8px 30px rgba(0,0,0,0.16);
		padding:1.1rem 1.3rem; opacity:0;
	}
	body.theme-dark .ta-card { background:rgba(255,255,255,0.05); }
	.ta-card-head {
		display:flex; align-items:center; gap:0.5rem;
		font-size:1rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em;
		color:var(--theme-text-subtle); margin-bottom:0.6rem;
	}
	.ta-card-text { font-size:1.22rem; line-height:1.55; color:var(--theme-text); }

	/* Pills / chips */
	.chip-row { display:flex; flex-wrap:wrap; gap:0.7rem; justify-content:center; }
	.pill {
		display:inline-flex; align-items:center; gap:0.5rem; padding:0.55rem 1.1rem;
		border-radius:999px; font-size:1.05rem; font-weight:600;
		border:2px solid var(--theme-tertiary, #5c2d91); background:rgba(92,45,145,0.08);
		color:var(--theme-text); opacity:0;
	}
	body.theme-dark .pill { background:rgba(92,45,145,0.2); }
	.value-chip {
		display:inline-flex; align-items:center; gap:0.4rem; padding:0.5rem 1rem;
		border-radius:999px; font-size:1rem; font-weight:700;
		border:2px solid #107c10; background:rgba(16,124,16,0.08);
		color:var(--theme-text); opacity:0;
	}
	body.theme-dark .value-chip { background:rgba(16,124,16,0.16); }
	.recap-foot { font-size:1.05rem; color:var(--theme-text); text-align:center; max-width:760px; opacity:0; }

	/* Flow row: input → process → output */
	.agent-node {
		display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.2rem;
		width:160px; height:160px; border-radius:24px;
		background: linear-gradient(135deg, rgba(92,45,145,0.12), rgba(0,120,212,0.12));
		border:2.5px solid var(--theme-tertiary, #5c2d91);
		box-shadow:0 8px 28px rgba(92,45,145,0.2); flex-shrink:0; text-align:center;
	}
	.agent-node .an-icon { font-size:3rem; line-height:1; }
	.agent-node .an-icon img { width:64px; height:64px; display:block; }
	.agent-node .an-label { font-size:1.05rem; font-weight:700; color:var(--theme-text); }
	.agent-node .an-sub { font-size:0.85rem; color:var(--theme-text-subtle); }
	.ta-flow { display:flex; align-items:center; justify-content:center; gap:1.2rem; flex-wrap:wrap; width:100%; }
	.ta-flow .agent-node { width:140px; height:140px; }
	.ta-flow .agent-node .an-icon { font-size:2.6rem; }
	.ta-flow .agent-node .an-icon img { width:54px; height:54px; }
	.ta-arrow { font-size:1.9rem; color:var(--theme-tertiary,#5c2d91); opacity:0; }
	.ta-arrow.is-big { font-size:3.2rem; }
	.ta-arrow.is-down, .ta-arrow.is-up { font-size:2.9rem; line-height:1; }
	@media (max-width:760px) { .ta-flow .ta-arrow { transform:rotate(90deg); } }

	/* Code card (VS Code style) */
	.code-card {
		width:min(560px,96%); border:1px solid #30363d; border-radius:8px;
		background:#1e1e1e; overflow:hidden; opacity:0;
		box-shadow: var(--theme-box-shadow-medium, 0 4px 16px rgba(0,0,0,0.25));
	}
	.code-head {
		display:flex; align-items:center; justify-content:space-between; gap:0.5rem;
		padding:0 0 0 0.85rem; background:#323233; border-bottom:1px solid #1e1e1e;
	}
	.code-file { font-size:0.9rem; color:#cccccc; font-weight:500; padding:0.6rem 0; }
	.code-winctrls { display:flex; align-items:stretch; height:100%; }
	.code-wbtn {
		display:flex; align-items:center; justify-content:center; width:2.6rem; padding:0.55rem 0;
		color:#cccccc; font-family:'Segoe UI Symbol','Segoe MDL2 Assets',sans-serif; font-size:0.7rem;
	}
	.code-wbtn.is-close:hover { background:#e81123; color:#fff; }
	.code-wbtn:hover { background:rgba(255,255,255,0.1); }
	.code-body {
		margin:0; padding:0.8rem 1rem;
		font-family:'Cascadia Code', 'Consolas', 'SFMono-Regular', monospace;
		font-size:0.86rem; line-height:1.5; color:#d4d4d4;
		white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word; tab-size:4;
	}
	.code-body .tok-com { color:#6a9955; }
	.code-body .tok-kw  { color:#569cd6; }
	.code-body .tok-str { color:#ce9178; }
	.code-body .tok-fn  { color:#dcdcaa; }
	.code-body .tok-mod { color:#4ec9b0; }
	.code-body .tok-prop{ color:#9cdcfe; }
	.code-body .tok-num { color:#b5cea8; }
	.code-body .tok-punct { color:#d4d4d4; }
	.code-body .code-hl { border-radius:4px; padding:0 0.15em; box-shadow:0 0 0 1px rgba(96,165,250,0.55); background:rgba(96,165,250,0.22); }
	.code-duo { display:flex; gap:1.1rem; flex-wrap:wrap; align-items:flex-start; justify-content:center; width:100%; }
	.code-duo .code-card { flex:1 1 380px; max-width:480px; }
	.code-duo .code-body { font-size:0.8rem; line-height:1.45; }
	.code-arrow { align-self:center; font-size:1.8rem; line-height:1; color:var(--theme-tertiary,#5c2d91); opacity:0; flex:none; }
	.code-arrow.is-big { font-size:2.9rem; }
	@media (max-width:760px) { .code-arrow { transform:rotate(90deg); } }

	/* Use-case grid */
	.uc-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:1.1rem; width:min(980px,96%); }
	@media (max-width:720px) { .uc-grid { grid-template-columns:1fr; } }
	.uc-card {
		display:flex; flex-direction:column; gap:0.5rem; padding:1rem 1.15rem;
		border:1.5px solid var(--theme-border); border-top:4px solid var(--theme-primary,#0078d4);
		border-radius:14px; background:var(--theme-card-background, #fff);
		box-shadow:0 6px 22px rgba(0,0,0,0.12); opacity:0;
		transition:transform 0.2s ease, box-shadow 0.2s ease;
	}
	.uc-card:hover { transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.18); }
	body.theme-dark .uc-card { background:rgba(255,255,255,0.05); }
	.uc-card[data-uc="a"] { border-top-color:#0078d4; }
	.uc-card[data-uc="b"] { border-top-color:#10a37f; }
	.uc-card[data-uc="c"] { border-top-color:#e97526; }
	.uc-card[data-uc="d"] { border-top-color:#d24aa8; }
	.uc-head { display:flex; align-items:center; gap:0.55rem; font-size:1.25rem; font-weight:700; color:var(--theme-text); }
	.uc-head .uc-icon { font-size:1.7rem; display:inline-block; }
	.uc-desc { font-size:0.98rem; line-height:1.55; color:var(--theme-text-subtle); }
	.uc-caps { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.2rem; }
	.uc-cap {
		display:inline-flex; align-items:center; gap:0.3rem; padding:0.25rem 0.7rem;
		border-radius:999px; font-size:0.88rem; font-weight:700;
		background:rgba(0,120,212,0.1); color:var(--theme-text);
		border:1.5px solid rgba(0,120,212,0.4); opacity:0;
	}

	/* ── CONTROLS · icon dock ──────────────── */
	#controls {
		position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:40;
		display:flex; align-items:center; gap:5px; padding:5px 7px;
		background:var(--theme-body-background-translucent, rgba(255,255,255,0.82));
		backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4);
		border:1px solid var(--theme-border); border-radius:999px;
		box-shadow: 0 8px 26px rgba(0,0,0,0.18); font-size:13px;
	}
	body.theme-dark #controls { background:var(--theme-body-background-translucent, rgba(32,32,36,0.82)); }
	#controls .ctrl-icon {
		width:2.15rem; height:2.15rem; min-width:0; padding:0;
		display:inline-flex; align-items:center; justify-content:center;
		border-radius:50%; font-size:0.95rem; line-height:1; font-weight:600;
		transition:background 0.18s ease, color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
	}
	#controls .ctrl-icon:hover { transform:translateY(-1px); }
	#controls .ctrl-icon:active { transform:scale(0.92); }
	#controls .ctrl-icon-next {
		width:2.55rem; height:2.55rem; font-size:1.1rem;
		box-shadow:0 2px 8px var(--theme-primary-translucent, rgba(0,120,212,0.45));
	}
	.step-counter {
		min-width:52px; text-align:center; font-variant-numeric:tabular-nums;
		font-size:14px; font-weight:700; color:var(--theme-text);
		padding:0 6px; white-space:nowrap; letter-spacing:0.02em;
	}
	.ctrl-sep { width:1px; align-self:stretch; margin:4px 2px; background:var(--theme-border); }
	/* Movable dock: drag handle + pin-to-center button */
	.ctrl-grip {
		display:inline-flex; align-items:center; justify-content:center;
		width:1.5rem; height:2.15rem; padding:0; border:none; background:transparent;
		color:var(--theme-text-subtle); border-radius:8px; cursor:grab; touch-action:none;
		transition:background 0.18s ease, color 0.18s ease;
	}
	.ctrl-grip:hover { color:var(--theme-text); background:var(--theme-primary-translucent, rgba(0,120,212,0.12)); }
	.ctrl-grip:active { cursor:grabbing; }
	.ctrl-grip svg { width:13px; height:16px; pointer-events:none; }
	body.controls-floating .ctrl-grip { color:var(--theme-primary,#0078d4); }
	#controls .ctrl-pin { display:none; color:var(--theme-primary,#0078d4); }
	#controls .ctrl-pin svg { width:15px; height:15px; pointer-events:none; }
	body.controls-floating #controls .ctrl-pin { display:inline-flex; }
	body.controls-floating #controls { box-shadow:0 10px 30px rgba(0,0,0,0.30), 0 0 0 1.5px var(--theme-primary,#0078d4); }
	.speed-control { display:inline-flex; align-items:center; gap:1px; padding:2px 3px; border:1px solid var(--theme-border); border-radius:999px; }
	.speed-control .speed-btn {
		width:1.7rem; height:1.7rem; min-width:0; padding:0;
		display:inline-flex; align-items:center; justify-content:center;
		font-size:0.95rem; font-weight:700; border-radius:50%;
	}
	.speed-control .speed-btn[disabled] { opacity:0.4; cursor:not-allowed; }
	.speed-label { min-width:2.4rem; text-align:center; font-variant-numeric:tabular-nums; font-size:0.82rem; font-weight:700; color:var(--theme-text); }

	#callout-toggle, #outline-toggle, #audio-toggle { border:1px solid var(--theme-border); border-radius:4px; transition:background .2s,color .2s,border-color .2s,opacity .2s; }
	#callout-toggle.toggle-active, #outline-toggle.toggle-active, #audio-toggle.toggle-active {
		background:var(--theme-primary-translucent, rgba(0,120,212,0.12)); color:var(--theme-primary,#0078d4); border-color:var(--theme-primary,#0078d4); font-weight:600;
	}
	#callout-toggle:not(.toggle-active), #outline-toggle:not(.toggle-active), #audio-toggle:not(.toggle-active) { opacity:0.6; }

	/* ── HIDE/SHOW TOP BAR ─────────────────── */
	#header-hide { display:inline-flex; align-items:center; justify-content:center; width:2rem; height:2rem; padding:0; border:1px solid var(--theme-border); border-radius:50%; color:var(--theme-text-subtle); transition:background .2s,color .2s,transform .18s; }
	#header-hide:hover { color:var(--theme-text); transform:translateY(-1px); }
	#header-hide svg { width:16px; height:16px; }
	#header-hide-top { display:inline-flex; align-items:center; justify-content:center; width:2rem; height:2rem; padding:0; border:1px solid var(--theme-border); border-radius:50%; color:var(--theme-text-subtle); background:transparent; cursor:pointer; transition:background .2s,color .2s,transform .18s; }
	#header-hide-top:hover { color:var(--theme-text); transform:translateY(-1px); }
	#header-hide-top svg { width:16px; height:16px; }
	body.chrome-hidden .app-header, body.chrome-hidden .progress-track { display:none; }
	#header-reveal {
		position:fixed; top:0; left:50%; transform:translateX(-50%) translateY(-100%); z-index:45;
		display:inline-flex; align-items:center; gap:0.35rem; padding:5px 14px 6px; font-size:12px; font-weight:600; line-height:1;
		color:var(--theme-text-subtle); background:var(--theme-body-background-translucent, rgba(255,255,255,0.88));
		backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--theme-border); border-top:none; border-radius:0 0 12px 12px;
		box-shadow:0 4px 14px rgba(0,0,0,0.14); cursor:pointer; transition:transform .28s cubic-bezier(0.2,0.7,0.3,1), color .2s, background .2s;
	}
	body.theme-dark #header-reveal { background:var(--theme-body-background-translucent, rgba(32,32,36,0.88)); }
	#header-reveal:hover { color:var(--theme-text); }
	body.chrome-hidden #header-reveal { transform:translateX(-50%) translateY(0); }
	#header-reveal svg { width:14px; height:14px; }

	/* ── PLAYER OVERLAY · pills inside the stage frame (YouTube-style) ──
	   Two translucent pills float over the 16:9 frame: LEFT = "view options"
	   (callout / outline / shortcuts), RIGHT = "player" (audio / captions / hide-bar / fullscreen). */
	.stage-overlay {
		position:absolute; right:12px; bottom:10px; z-index:25;
		display:flex; align-items:center; gap:2px;
		padding:3px 6px; border-radius:999px;
		background:rgba(16,18,24,0.58);
		backdrop-filter:blur(9px) saturate(1.3); -webkit-backdrop-filter:blur(9px) saturate(1.3);
		box-shadow:0 4px 16px rgba(0,0,0,0.32);
	}
	.ovl-btn {
		-webkit-appearance:none; appearance:none; margin:0; font:inherit;
		display:inline-flex; align-items:center; justify-content:center; gap:4px;
		min-width:30px; height:30px; padding:0 8px;
		border:none !important; border-radius:999px !important;
		background:transparent !important; color:#fff !important;
		box-shadow:none !important; cursor:pointer; line-height:1;
		font-size:0.82rem; font-weight:700; opacity:0.92; transition:background .15s ease, opacity .15s ease;
	}

// ── THEME ─────────────────────────────────
const themeToggleBtn = document.getElementById('theme-toggle');
function syncThemeBtn(){
	if (!themeToggleBtn) return;
	const isDark = document.body.classList.contains('theme-dark');
	themeToggleBtn.dataset.theme = isDark ? 'dark' : 'light';   // drives which glyph (sun/moon) shows
	const label = isDark ? 'Switch to light theme' : 'Switch to dark theme';
	themeToggleBtn.setAttribute('aria-label', label);
	themeToggleBtn.setAttribute('title', label);
}
if (window.AW && AW.theme) {
	// aw-theme.js owns click handling + persistence; theme recolors via CSS variables, so no re-render/replay.
	AW.theme.onChange(() => { syncThemeBtn(); });
	syncThemeBtn();
} else {
	// Standalone fallback: toggle .theme-dark / .theme-light on <body> ourselves.
	syncThemeBtn();
	if (themeToggleBtn) themeToggleBtn.addEventListener('click', () => {
		const goingDark = !document.body.classList.contains('theme-dark');
		document.body.classList.remove('theme-dark', 'theme-light');
		document.body.classList.add(goingDark ? 'theme-dark' : 'theme-light');
		try { localStorage.setItem('aw-theme', goingDark ? 'theme-dark' : 'theme-light'); } catch(_){}
		syncThemeBtn();
	});
	// restore a previously chosen theme (standalone only)
	try { const saved = localStorage.getItem('aw-theme'); if (saved === 'theme-light' || saved === 'theme-dark') { document.body.classList.remove('theme-dark','theme-light'); document.body.classList.add(saved); syncThemeBtn(); } } catch(_){}
}

// ── Audio narration (overlay button · speaker + remaining-time countdown) ──
// Drop one recorded clip per step (in STEPS order) into AUDIO_FILES for real narration;
// localized clips live under AUDIO_BASE/<lang>/. With no files, the browser reads each
// step's title + description aloud (speech synthesis), so the button works with zero assets.
const AUDIO_BASE = 'audio/ResponsibleAI/';
const AUDIO_FILES = [
	'step-01.mp3', 'step-02.mp3', 'step-03.mp3', 'step-04.mp3',
	'step-05.mp3', 'step-06.mp3', 'step-07.mp3', 'step-08.mp3'
];
let audioEnabled=false, currentAudio=null, audioTimeout=null, ccPref=false;
const audioBtn=document.getElementById('audio-toggle');
if(audioBtn){ audioBtn.innerHTML='<span class="aw-audio-ico" aria-hidden="true">\uD83D\uDD07</span><span class="aw-audio-time" aria-hidden="true">--:--</span>'; }
const audioIco=audioBtn&&audioBtn.querySelector('.aw-audio-ico'), audioTimeEl=audioBtn&&audioBtn.querySelector('.aw-audio-time');
// Captions can play WITHOUT sound: when CC is on but audio is off we still play the clip MUTED, so the
// caption reveals at the same pace — speaker shows 🔇 and the remaining-time countdown keeps running.
function playbackOn(){ return audioEnabled || ccPref; }
function audioDir(){ return (currentLang && currentLang!=='en') ? currentLang+'/' : ''; }
function fmtDur(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateAudioTime(){ if(audioTimeEl && currentAudio && isFinite(currentAudio.duration) && currentAudio.duration>0) audioTimeEl.textContent=fmtDur(currentAudio.duration-currentAudio.currentTime); }
function syncAudioBtn(){ if(!audioBtn) return; if(audioIco) audioIco.textContent=audioEnabled?'\uD83D\uDD0A':'\uD83D\uDD07'; if(audioTimeEl && !playbackOn()) audioTimeEl.textContent='--:--'; audioBtn.classList.toggle('toggle-active',audioEnabled); audioBtn.setAttribute('aria-pressed',audioEnabled?'true':'false'); }
function speakFallback(i){ if(!window.speechSynthesis) return; const step=STEPS[i]; const u=new SpeechSynthesisUtterance(`${t(step.titleKey)}. ${t(step.descKey)}`); u.lang=currentLang||'en'; try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(_){} }
function stopAudio(){
	if(currentAudio){ currentAudio.pause(); currentAudio.currentTime=0; currentAudio=null; }
	if(audioTimeout){ clearTimeout(audioTimeout); audioTimeout=null; }
	if(audioTimeEl) audioTimeEl.textContent='--:--';
	try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
	if(window.AWCaptions) AWCaptions.clear();
}
function playStepAudio(i){
	stopAudio();
	if(document.body.classList.contains('aw-prestart')) return;   // start gate holds audio too
	if(!playbackOn() || i<0 || i>=STEPS.length) return;
	audioTimeout=setTimeout(()=>{
		audioTimeout=null;
		const file=AUDIO_FILES[i];
		if(!file){ if(audioEnabled) speakFallback(i); return; }   // no clip = no timing source for caption-only
		currentAudio=new Audio(AUDIO_BASE+audioDir()+file);
		currentAudio.volume = audioEnabled ? 1 : 0;              // caption-only = silent (volume 0) timing source
		if(window.AWCaptions) AWCaptions.bind(currentAudio,i);
		currentAudio.addEventListener('loadedmetadata',updateAudioTime);
		currentAudio.addEventListener('timeupdate',updateAudioTime);
		currentAudio.addEventListener('ended',()=>{ if(audioTimeEl) audioTimeEl.textContent='0:00'; });
		currentAudio.addEventListener('error',()=>{ if(audioEnabled) speakFallback(i); });
		currentAudio.play().catch(()=>{});
	}, 400);
}

	if(current>=0){

		else playStepAudio(current);

}); }

// ── RENDER DISPATCH ───────────────────────
function renderStep(i){
	if(i<0||i>=STEPS.length) return;
	if(animating){ liveTimelines.forEach(tl=>tl.kill()); liveTimelines=[]; animating=false; }
	animating=true;
	const step=STEPS[i];
	// cross-fade (200ms, CSS keyframes so it's independent of the speed control) — outgoing fades out, incoming fades in, on every step
	const outgoing=stage.querySelector('.scene:not(.scene-out)');
	if(outgoing) liveEls=liveEls.filter(x=>x!==outgoing);
	clearStage();
	if(outgoing){ outgoing.style.zIndex='5';
		if(motionPaused){ outgoing.remove(); }
		else { outgoing.classList.remove('scene-in'); outgoing.classList.add('scene-out'); setTimeout(()=>outgoing.remove(), 240); } }
	if(step.id==='why') renderWhyStep();
	else if(step.id==='recap') renderRecapStep();
	else if(step.pillar) renderPillarStep(step);
	const incoming=stage.querySelector('.scene:not(.scene-out)');
	if(incoming && !motionPaused) incoming.classList.add('scene-in');
	fitScene(incoming);
	current=i;
	try{ const u=new URL(location.href); u.searchParams.set('step', String(i+1)); history.replaceState(null,'',u); }catch(_){}
	counter.textContent=`${t('stepOf')} ${current+1} / ${STEPS.length}`;
	breadcrumb.textContent=t(step.captionKey);
	progress.style.width=((current+1)/STEPS.length*100)+'%';
	renderOutline(step,i); announceStep(step,i);
	if(typeof playStepAudio==='function') playStepAudio(i);
}

// ── STEP 1 · WHY (a decision, a person, then the six pillars) ──
function renderWhyStep(){
	const step=stepById('why'); const scene=buildScene(step);
	const hero=el('rai-hero');
	const a=el('rai-card rai-hbox', `<span class="rai-hh">${t('whyAH')}</span><span class="rai-hp">${t('whyAP')}</span>`);
	const arrow=el('rai-harrow','\u279C');
	const b=el('rai-card rai-hbox', `<span class="rai-hh">${t('whyBH')}</span><span class="rai-hp">${t('whyBP')}</span>`);
	[a,arrow,b].forEach(n=>hero.appendChild(n));
	const found=el('rai-found');
	PILLARS.forEach(p=>{
		const cell=el('rai-fcell', `<span class="rai-fico">${icon(p.icon)}</span><span class="rai-fname">${t(p.key+'Name')}</span>`);
		cell.style.setProperty('--fc', p.colour); found.appendChild(cell);
	});
	scene.appendChild(hero); scene.appendChild(found); stage.appendChild(scene); liveEls.push(scene);
	const cEl=maybeCallout(step);
	const cells=found.querySelectorAll('.rai-fcell');
	if(motionPaused){ gsap.set([...headerEls(scene), a, arrow, b, ...cells], {opacity:1}); if(cEl) gsap.set(cEl,{opacity:1}); animating=false; return; }
	const tl=gsap.timeline({onComplete:()=>animating=false}); liveTimelines.push(tl);
	tl.fromTo(headerEls(scene), {opacity:0,y:-14}, {opacity:1,y:0,duration:0.55,stagger:0.12,ease:'power2.out'});
	tl.fromTo(a, {opacity:0,x:-24}, {opacity:1,x:0,duration:0.5,ease:'power2.out'}, '-=0.05');
	tl.fromTo(arrow, {opacity:0,scale:0.5}, {opacity:1,scale:1,duration:0.3,ease:'back.out(2)'}, '-=0.15');
	tl.fromTo(b, {opacity:0,x:24}, {opacity:1,x:0,duration:0.5,ease:'power2.out'}, '-=0.2');
	tl.fromTo(cells, {opacity:0,y:18,scale:0.9}, {opacity:1,y:0,scale:1,duration:0.4,stagger:0.09,ease:'back.out(1.5)'}, '+=0.1');
	if(cEl) tl.fromTo(cEl, {opacity:0,y:10}, {opacity:1,y:0,duration:0.6}, '-=0.3');
}

// ── STEPS 2-7 · ONE PILLAR (shared, so all six read identically) ──
function renderPillarStep(step){
	const p=step.pillar, k=p.key; const scene=buildScene(step);
	scene.dataset.pillar=k; scene.style.setProperty('--rai-c', p.colour);
	const head=el('rai-card rai-pillar',
		`<span class="rai-ico">${icon(p.icon)}</span>` +
		`<span class="rai-txt"><span class="rai-mean">${t(k+'Mean')}</span></span>` +
		`<span class="rai-num">${p.n} / 6</span>`);
	const duo=el('rai-duo');
	const risk=el('rai-card rai-box is-risk', `<span class="rai-lab">${icon('warn')}<span>${t('labRisk')}</span></span><span class="rai-say">${t(k+'Risk')}</span>`);
	const ex=el('rai-card rai-box is-ex', `<span class="rai-lab">${icon('quote')}<span>${t('labEx')}</span></span><span class="rai-say">${t(k+'Ex')}</span>`);
	duo.appendChild(risk); duo.appendChild(ex);
	const prac=el('rai-prac');
	['1','2','3'].forEach(i=>prac.appendChild(el('rai-chip', `${icon('check')}<span>${t(k+'P'+i)}</span>`)));
	scene.appendChild(head); scene.appendChild(duo); scene.appendChild(prac);
	stage.appendChild(scene); liveEls.push(scene);
	const cEl=maybeCallout(step);
	const chips=prac.querySelectorAll('.rai-chip');
	if(motionPaused){ gsap.set([...headerEls(scene), head, risk, ex, ...chips], {opacity:1}); if(cEl) gsap.set(cEl,{opacity:1}); animating=false; return; }
	const tl=gsap.timeline({onComplete:()=>animating=false}); liveTimelines.push(tl);
	tl.fromTo(headerEls(scene), {opacity:0,y:-14}, {opacity:1,y:0,duration:0.55,stagger:0.12,ease:'power2.out'});
	tl.fromTo(head, {opacity:0,y:18,scale:0.98}, {opacity:1,y:0,scale:1,duration:0.5,ease:'back.out(1.4)'}, '-=0.05');
	tl.fromTo(risk, {opacity:0,y:16}, {opacity:1,y:0,duration:0.45,ease:'power2.out'}, '-=0.1');
	tl.fromTo(ex, {opacity:0,y:16}, {opacity:1,y:0,duration:0.45,ease:'power2.out'}, '-=0.28');
	tl.fromTo(chips, {opacity:0,y:12,scale:0.85}, {opacity:1,y:0,scale:1,duration:0.35,stagger:0.1,ease:'back.out(1.8)'}, '-=0.1');
	if(cEl) tl.fromTo(cEl, {opacity:0,y:10}, {opacity:1,y:0,duration:0.6}, '-=0.3');
}

// ── STEP 8 · RECAP (all six at a glance) ──
function renderRecapStep(){
	const step=stepById('recap'); const scene=buildScene(step);
	const grid=el('rai-grid');
	PILLARS.forEach(p=>{
		const mini=el('rai-card rai-mini',
			`<span class="rai-mhead">${icon(p.icon)}<span class="rai-mname">${t(p.key+'Name')}</span></span>` +
			`<span class="rai-mtext">${t('recapM'+p.n)}</span>`);

	const foot=el('rai-foot', t('recapFoot'));
	scene.appendChild(grid); scene.appendChild(foot); stage.appendChild(scene); liveEls.push(scene);
	const cEl=maybeCallout(step);
	const minis=grid.querySelectorAll('.rai-mini');
	if(motionPaused){ gsap.set([...headerEls(scene), ...minis, foot], {opacity:1}); if(cEl) gsap.set(cEl,{opacity:1}); animating=false; return; }

	tl.fromTo(headerEls(scene), {opacity:0,y:-14}, {opacity:1,y:0,duration:0.55,stagger:0.12,ease:'power2.out'});

	if(cEl) tl.fromTo(cEl, {opacity:0,y:10}, {opacity:1,y:0,duration:0.6}, '-=0.3');
}

// ── CONTROLS ──────────────────────────────
function focusHeading(){ const h=document.getElementById('stage-heading'); if(h){ try{ h.focus({preventScroll:true}); }catch(_){ h.focus(); } } }
function interruptAnimation(){ liveTimelines.forEach(tl=>tl.kill()); liveTimelines=[]; animating=false; }
function next(){ interruptAnimation(); if(current<STEPS.length-1){ renderStep(current+1); focusHeading(); } }
function prev(){ interruptAnimation(); if(current>0){ renderStep(current-1); focusHeading(); } }
function reset(){ interruptAnimation(); renderStep(0); focusHeading(); }
function replay(){ if(current<0) return; interruptAnimation(); renderStep(current); focusHeading(); }

// ── Hide / show top bar (toggle; the ^ chevron flips to v when hidden) ──
(function(){
	const hideBtn=document.getElementById('header-hide'), revealBtn=document.getElementById('header-reveal');
	if(!hideBtn||!revealBtn) return;
	var hideBtnTop=document.getElementById('header-hide-top'); if(hideBtnTop) hideBtnTop.addEventListener('click',function(e){ e.stopPropagation(); hideBtn.click(); });
	const hidePath=hideBtn.querySelector('svg path');
	const UP='M6 15l6-6 6 6', DOWN='M6 9l6 6 6-6';   // ^ points up to hide the bar; flips to v to show it again
	function setHidden(h){
		document.body.classList.toggle('chrome-hidden',h);
		hideBtn.setAttribute('aria-expanded',String(!h));
		hideBtn.setAttribute('aria-label',h?'Show top bar':'Hide top bar');
		hideBtn.title=(h?'Show top bar':'Hide top bar')+' (H)';
		if(hidePath) hidePath.setAttribute('d',h?DOWN:UP);
		try{localStorage.setItem('aw-tmpl-chrome-hidden',h?'1':'0');}catch(_){}
		if(current>=0) requestAnimationFrame(()=>{ const s=stage.querySelector('.scene:not(.scene-out)'); if(s) fitScene(s); });
	}
	hideBtn.addEventListener('click',e=>{e.stopPropagation();setHidden(!document.body.classList.contains('chrome-hidden'));});
	revealBtn.addEventListener('click',e=>{e.stopPropagation();setHidden(false);});
	try{ if(localStorage.getItem('aw-tmpl-chrome-hidden')==='1') setHidden(true); }catch(_){}
	document.addEventListener('keydown',e=>{ if(e.code==='KeyH'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return; e.preventDefault(); setHidden(!document.body.classList.contains('chrome-hidden')); } });
})();

document.getElementById('next-btn').addEventListener('click',e=>{e.stopPropagation();next();});
document.getElementById('prev-btn').addEventListener('click',e=>{e.stopPropagation();prev();});
document.getElementById('reset-btn').addEventListener('click',e=>{e.stopPropagation();reset();});
document.getElementById('replay-btn').addEventListener('click',e=>{e.stopPropagation();replay();});

// ── Clickable progress bar + step ticks ──
(function(){
	const track=document.querySelector('.progress-track'); if(!track) return;
	for(let s=1; s<STEPS.length; s++){ const tk=document.createElement('div'); tk.className='progress-tick'; tk.style.left=(s/STEPS.length*100)+'%'; track.appendChild(tk); }
	track.setAttribute('title','Jump to a step');
	track.addEventListener('click', e=>{
		const r=track.getBoundingClientRect(); const frac=(e.clientX-r.left)/r.width;
		const target=Math.max(0, Math.min(STEPS.length-1, Math.floor(frac*STEPS.length)));
		if(target!==current){ interruptAnimation(); renderStep(target); focusHeading(); }
	});
})();

// ── Movable / pinnable control dock ───────
(function(){
	const dock=document.getElementById('controls'), grip=document.getElementById('ctrl-grip'), pin=document.getElementById('ctrl-pin');
	if(!dock||!grip) return;
	const KEY='aw-tmpl-controls-pos';
	let dragging=false, sx=0, sy=0, bl=0, bt=0, moved=false;
	function place(left,top){
		const w=dock.offsetWidth, h=dock.offsetHeight;
		left=Math.max(6, Math.min(left, window.innerWidth - w - 6));
		top =Math.max(6, Math.min(top,  window.innerHeight - h - 6));
		dock.style.left=left+'px'; dock.style.top=top+'px'; dock.style.right='auto'; dock.style.bottom='auto'; dock.style.transform='none';
		document.body.classList.add('controls-floating');
	}
	function recenter(){
		dock.style.left=dock.style.top=dock.style.right=dock.style.bottom=dock.style.transform='';
		document.body.classList.remove('controls-floating');
		try{ localStorage.removeItem(KEY); }catch(_){}
	}
	grip.addEventListener('pointerdown', e=>{
		e.preventDefault(); dragging=true; moved=false;
		const r=dock.getBoundingClientRect(); bl=r.left; bt=r.top; sx=e.clientX; sy=e.clientY;
		try{ grip.setPointerCapture(e.pointerId); }catch(_){}
	});
	grip.addEventListener('pointermove', e=>{
		if(!dragging) return;
		const dx=e.clientX-sx, dy=e.clientY-sy;
		if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
		place(bl+dx, bt+dy);
	});
	function end(e){ if(!dragging) return; dragging=false; try{ grip.releasePointerCapture(e.pointerId); }catch(_){}
		if(moved){ try{ const r=dock.getBoundingClientRect(); localStorage.setItem(KEY, JSON.stringify({left:r.left, top:r.top})); }catch(_){} } }
	grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
	// keyboard-nudge the dock when the grip is focused (arrow keys; Shift = larger step)
	grip.addEventListener('keydown', e=>{
		const d=e.shiftKey?40:12; const r=dock.getBoundingClientRect(); let ok=true;
		if(e.key==='ArrowLeft') place(r.left-d, r.top);
		else if(e.key==='ArrowRight') place(r.left+d, r.top);
		else if(e.key==='ArrowUp') place(r.left, r.top-d);
		else if(e.key==='ArrowDown') place(r.left, r.top+d);
		else ok=false;
		if(ok){ e.preventDefault(); e.stopPropagation(); }
	});
	if(pin) pin.addEventListener('click', e=>{ e.stopPropagation(); recenter(); });
	window.addEventListener('resize', ()=>{ if(document.body.classList.contains('controls-floating')){ const r=dock.getBoundingClientRect(); place(r.left, r.top); } });
	try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s && typeof s.left==='number') place(s.left, s.top); }catch(_){}
})();

// ── Make callout / outline / caption draggable (same pointer-drag as the control dock) ──
function dragify(el, key){
	if(!el || el.__awDrag) return; el.__awDrag=true;
	let dragging=false, sx=0, sy=0, bl=0, bt=0, moved=false;
	const resizable = getComputedStyle(el).resize !== 'none';
	const sizeKey = key ? key + '-size' : null;
	// snapshot the home position + size so the reset pin can restore it exactly
	const home={ position:el.style.position, left:el.style.left, top:el.style.top,
		right:el.style.right, bottom:el.style.bottom, margin:el.style.margin, transform:el.style.transform,
		width:el.style.width, height:el.style.height };
	// reset "pin" — hidden until the panel is dragged or resized off its home spot
	const pin=document.createElement('button');
	pin.type='button'; pin.className='aw-drag-reset';
	pin.title=t('resetPos'); pin.setAttribute('aria-label', t('resetPos'));
	pin.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';
	// keep the pin inside scrollable / resizable panels so it isn't clipped
	const oy=getComputedStyle(el).overflowY; const clips=(oy==='auto'||oy==='scroll'||oy==='hidden');
	pin.style.top=clips?'8px':'-10px'; pin.style.right=clips?'8px':'-10px';
	el.appendChild(pin);
	function showPin(on){ pin.style.display=on?'flex':'none'; }
	pin.addEventListener('pointerdown', e=>{ e.stopPropagation(); });
	pin.addEventListener('click', e=>{
		e.preventDefault(); e.stopPropagation();
		el.style.position=home.position; el.style.left=home.left; el.style.top=home.top;
		el.style.right=home.right; el.style.bottom=home.bottom; el.style.margin=home.margin; el.style.transform=home.transform;
		el.style.width=home.width; el.style.height=home.height;
		if(key){ try{ localStorage.removeItem(key); }catch(_){} }
		if(sizeKey){ try{ localStorage.removeItem(sizeKey); }catch(_){} }
		showPin(false);
	});
	function fix(left,top){
		const w=el.offsetWidth, h=el.offsetHeight;
		left=Math.max(6, Math.min(left, window.innerWidth  - w - 6));
		top =Math.max(6, Math.min(top,  window.innerHeight - h - 6));
		el.style.position='fixed'; el.style.left=left+'px'; el.style.top=top+'px';
		el.style.right='auto'; el.style.bottom='auto'; el.style.margin='0'; el.style.transform='none';
	}
	// persist user resizes (the CSS resize grip writes inline width/height; content changes don't)
	if(resizable && typeof ResizeObserver!=='undefined'){
		let rt;
		new ResizeObserver(()=>{
			if(el.style.width || el.style.height){
				showPin(true);
				if(sizeKey){ clearTimeout(rt); rt=setTimeout(()=>{ try{ localStorage.setItem(sizeKey, JSON.stringify({w:el.style.width, h:el.style.height})); }catch(_){} }, 150); }
			}
		}).observe(el);
	}
	el.addEventListener('pointerdown', e=>{
		if(e.button!==0 || (e.target.closest && e.target.closest('a,button,select,input,textarea'))) return;
		if(resizable){ const r=el.getBoundingClientRect(); if(e.clientX>r.right-18 && e.clientY>r.bottom-18) return; } // let the resize grip win
		dragging=true; moved=false;
		const r=el.getBoundingClientRect(); bl=r.left; bt=r.top; sx=e.clientX; sy=e.clientY;
		fix(bl, bt);   // pin at the current spot first, so there's no jump
		try{ el.setPointerCapture(e.pointerId); }catch(_){}
		e.preventDefault();
	});
	el.addEventListener('pointermove', e=>{
		if(!dragging) return;
		const dx=e.clientX-sx, dy=e.clientY-sy;
		if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
		fix(bl+dx, bt+dy);
	});
	function end(e){
		if(!dragging) return; dragging=false;
		try{ el.releasePointerCapture(e.pointerId); }catch(_){}
		if(moved){ showPin(true); if(key){ try{ const r=el.getBoundingClientRect(); localStorage.setItem(key, JSON.stringify({left:r.left, top:r.top})); }catch(_){} } }
	}
	el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
	if(sizeKey){ try{ const z=JSON.parse(localStorage.getItem(sizeKey)||'null'); if(z && (z.w||z.h)){ if(z.w) el.style.width=z.w; if(z.h) el.style.height=z.h; showPin(true); } }catch(_){} }
	if(key){ try{ const s=JSON.parse(localStorage.getItem(key)||'null'); if(s && isFinite(s.left) && isFinite(s.top)){ fix(s.left, s.top); showPin(true); } }catch(_){} }
}
dragify(document.getElementById('step-outline'), 'aw-tmpl-outline-pos');
dragify(document.getElementById('aw-caption'), 'aw-tmpl-caption-pos');

// ── Speed ─────────────────────────────────
const SPEED_STEPS=[0.5,0.75,1,1.25,1.5,2]; const BASE_TIMESCALE=0.25;
let speedIndex=SPEED_STEPS.indexOf(1);
try{ const sp=parseInt(localStorage.getItem('aw-tmpl-speed'),10); if(!isNaN(sp)&&sp>=0&&sp<SPEED_STEPS.length) speedIndex=sp; }catch(_){}
const speedLabel=document.getElementById('speed-label'), speedDownBtn=document.getElementById('speed-down'), speedUpBtn=document.getElementById('speed-up');
function saveSpeed(){ try{ localStorage.setItem('aw-tmpl-speed', String(speedIndex)); }catch(_){} }
function syncSpeedUI(){ const spd=SPEED_STEPS[speedIndex]; speedLabel.textContent=spd+'\u00d7'; speedDownBtn.disabled=speedIndex===0; speedUpBtn.disabled=speedIndex===SPEED_STEPS.length-1; gsap.globalTimeline.timeScale(spd*BASE_TIMESCALE); }
syncSpeedUI();
speedDownBtn.addEventListener('click',e=>{e.stopPropagation(); if(speedIndex>0){speedIndex--;syncSpeedUI();saveSpeed();}});
speedUpBtn.addEventListener('click',e=>{e.stopPropagation(); if(speedIndex<SPEED_STEPS.length-1){speedIndex++;syncSpeedUI();saveSpeed();}});

// ── Keyboard ──────────────────────────────
if (window.AW && AW.keyboard) { AW.keyboard.bind({ next, prev, reset, replay }); }
else { document.addEventListener('keydown', e => {
	if (['Space','ArrowRight','Enter'].includes(e.code)) { e.preventDefault(); next(); }
	else if (e.code==='ArrowLeft') { e.preventDefault(); prev(); }
	else if (e.code==='KeyR') { e.preventDefault(); reset(); }
	else if (e.code==='KeyP') { e.preventDefault(); replay(); }
}); }

// ── Touch swipe (tablets) ─────────────────
(function(){
	const surf=document.getElementById('stage'); if(!surf) return;
	let x0=null,y0=null,t0=0;
	surf.addEventListener('touchstart',e=>{ if(e.touches.length!==1){x0=null;return;} x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
	surf.addEventListener('touchend',e=>{
		if(x0===null) return; const tch=e.changedTouches[0]; const dx=tch.clientX-x0, dy=tch.clientY-y0; x0=null;
		if(Date.now()-t0>800) return;
		if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.6){ if(dx<0) next(); else prev(); }
	},{passive:true});
})();

// ── Keyboard shortcut help overlay ────────
(function(){
	const overlay=document.getElementById('shortcut-overlay'), btn=document.getElementById('help-toggle'), closeBtn=document.getElementById('sc-close'), list=document.getElementById('sc-list');
	if(!overlay||!list) return;
	const ROWS=[[['\u2192','Space'],'scNext'],[['\u2190'],'scPrev'],[['R'],'scRestart'],[['P'],'scReplay'],[['H'],'scHide'],[['?'],'scHelp']];
	window.buildShortcuts=function(){ const title=document.getElementById('sc-title'); if(title) title.textContent=t('scTitle');
		list.innerHTML=ROWS.map(([keys,k])=>`<li><span>${t(k)}</span><span class="sc-keys">${keys.map(x=>`<kbd>${x}</kbd>`).join('')}</span></li>`).join(''); };
	buildShortcuts();
	function open(){ overlay.removeAttribute('hidden'); if(closeBtn) closeBtn.focus(); }
	function close(){ overlay.setAttribute('hidden',''); if(btn) btn.focus(); }
	function toggle(){ overlay.hasAttribute('hidden')?open():close(); }
	if(btn) btn.addEventListener('click',e=>{e.stopPropagation();toggle();});
	if(closeBtn) closeBtn.addEventListener('click',e=>{e.stopPropagation();close();});
	const bd=overlay.querySelector('.sc-backdrop'); if(bd) bd.addEventListener('click',close);
	document.addEventListener('keydown',e=>{ const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
		if(e.key==='?'){ e.preventDefault(); toggle(); }
		else if(e.key==='Escape' && !overlay.hasAttribute('hidden')){ e.preventDefault(); close(); } });
})();

// ── Resize (re-fit only — never rebuild or replay the animation) ──
let resizeTimer, lastStageW=0, lastStageH=0;
window.addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{
	if(current<0) return;
	const box=stage.getBoundingClientRect();
	if(Math.abs(box.width-lastStageW)<1 && Math.abs(box.height-lastStageH)<1) return;   // ignore no-op reflows (focus/URL-bar) so the animation never restarts
	lastStageW=box.width; lastStageH=box.height;
	const s=stage.querySelector('.scene:not(.scene-out)'); if(s) fitScene(s);
},200); });

// ── Init ──────────────────────────────────
setLanguage(currentLang);
counter.textContent = `1 / ${STEPS.length}`;
const urlStep = parseInt(new URLSearchParams(location.search).get('step'), 10);   // ?step=N opens on step N
renderStep((!isNaN(urlStep) && urlStep>=1 && urlStep<=STEPS.length) ? urlStep-1 : 0);
</script>
<script>
// ── Start gate · hold autoplay until the viewer clicks Play (empty stage + centered Play) ──
(function () {
	if (new URLSearchParams(location.search).has('present')) return;
	var stage = document.getElementById('stage');
	if (!stage) return;
	function freeze() { try { if (window.gsap && gsap.globalTimeline) gsap.globalTimeline.pause(); } catch (_) {} }
	freeze(); requestAnimationFrame(freeze);
	document.body.classList.add('aw-prestart');
	try { if (typeof stopAudio === 'function') stopAudio(); } catch (_) {}
	stage.style.transition = 'opacity .55s ease';
	stage.style.opacity = '0';

	var T = {
		title: { en:'Ready to begin?', es:'\u00BFTodo listo?', ja:'\u6E96\u5099\u306F\u3044\u3044\u3067\u3059\u304B\uFF1F', ko:'\uC2DC\uC791\uD560 \uC900\uBE44\uAC00 \uB418\uC168\uB098\uC694?', pt:'Tudo pronto?' },
		sound: { en:'Sound', es:'Sonido', ja:'\u97F3\u58F0', ko:'\uC18C\uB9AC', pt:'Som' },
		cc:    { en:'Subtitles (CC)', es:'Subt\u00EDtulos (CC)', ja:'\u5B57\u5E55\uFF08CC\uFF09', ko:'\uC790\uB9C9 (CC)', pt:'Legendas (CC)' },
		start: { en:'Start presentation', es:'Iniciar presentaci\u00F3n', ja:'\u30D7\u30EC\u30BC\u30F3\u3092\u958B\u59CB', ko:'\uD504\uB808\uC820\uD14C\uC774\uC158 \uC2DC\uC791', pt:'Iniciar apresenta\u00E7\u00E3o' }
	};
	function L(){ return (typeof currentLang === 'string' && currentLang) || (typeof CURRENT_LANG === 'string' && CURRENT_LANG) || 'en'; }
	function t(k){ var m = T[k], l = L(); return m[m[l] ? l : 'en']; }
	function awAudioState(){ try{ if(typeof window.__awAudioOn==='function') return !!window.__awAudioOn(); }catch(_){} return (typeof audioEnabled!=='undefined') && !!audioEnabled; }
	function awCcState(){ try{ if(typeof window.__awCcOn!=='undefined' && window.__awCcOn!==null) return !!window.__awCcOn; }catch(_){} return (typeof ccPref!=='undefined') && !!ccPref; }

	var style = document.createElement('style');
	style.textContent =
		'body.aw-prestart #controls{opacity:.4;pointer-events:none;transition:opacity .4s ease}' +
		'#aw-play-card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;box-sizing:border-box;width:min(90vw,22rem);padding:1.35rem 1.5rem 1.5rem;border-radius:16px;background:var(--theme-card-background,#fff);color:var(--theme-text,#222);border:1px solid var(--theme-border,rgba(0,0,0,.1));box-shadow:0 24px 60px rgba(0,0,0,.28);transition:opacity .3s ease,transform .3s ease}' +
		'#aw-play-card.aw-hide{opacity:0;transform:translate(-50%,-50%) scale(.96);pointer-events:none}' +
		'body.theme-dark #aw-play-card{border-color:rgba(255,255,255,.12);box-shadow:0 24px 60px rgba(0,0,0,.55)}' +
		'body.present-mode #aw-play-card{display:none!important}' +
		'.aw-card-title{margin:0 0 1rem;text-align:center;font-size:1.02rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;opacity:.85}' +
		'.aw-row{display:flex;align-items:center;gap:.65rem;padding:.6rem 0}' +
		'.aw-row + .aw-row{border-top:1px solid var(--theme-border,rgba(0,0,0,.08))}' +
		'.aw-row-ico{flex:none;width:1.5rem;text-align:center;font-size:1.15rem;line-height:1}' +
		'.aw-row-lbl{flex:1 1 auto;font-size:.9rem;font-weight:600}' +
		'.aw-row-state{flex:none;min-width:2.5rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.05em;opacity:.5}' +
		'.aw-row-state.on{color:var(--theme-primary,#0078d4);opacity:1}' +
		'.aw-switch{position:relative;flex:none;width:44px;height:24px;padding:0;border:none;border-radius:999px;cursor:pointer;background:var(--theme-border,#c7c7d1);transition:background .18s ease}' +
		'.aw-switch.on{background:var(--theme-primary,#0078d4)}' +
		'.aw-switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .18s ease}' +
		'.aw-switch.on::after{transform:translateX(20px)}' +
		'#aw-start{margin-top:1.2rem;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1rem;border:none;border-radius:11px;cursor:pointer;background:var(--theme-primary,#0078d4);color:#fff;font-size:.96rem;font-weight:700;letter-spacing:.01em;box-shadow:0 8px 22px var(--theme-primary-translucent,rgba(0,120,212,.45));transition:transform .15s ease}' +
		'#aw-start:hover{transform:translateY(-2px)}#aw-start:active{transform:scale(.98)}' +
		'#aw-start svg{width:18px;height:18px;flex:none}';
	document.head.appendChild(style);

	var card = document.createElement('div');
	card.id = 'aw-play-card'; card.setAttribute('role', 'dialog'); card.setAttribute('aria-modal', 'true');
	card.innerHTML =
		'<div class="aw-card-title"></div>' +
		'<div class="aw-row" data-k="audio"><span class="aw-row-ico" aria-hidden="true">\uD83D\uDD0A</span><span class="aw-row-lbl"></span><span class="aw-row-state"></span><button type="button" class="aw-switch" role="switch"></button></div>' +
		'<div class="aw-row" data-k="cc"><span class="aw-row-ico" aria-hidden="true">\uD83D\uDCAC</span><span class="aw-row-lbl"></span><span class="aw-row-state"></span><button type="button" class="aw-switch" role="switch"></button></div>' +
		'<button type="button" id="aw-start"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg><span class="aw-start-lbl"></span></button>';
	document.body.appendChild(card);

	var titleEl = card.querySelector('.aw-card-title');
	var startBtn = card.querySelector('#aw-start');
	var ROWS = [ { k:'audio', lbl:'sound', el:card.querySelector('.aw-row[data-k="audio"]'), read:awAudioState, toggle:'audio-toggle' },
	             { k:'cc',    lbl:'cc',    el:card.querySelector('.aw-row[data-k="cc"]'),    read:awCcState,    toggle:'cc-toggle' } ];

	function render(){
		titleEl.textContent = t('title'); card.setAttribute('aria-label', t('title'));
		startBtn.querySelector('.aw-start-lbl').textContent = t('start');
		ROWS.forEach(function(r){
			var on = r.read();
			r.el.querySelector('.aw-row-lbl').textContent = t(r.lbl);
			var st = r.el.querySelector('.aw-row-state'); st.textContent = on ? 'ON' : 'OFF'; st.classList.toggle('on', on);
			var sw = r.el.querySelector('.aw-switch'); sw.classList.toggle('on', on); sw.setAttribute('aria-checked', on ? 'true' : 'false');
			sw.setAttribute('aria-label', t(r.lbl) + ' \u2014 ' + (on ? 'on' : 'off'));
		});
	}
	ROWS.forEach(function(r){
		r.el.querySelector('.aw-switch').addEventListener('click', function(e){ e.stopPropagation(); var b = document.getElementById(r.toggle); if(b) b.click(); render(); });
	});
	render();

	var sel = document.getElementById('lang-select');
	// Only re-freeze while the gate is still up — after Play, freezing would pause the
	// global timeline for good and every later scene would stay at opacity 0 (blank stage).
	if (sel) sel.addEventListener('change', function () { if (done) return; render(); freeze(); });

	function gateKeys(e) {
		if (done) return;
		var tag = (e.target && e.target.tagName || '').toLowerCase();
		if (tag === 'select' || tag === 'input' || tag === 'textarea') return;
		if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'].indexOf(e.key) >= 0) { e.preventDefault(); e.stopPropagation(); }
	}
	document.addEventListener('keydown', gateKeys, true);

	var done = false;
	function start() {
		if (done) return; done = true;
		document.removeEventListener('keydown', gateKeys, true);
		document.body.classList.remove('aw-prestart');
		card.classList.add('aw-hide');
		setTimeout(function () { if (card.parentNode) card.parentNode.removeChild(card); if (style.parentNode) style.parentNode.removeChild(style); }, 420);
		setTimeout(function () {
			try { if (window.gsap && gsap.globalTimeline) gsap.globalTimeline.play(); } catch (_) {}
			stage.style.opacity = '1';
			try { if (typeof interruptAnimation === 'function') interruptAnimation(); } catch (_) {}
			try { if (typeof renderStep === 'function') renderStep(typeof current === 'number' && current >= 0 ? current : 0); } catch (_) {}
		}, 380);
	}
	startBtn.addEventListener('click', start);
}());
</script>
