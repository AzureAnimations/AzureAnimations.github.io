<!DOCTYPE html>
<!-- Design concept B · "Bento" — a mosaic of tiles sized by importance, with phase filters. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>The AI Agent Journey — Bento (design B)</title>
<link rel="icon" href="../../../img/favicon.png" />
<link rel="stylesheet" href="https://unpkg.com/@microsoft/atlas-css/dist/index.css" />
<script src="../../../lib/js/aw-theme.js"></script>
<style>
	:root { --p0:#8a5cd0; --p1:#0078d4; --p2:#00a2ad; --p3:#d24aa8; }
	body.theme-dark { --p0:#b896ee; --p1:#5cb0ff; --p2:#3fd4dc; --p3:#f07cc8; }
	html, body { margin:0; }
	body { min-height:100vh; font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; color:var(--theme-text); background:var(--theme-body-background); }
	.top { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0.8rem 1.6rem; border-bottom:1px solid var(--theme-border); }
	.top .brand { display:flex; align-items:center; gap:0.55rem; text-decoration:none; font-weight:600; color:inherit; }
	.top .brand img { width:28px; height:28px; }
	.theme-toggle { width:2.3rem; height:2.3rem; border-radius:999px; border:1px solid var(--theme-border); background:transparent; color:var(--theme-text); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
	.theme-toggle .ico { display:none; } .theme-toggle[data-theme="dark"] .sun { display:block; } .theme-toggle[data-theme="light"] .moon { display:block; }

	.wrap { max-width:1240px; margin:0 auto; padding:2.6rem 1.6rem 4rem; }
	.head { display:flex; justify-content:space-between; align-items:flex-end; gap:2rem; flex-wrap:wrap; margin-bottom:1.6rem; }
	.head h1 { margin:0; font-size:clamp(2.2rem,4.5vw,3.3rem); font-weight:700; line-height:1.05; }
	.head p { margin:0.6rem 0 0; max-width:48ch; font-size:1.08rem; line-height:1.55; color:var(--theme-text-subtle); }
	.filters { display:flex; gap:0.5rem; flex-wrap:wrap; }
	.filters button { font:inherit; font-size:0.9rem; font-weight:600; padding:0.45rem 0.95rem; border-radius:999px; cursor:pointer;
		border:2px solid var(--c,var(--theme-border)); color:var(--c,var(--theme-text)); background:transparent; }
	.filters button[aria-pressed="true"] { background:var(--c,var(--theme-text)); color:var(--theme-body-background); }

	.bento { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:190px; gap:1rem; }
	.tile { position:relative; overflow:hidden; border-radius:20px; text-decoration:none; color:inherit; display:flex; flex-direction:column; justify-content:flex-end;
		background:color-mix(in srgb,var(--c) 12%,var(--theme-card-background,#fff)); border:2px solid var(--c);
		box-shadow:0 10px 26px rgba(0,0,0,0.1); transition:transform .2s ease, box-shadow .2s ease, opacity .25s ease, filter .25s ease; }
	body.theme-dark .tile { background:color-mix(in srgb,var(--c) 14%,#22232b); }
	.tile:hover { transform:translateY(-4px); box-shadow:0 18px 40px color-mix(in srgb,var(--c) 32%,transparent); }
	.tile.dim { opacity:0.25; filter:grayscale(0.7); }
	.tile.w2 { grid-column:span 2; } .tile.h2 { grid-row:span 2; }
	.tile .bg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
	.tile .bg img.cover { width:100%; height:100%; object-fit:cover; opacity:0.9; }
	.tile .bg img.icon { width:76px; height:76px; margin-bottom:3.4rem; }
	.tile.h2 .bg img.icon { width:120px; height:120px; }
	.tile .bg .glyph { font-size:4rem; margin-bottom:3.4rem; }
	.tile.h2 .bg .glyph { font-size:7rem; }
	.tile.w2:not(.h2) .bg { justify-content:flex-end; align-items:flex-start; }
	.tile.w2:not(.h2) .bg .glyph, .tile.w2:not(.h2) .bg img.icon { margin:0.9rem 1.6rem 0 0; font-size:3.4rem; }
	.tile .num { position:absolute; top:0.7rem; left:0.9rem; font-size:2.1rem; font-weight:700; line-height:1; color:var(--c); opacity:0.9; }
	.tile:has(img.cover) .num { opacity:1; font-size:1.5rem; padding:0.25rem 0.55rem; border-radius:10px; background:var(--theme-card-background,#fff); border:2px solid var(--c); }
	body.theme-dark .tile:has(img.cover) .num { background:#22232b; }
	.tile .info { position:relative; padding:0.8rem 1rem 0.9rem; background:var(--theme-card-background,#fff); border-top:2px solid var(--c); }
	body.theme-dark .tile .info { background:#22232b; }
	.tile .k { font-size:0.75rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--c); }
	.tile h3 { margin:0.15rem 0 0; font-size:1.05rem; font-weight:700; line-height:1.25; }
	.tile p { margin:0.3rem 0 0; font-size:0.9rem; line-height:1.45; color:var(--theme-text-subtle); }
	.tile:not(.h2):not(.w2) p { display:none; }
	.tile.cert { justify-content:center; align-items:flex-start; padding:1.4rem; background:var(--c); border-color:var(--c); color:#fff; }
	.tile.cert h3 { font-size:1.4rem; } .tile.cert p { color:rgba(255,255,255,0.9); display:block; } .tile.cert .k { color:rgba(255,255,255,0.85); }

	@media (max-width:900px) { .bento { grid-template-columns:repeat(2,1fr); } .tile.w2 { grid-column:span 2; } }
	@media (max-width:560px) { .bento { grid-template-columns:1fr; } .tile.w2 { grid-column:auto; } .tile.h2 { grid-row:auto; } }
</style>
</head>
<body class="theme-dark" data-theme-preset="atlas">
	<header class="top">
		<a class="brand" href="index.html"><img src="../../../img/AzureAnimations-Logo.svg" alt="" /><span>AI Agents · Microsoft Foundry</span></a>
		<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">
			<svg class="ico moon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
			<svg class="ico sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>
		</button>
	</header>
	<div class="wrap">
		<div class="head">
			<div><h1>Build your first AI agent</h1><p>Ten animated explainers, from Foundry basics to responsible AI. Start anywhere — or filter by stage.</p></div>
			<div class="filters" id="filters" role="group" aria-label="Filter by stage"></div>
		</div>
		<main class="bento" id="bento"></main>
	</div>
<script>
const AI='../../../lib/icons/Azure_Public_Service_Icons/ai + machine learning/';
const PHASES=[['Get started','--p0'],['Build agents','--p1'],['Apply AI services','--p2'],['Govern & choose','--p3']];
// size: w2 = two columns wide, h2 = two rows tall (the hero tile)
const STOPS=[
	{href:'FoundryHubProject.html',kicker:'Foundation · optional',title:'Foundry Hub vs Project',desc:'How hubs and projects organize work and share resources.',img:'../../../images/animations-480thumbnails/ms-foundry-hub-project_thumbnail.gif',ph:0,size:'w2'},
	{href:'FoundryNew.html',kicker:'Orientation',title:'Foundry New Experience',desc:'Tour the redesigned Foundry.',img:'../../../images/foundry-new-summary.png',ph:0},
	{href:'ModelDeployment.html',kicker:'Build',title:'Model Deployment vs Agent',desc:'Deploy a model or compose an agent.',img:'../../../images/animations-480thumbnails/Azure%20OpenAI%20-%20AI%20Foundry%20Studio_Provisioning_and_Deployment_Creation_-_thumbnail.gif',ph:1},
	{href:'WhatMakesAnAgent.html',kicker:'Ship',title:'What Makes an Agent',desc:'Model, instructions, tools and memory — the anatomy of an AI agent, assembled piece by piece.',glyph:'🤖',ph:1,size:'w2 h2'},
	{href:'AgentTextAnalysis.html',kicker:'Apply',title:'Text Analysis',desc:'Azure Language over SDK, REST and MCP.',icon:AI+'02876-icon-service-Language.svg',ph:2},
	{href:'AgentSpeech.html',kicker:'Apply',title:'Talking Apps',desc:'Azure AI Speech and Voice Live.',icon:AI+'00797-icon-service-Speech-Services.svg',ph:2},
	{href:'AgentVision.html',kicker:'Apply',title:'AI Vision',desc:'Analyze and generate images and video.',icon:AI+'00792-icon-service-Computer-Vision.svg',ph:2},
	{href:'AgentContentUnderstanding.html',kicker:'Apply',title:'Content Understanding',desc:'Documents, audio and video to JSON.',icon:AI+'00819-icon-service-Form-Recognizers.svg',ph:2},
	{href:'ResponsibleAI.html',kicker:'Govern',title:'Six Pillars of Responsible AI',desc:'What each pillar means, and what goes wrong without it.',glyph:'🛡️',ph:3,size:'w2'},
	{href:'ChoosingYourSdk.html',kicker:'Build',title:'Choosing Your AI SDK',desc:'OpenAI SDK, Foundry SDK or Agent Framework.',glyph:'🧩',ph:3}
];
const bento=document.getElementById('bento'), filters=document.getElementById('filters');
STOPS.forEach((s,i)=>{
	const a=document.createElement('a'); a.className='tile '+(s.size||''); a.href=s.href; a.target='_blank'; a.rel='noopener noreferrer'; a.dataset.ph=s.ph;
	a.style.setProperty('--c',`var(${PHASES[s.ph][1]})`);
	const m=s.img?`<img class="cover" src="${s.img}" alt="" loading="lazy">`:s.icon?`<img class="icon" src="${s.icon}" alt="">`:`<span class="glyph">${s.glyph}</span>`;
	a.innerHTML=`<div class="bg">${m}</div><span class="num">${String(i+1).padStart(2,'0')}</span><div class="info"><span class="k">${s.kicker}</span><h3>${s.title}</h3><p>${s.desc}</p></div>`;
	bento.appendChild(a);
});
const cert=document.createElement('a'); cert.className='tile cert'; cert.href='index.html#certifications'; cert.style.setProperty('--c','var(--p1)');
cert.innerHTML='<span class="k">Finish line</span><h3>🏆 Get AI certified</h3><p>The journey maps to AI-901 and the Azure AI Apps &amp; Agents Developer certification.</p>';
bento.appendChild(cert);
let active=null;
const btns=[['All',null,null],...PHASES.map(([n,v],i)=>[n,v,i])].map(([n,v,i])=>{
	const b=document.createElement('button'); b.type='button'; b.textContent=n; if(v) b.style.setProperty('--c',`var(${v})`);
	b.addEventListener('click',()=>{ active=i; sync(); }); filters.appendChild(b); return [b,i]; });
function sync(){ btns.forEach(([b,i])=>b.setAttribute('aria-pressed',i===active?'true':'false'));
	bento.querySelectorAll('.tile[data-ph]').forEach(t=>t.classList.toggle('dim', active!==null && +t.dataset.ph!==active)); }
sync();
</script>
</body>
</html>
