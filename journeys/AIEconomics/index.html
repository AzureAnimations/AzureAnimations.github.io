	<script>
	(function () {
		var ids = ["hero","why","journey","concepts","scenarios","outcomes","check","done"], labels = ["Start","Why it matters","Learning journey","Key concepts","Scenarios","Outcomes","Knowledge check","Finish"];
		var nav = document.createElement("nav"); nav.className = "snapdots"; nav.setAttribute("aria-label", "Jump to section");
		nav.innerHTML = ids.map(function (id, n) { return `<a href="#${id}" aria-label="${labels[n]}" title="${labels[n]}"></a>`; }).join("");
		document.body.appendChild(nav);
		// One wheel gesture glides to the next or previous section. Tall sections scroll normally until their edge, and touch or keyboard use the CSS snap.
		var mq = window.matchMedia("(min-width:901px) and (min-height:520px)"), busy = false, hdr = 76, secs = ids.map(function (id) { return document.getElementById(id); });
		function current() { var best = 0, bd = 1e9; secs.forEach(function (s, n) { var d = Math.abs(s.getBoundingClientRect().top - hdr); if (d < bd) { bd = d; best = n; } }); return best; }
		window.addEventListener("wheel", function (e) {
			if (!mq.matches || e.ctrlKey || e.deltaMode > 1 || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
			if (e.target.closest && e.target.closest("input,textarea,select,[role=slider]")) return;
			var sc = e.target.closest && e.target.closest(".detail"); if (sc && sc.scrollHeight > sc.clientHeight + 2) { var atEnd = e.deltaY > 0 ? sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2 : sc.scrollTop <= 0; if (!atEnd) return; }
			if (busy) { e.preventDefault(); return; }
			var c = current(), r = secs[c].getBoundingClientRect(), down = e.deltaY > 0;
			if (down && r.bottom > innerHeight + 8) return;
			if (!down && r.top < hdr - 30) return;
			var n = c + (down ? 1 : -1);
			if (n < 0 || n >= secs.length) return;
			e.preventDefault(); busy = true; secs[n].scrollIntoView({ behavior: "smooth", block: "start" });
			setTimeout(function () { busy = false; }, 750);
		}, { passive: false });
		if (!("IntersectionObserver" in window)) return;
		var dots = nav.querySelectorAll("a");
		var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) dots.forEach(function (a, n) { a.classList.toggle("on", ids[n] === e.target.id); }); }); }, { rootMargin: "-45% 0px -45% 0px" });
		ids.forEach(function (id) { var s = document.getElementById(id); if (s) io.observe(s); });
	}());
