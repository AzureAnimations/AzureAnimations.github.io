<!DOCTYPE html>
<!--
	Azure Animations — main home page ("the office"): one room per team, each opening that team's journeys.
	Built on lib/js/aw-office.js (chrome, popover, directory, footer), lib/js/aw-office-art.js (workers, logos) and the generated
	lib/js/aw-office-data.js (journey names / hrefs / translations, extracted from the journey catalogue: node scripts/build-office-data.mjs).
	The journeys are grouped by team in ZONES inside aw-office.js. Hubs are the original journeys/<Hub>/index.html pages.
	Other home-page designs are archived under private names (see scripts/office-designs.json) and are not published.
-->

<style>
/* ===== Home page: a cozy "management game" floor plan ===== */
#ao-scene { width:100%; }
.ao-top--center .ao-scene-wrap { width:100%; max-width:1320px; }
#ao-scene svg.d3 { display:block; width:100%; height:auto; overflow:visible; }

/* ===== Dark theme = the dark-grey palette of _template-sandy.html (same as _TEMPLATE-DOCK.html) =====
   Page-scoped: the shared lib/css/aw-office.css keeps its navy dark theme for the archived designs. */
.ao-body.theme-dark { --ao-bg:#1e2023; --ao-bg2:#292c30; --ao-ink:#e9ebee; --ao-mute:#a8aeb6; --ao-card:#33363b; --ao-line:#4b4f56;
	--ao-link:#dfe2e6; --ao-shadow:0 18px 44px rgba(0,0,0,.5); --ao-pop:#33363b; --ao-btn:#5a5f67;
	--cert-surface:#292c30; --cert-ink:#e9ebee; --cert-line:#4b4f56; --cert-button:#dfe2e6; --cert-button-hover:#ffffff; --cert-button-ink:#1e2023; --cert-focus:#dfe2e6;
	background:var(--ao-bg); }
.ao-body.theme-dark .ao-btn.primary { background:#dfe2e6; border-color:#dfe2e6; color:#1e2023; }
/* the floor plan follows: neutral greys instead of navy */
/* tour card, Support popover and other shared widgets read the --theme-* tokens, so point them at this page's palette */
body.ao-body[data-theme-preset].theme-light { --theme-text:#1c2742; --theme-body-text:#1c2742; --theme-text-subtle:#4a5470; --theme-card-background:#fffdf8; --theme-border:#ddd3bf; --theme-body-background:#f6f1e7; }
body.ao-body[data-theme-preset].theme-dark { --theme-text:#e9ebee; --theme-body-text:#e9ebee; --theme-text-subtle:#c4c9d1; --theme-card-background:#292c30; --theme-border:#4b4f56; --theme-body-background:#1e2023; }
body.theme-dark .awt-card { background:#292c30; }
.ao-body.theme-dark .d3 { --paper:#24272b; --hall:#26292d; --hall-ln:#31353a; --wall:#4a4f58; --wall-edge:#141517; --ln:#0c0d0f; --tile:rgba(255,255,255,.05);
	--chair:#596070; --rack:#353a43; --rack-2:#24282e; --metal:#868d9b; --metal-d:#575e6c; }
.ao-body.theme-dark .d3 .floor { fill:color-mix(in srgb, var(--zc) 20%, #1d1f22); }
.ao-body.theme-dark .d3 .legend-t { fill:#c4c9d1; }

/* ===== Header: the original home layout (headline + lead left, stats right), then the certification strip ===== */
body { --cert-surface:#f6f8fc; --cert-ink:#192b44; --cert-line:#b4c2d5; --cert-button:#075cac; --cert-button-hover:#044b90; --cert-button-ink:#fff; --cert-focus:#075cac; }
body.theme-dark { --cert-surface:#2b3039; --cert-ink:#edf3fb; --cert-line:#66758a; --cert-button:#78bdff; --cert-button-hover:#a0d1ff; --cert-button-ink:#122338; --cert-focus:#9ccfff; }
.ao-head { display:flex; align-items:flex-end; justify-content:space-between; gap:2rem; max-width:1500px; margin:0 auto; padding:1.3rem 1.6rem .3rem; }
.ao-head .ao-h1 { margin:0; font-size:clamp(2rem,3.4vw,2.95rem); line-height:1.08; font-weight:700; letter-spacing:0; max-width:none; text-wrap:balance; }
.ao-head .ao-h1 .grad-b { background:linear-gradient(90deg,var(--grad-2),var(--grad-3)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.ao-head .ao-lead { margin:.45rem 0 0; font-size:1.28rem; line-height:1.45; max-width:74ch; color:inherit; opacity:.82; }
.ao-head .ao-facts { flex:none; display:flex; gap:1.7rem; margin:0; padding:0; border:0; background:none; box-shadow:none; }
.ao-head .ao-facts li { display:flex; flex-direction:column; text-align:right; padding:0; }
.ao-head .ao-facts b { font-size:2.15rem; font-weight:700; line-height:1.1; }
.ao-head .ao-facts span { font-size:1.02rem; opacity:.72; text-transform:none; letter-spacing:0; }
:lang(ja) .ao-head .ao-h1, :lang(ja) .ao-head .ao-lead { word-break:auto-phrase; }
:lang(ko) .ao-head .ao-h1, :lang(ko) .ao-head .ao-lead { word-break:keep-all; }
.ao-cert--flat { padding-top:.7rem; padding-bottom:0; }
.ao-cert--flat .ao-cert-in { display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:1rem; padding:.85rem 1.15rem; border-radius:0; border:0; border-block:2px solid var(--cert-line);
	background:var(--cert-surface); color:var(--cert-ink); box-shadow:none; }
.ao-cert--flat .ao-cert-in img { width:56px; height:56px; padding:4px; background:#fff; border-radius:6px; filter:none; }
.ao-cert--flat .ao-cert-in h2 { font-size:1.3rem; font-weight:600; letter-spacing:0; }
.ao-cert--flat .ao-cert-in p { margin:.2rem 0 0; font-size:1.02rem; line-height:1.4; color:inherit; }
.ao-cert--flat .ao-btn.primary { min-height:44px; padding:.65rem 1rem; border-radius:6px; border:0; background:var(--cert-button); color:var(--cert-button-ink); font-size:1.02rem; font-weight:600; box-shadow:none; }
.ao-cert--flat .ao-btn.primary:hover { background:var(--cert-button-hover); }
.ao-stage { padding-top:.9rem; gap:.7rem; align-items:stretch; }
.ao-stage .ao-hint { align-self:flex-start; margin:0; padding:0; border:0; background:none; font-size:.98rem; color:var(--ao-mute); }
.ao-stage .ao-scene-wrap { align-self:center; }
/* Support heart: red and beating, as on the original home page */
.ao-body .aw-like .aw-like-heart { filter:none; opacity:1; font-size:1.15rem; animation:awHeartBeat 3.2s ease-in-out infinite; transform-origin:center; }
.ao-body .aw-like:hover .aw-like-heart { animation-duration:.9s; }
.ao-body .aw-like:not(.is-liked):not(:hover) { animation:awLikeGlow 3.2s ease-in-out infinite; }
.ao-body .aw-like.is-liked { border-color:var(--grad-3); color:var(--grad-3); background:color-mix(in srgb, var(--grad-3) 12%, transparent); }
.aw-like-top { --nudge-a:var(--grad-2); --nudge-b:var(--grad-3); }
/* tour stop 12 spotlights the heart: keep its "Tap to show love" caption lit above the veil */
body.awt-on .aw-like-top:has(.awt-spot) .like-nudge { opacity:1 !important; z-index:61; }
/* The "Tap to show love" caption floats continuously. It is a tiny, slow cue, so it stays on even when the OS asks for reduced motion
   (the shared stylesheet otherwise freezes every animation, which made the caption look static). */
.ao-body .like-nudge { animation:awNudgeFloat 1.4s ease-in-out infinite !important; }
.ao-body .aw-like:not(.is-liked) .aw-like-heart { animation:awHeartBeat 3.2s ease-in-out infinite !important; }
.ao-body .ao-btn.ao-tour:not(.on) { animation:aoTourGlow 2.4s ease-in-out infinite !important; }
@keyframes awNudgeFloat { 0%,100% { transform:translate(-50%,3px) scale(1); } 50% { transform:translate(-50%,-7px) scale(1.07); } }
/* "Show love" highlight: a ripple ring pulses out of the Support button and little hearts drift up from it until it has been tapped */
.ao-body .aw-like-top { position:relative; }
.ao-body .aw-like { position:relative; }
.ao-body .aw-like:not(.is-liked)::after { content:''; position:absolute; inset:-3px; border-radius:inherit; border:2px solid var(--grad-3); pointer-events:none;
	animation:awRipple 2s ease-out infinite !important; }
.ao-body .aw-like-top:not(:has(.is-liked))::before, .ao-body .aw-like-top:not(:has(.is-liked))::after { content:'\2764\FE0F'; position:absolute; left:26px; top:6px; z-index:6; pointer-events:none;
	font-size:.95rem; opacity:0; animation:awHeartRise 3s ease-in infinite !important; }
.ao-body .aw-like-top:not(:has(.is-liked))::after { left:44px; font-size:.75rem; animation-delay:1.5s !important; }
.ao-body .aw-like-top:hover::before, .ao-body .aw-like-top:hover::after { display:none; }
@keyframes awRipple { 0% { transform:scale(1); opacity:.9; } 100% { transform:scale(1.28,1.7); opacity:0; } }
@keyframes awHeartRise { 0% { transform:translate(0,0) scale(.6); opacity:0; } 15% { opacity:1; } 100% { transform:translate(8px,-26px) scale(1.15); opacity:0; } }
@keyframes awHeartBeat { 0%,70%,100% { transform:scale(1); } 74% { transform:scale(1.24); } 80% { transform:scale(1.04); } 86% { transform:scale(1.16); } }
@keyframes awLikeGlow { 0%,100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--grad-3) 0%, transparent); }
	55% { box-shadow:0 0 0 7px color-mix(in srgb, var(--grad-3) 15%, transparent), 0 6px 18px color-mix(in srgb, var(--grad-2) 20%, transparent); } }
@media (max-width:1000px) {
	.ao-head { flex-direction:column; align-items:flex-start; padding:1rem 1rem .3rem; gap:1rem; }
	.ao-head .ao-facts li { text-align:left; }
}
@media (max-width:620px) { .ao-cert--flat .ao-cert-in { grid-template-columns:48px minmax(0,1fr); } .ao-cert--flat .ao-btn.primary { grid-column:1 / -1; } }

/* palette (light) */
.d3 { --paper:#fbf3e2; --hall:#f6ecd8; --hall-ln:#e8dabb; --wall:#fffaf0; --wall-edge:#cbbb98; --ln:#6b5a48; --tile:rgba(255,255,255,.55);
	--desk:#dba66c; --desk-hi:#ecc08a; --chair:#8b93b4; --metal:#d3d9e6; --metal-d:#9aa3bb; --rack:#444c66; --rack-2:#2f3550; --screen:#26304a;
	--page:#fffdf6; --leaf:#58b977; --leaf-2:#3a9a5c; --pot:#e08b60; --shd:rgba(70,50,20,.17); --board:#2f7a62; --wood:#b7824f; --chalk:#f4f7ee;
	--wb:#ffffff; --win:#bfe6ff; --win-glow:transparent; --robot:#f4fbff; --sea:#7ec8ee; --land:#79c58a; --cloud:#ffffff; --db:#ffe1c4;
	--glass:#8fd0ff; --rug:rgba(255,255,255,.42); --lamp:0; --glowfx:none; --sign-ink:#2a1d12; --pkg:#d9a066; --vault:#aeb7cc; }
body.theme-dark .d3 { --paper:#171f3c; --hall:#1a2342; --hall-ln:#222d55; --wall:#3a4572; --wall-edge:#0f1530; --ln:#0b1022; --tile:rgba(255,255,255,.055);
	--desk:#8a6a4e; --desk-hi:#a68062; --chair:#4a5380; --metal:#7b86a8; --metal-d:#4e5878; --rack:#2a3252; --rack-2:#1b2142; --screen:#0f2a44;
	--page:#e8e4d6; --leaf:#3f9a62; --leaf-2:#2b7a4a; --pot:#b86a48; --shd:rgba(0,0,0,.38); --board:#1c4a40; --wood:#7d5a3a; --chalk:#e8efe0;
	--wb:#e9edf8; --win:#ffcf70; --win-glow:rgba(255,196,90,.85); --robot:#dff1ff; --sea:#3b7fb0; --land:#4aa66a; --cloud:#e9efff; --db:#e8c9a8;
	--glass:#9fe0ff; --rug:rgba(255,255,255,.08); --lamp:1; --glowfx:drop-shadow(0 0 5px rgba(120,200,255,.7)); --pkg:#b98550; --vault:#6c7799; }

/* generic shapes */
.d3 .ln { stroke:var(--ln); stroke-width:1.7; stroke-linejoin:round; stroke-linecap:round; }
.d3 .desk { fill:var(--desk); } .d3 .deskhi { fill:var(--desk-hi); } .d3 .chair { fill:var(--chair); }
.d3 .metal { fill:var(--metal); } .d3 .metal2 { fill:var(--metal-d); }
.d3 .rack { fill:var(--rack); } .d3 .rack2 { fill:var(--rack-2); } .d3 .screen { fill:var(--screen); }
.d3 .paper { fill:var(--page); } .d3 .leaf { fill:var(--leaf); } .d3 .leaf2 { fill:var(--leaf-2); } .d3 .pot { fill:var(--pot); }
.d3 .shd { fill:var(--shd); } .d3 .wood { fill:var(--wood); } .d3 .robot { fill:var(--robot); } .d3 .wb { fill:var(--wb); }
.d3 .zc { fill:var(--zc); } .d3 .zcs { fill:color-mix(in srgb, var(--zc) 40%, var(--paper)); }
.d3 .rug { fill:color-mix(in srgb, var(--zc) 30%, var(--paper)); opacity:.85; }
.d3 .glass { fill:var(--glass); }
.d3 .lg { fill:#3ddc84; } .d3 .la { fill:#ffb020; } .d3 .lr { fill:#ff5d5d; } .d3 .lb { fill:#4fc3ff; }
.d3 .chalk { fill:var(--chalk); font:700 14px 'Segoe UI',sans-serif; }
.d3 .chalk-s { fill:none; stroke:var(--chalk); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; opacity:.9; }
.d3 .logo-dot { fill:var(--glass); }
.d3-lamp { opacity:var(--lamp); pointer-events:none; }
.d3 .glowy { filter:var(--glowfx); }

/* building, hall, rooms */
.d3 .bld-shadow { fill:rgba(60,40,10,.16); }
body.theme-dark .d3 .bld-shadow { fill:rgba(0,0,0,.45); }
.d3 .bld { fill:var(--hall); stroke:var(--wall-edge); stroke-width:16; }
.d3 .bld-in { fill:none; stroke:var(--wall); stroke-width:9; }
.d3 .hall-tiles { fill:url(#d3-hall); }
.d3 .runner { fill:color-mix(in srgb, #e6a64a 17%, var(--hall)); }
.d3 .runner-ln { fill:none; stroke:color-mix(in srgb, #e6a64a 40%, var(--hall)); stroke-width:2; stroke-dasharray:3 6; stroke-linecap:round; }
.d3 .floor { fill:color-mix(in srgb, var(--zc) 24%, var(--paper)); }
body.theme-dark .d3 .floor { fill:color-mix(in srgb, var(--zc) 22%, #151c38); }
.d3 .tile { fill:none; stroke:var(--tile); stroke-width:1.2; }
.d3 .chk { fill:var(--tile); opacity:.8; }
.d3 .wall-e { fill:none; stroke:var(--wall-edge); stroke-width:16; stroke-linejoin:round; stroke-linecap:round; }
.d3 .wall { fill:none; stroke:var(--wall); stroke-width:9; stroke-linejoin:round; stroke-linecap:round; }
.d3 .mat { fill:color-mix(in srgb, var(--zc) 55%, var(--paper)); stroke:var(--ln); stroke-width:1.4; opacity:.9; }
.d3 .win { fill:var(--win); stroke:var(--ln); stroke-width:1.4; filter:drop-shadow(0 0 4px var(--win-glow)); }
.d3 .sign { fill:color-mix(in srgb, var(--zc) 76%, #2a1d12); stroke:color-mix(in srgb, var(--zc) 40%, #1b1208); stroke-width:1.8; }
body.theme-dark .d3 .sign { fill:color-mix(in srgb, var(--zc) 78%, #0b1022); }
.d3 .sign-t { fill:#fff; font-family:'Segoe UI',sans-serif; font-weight:700; text-anchor:middle; }
.d3 .boardf { fill:var(--board); stroke:var(--wood); stroke-width:4; }
.d3 .pill { fill:#f2b705; stroke:#8a5d00; stroke-width:1.8; }
.d3 .pill-t { fill:#3a2600; font-family:'Segoe UI',sans-serif; font-weight:800; text-anchor:middle; }
.d3 .legend-t { fill:var(--ln); font:700 13px 'Segoe UI',sans-serif; opacity:.75; }
body.theme-dark .d3 .legend-t { fill:#c8d2f2; opacity:.7; }

.d3 .d3-room { cursor:pointer; }
.d3 .d3-lift { transition:transform .22s var(--ao-ease), filter .22s var(--ao-ease); transform-box:fill-box; transform-origin:center; }
.d3 .d3-room.is-active .d3-lift { transform:scale(1.014); filter:drop-shadow(0 10px 14px color-mix(in srgb, var(--zc) 55%, transparent)); }
.d3 .d3-room.is-active .floor { filter:brightness(1.07) saturate(1.1); }
body.theme-dark .d3 .d3-room.is-active .floor { filter:brightness(1.35) saturate(1.15); }
.d3 .d3-room.is-active .sign { filter:brightness(1.1); }

/* motion */
.d3 .d3-bob { animation:d3Bob 2.6s ease-in-out infinite; }
.d3 .d3-fl { animation:aoFloat 3.6s ease-in-out infinite; }
.d3 .d3-spin { animation:d3Spin 16s linear infinite; transform-box:fill-box; transform-origin:center; }
.d3 .d3-spin-r { animation:d3Spin 24s linear infinite reverse; transform-box:fill-box; transform-origin:center; }
.d3 .d3-dash { stroke-dasharray:5 5; animation:d3Dash .9s linear infinite; }
.d3 .d3-flow { stroke-dasharray:6 8; animation:d3Dash 1.1s linear infinite; }
.d3 .d3-wave { animation:d3Wave .9s ease-in-out infinite; transform-box:fill-box; transform-origin:20% 15%; }
.d3 .d3-mer { animation:d3Mer 4.5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center; }
.d3 .d3-glowp { animation:d3Glow 2.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
.d3 .d3-slide { animation:d3Slide 7s ease-in-out infinite alternate; }
.d3 .d3-arrow { animation:d3Arrow 1.1s ease-in-out infinite; }
.d3 .d3-pk { animation:d3Pk 1.9s linear infinite; }
.d3 .d3-pk.first { animation-name:d3PkIn; } .d3 .d3-pk.last { animation-name:d3PkOut; }
@keyframes d3Bob { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-3px);} }
@keyframes d3Spin { to { transform:rotate(360deg);} }
@keyframes d3Dash { to { stroke-dashoffset:-20; } }
@keyframes d3Wave { 0%,100%{ transform:rotate(0);} 50%{ transform:rotate(-28deg);} }
@keyframes d3Mer { from{ transform:scaleX(1);} to{ transform:scaleX(.25);} }
@keyframes d3Glow { 0%,100%{ transform:scale(1); opacity:.5;} 50%{ transform:scale(1.14); opacity:.9;} }
@keyframes d3Slide { 0%,35%{ transform:translateX(0);} 65%,100%{ transform:translateX(52px);} }
@keyframes d3Arrow { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-7px);} }
@keyframes d3Pk { from{ transform:translateX(0);} to{ transform:translateX(34px);} }
@keyframes d3PkIn { from{ transform:translateX(0); opacity:0;} to{ transform:translateX(34px); opacity:1;} }
@keyframes d3PkOut { from{ transform:translateX(0); opacity:1;} to{ transform:translateX(34px); opacity:0;} }
.d3 .walkers { pointer-events:none; }

@media (max-width:640px) { .ao-top--center .ao-scene-wrap { margin:0 -.4rem; width:calc(100% + .8rem); } }
</style>

			s += g(tr(0, 0), rect(78, 150, 42, 15, 2.5, '', 'fill:#ff9eb5;stroke:var(--ln);stroke-width:1.2') + rect(82, 155, 22, 2.4, 1.2, '', 'fill:rgba(0,0,0,.35)'), 'd3-slide');
			// infinity badge
			s += g(tr(214, 144), circ(0, 0, 26, 'paper ln') + g('scale(1.35)', path('M0 0C5 -9 14 -9 14 0C14 9 5 9 0 0C-5 -9 -14 -9 -14 0C-14 9 -5 9 0 0Z', '', 'fill:none;stroke:#2da44e;stroke-width:3;stroke-linejoin:round') +
				'<path d="M0 0C5 -9 14 -9 14 0C14 9 5 9 0 0C-5 -9 -14 -9 -14 0C-14 9 -5 9 0 0Z" pathLength="100" class="d3-flow" style="fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:4 21;stroke-linecap:round"/>'));
			return s;
		}
	};

	/* ---------- one room ---------- */
	function floorTiles(kind) {
		var d = '', i, j;
		if (kind === 'planks') {
			for (i = 18, j = 0; i < H; i += 18, j++) { d += 'M0 ' + i + 'H' + W; }
			for (j = 0, i = 0; i < H; i += 18, j++) { for (var x = (j % 2 ? 30 : 75); x < W; x += 90) d += 'M' + x + ' ' + i + 'v18'; }
			return path(d, 'tile');
		}
		if (kind === 'checker') {
			for (i = 0; i < H / 26; i++) for (j = 0; j < W / 26; j++) if ((i + j) % 2) d += 'M' + (j * 26) + ' ' + (i * 26) + 'h26v26h-26z';
			return path(d, 'chk');
		}
		for (i = 25; i < W; i += 25) d += 'M' + i + ' 0V' + H;
		for (i = 25; i < H; i += 25) d += 'M0 ' + i + 'H' + W;
		return path(d, 'tile');
	}
	function sign(name, y, extra) {
		var fs = 17, tw = measure(name, fs), maxW = 192;
		if (tw > maxW) { fs = Math.max(11, Math.floor(fs * maxW / tw * 10) / 10); tw = measure(name, fs); }
		var w = Math.round(Math.max(112, Math.min(216, tw + 38)));
		var s = rect(2, 3, w, 30, 10, '', 'fill:rgba(0,0,0,.2)') + rect(0, 0, w, 30, 10, 'sign') + rect(4, 3, w - 8, 5, 2.5, '', 'fill:rgba(255,255,255,.26)') +
			text(w / 2, 21, '', 'sign-t', 'font-size:' + fs + 'px').replace('></text>', '>' + name + '</text>');
		return g(tr(125 - w / 2, y), s + (extra ? extra(w) : ''));
	}
	function room(r, api) {
		var z = api.zone(r.id), c = api.color(r.id), top = r.row === 0;
		var x1 = W / 2 - DOOR / 2, x2 = W / 2 + DOOR / 2;
		var wallD = top ? 'M' + x1 + ' ' + H + 'L0 ' + H + 'L0 0L' + W + ' 0L' + W + ' ' + H + 'L' + x2 + ' ' + H
			: 'M' + x1 + ' 0L0 0L0 ' + H + 'L' + W + ' ' + H + 'L' + W + ' 0L' + x2 + ' 0';
		var y0 = top ? 56 : 24, signY = top ? 14 : 216;
		var wy = top ? 96 : 100;
		var win = function (x) { return rect(x - 5, wy, 10, 36, 3, 'win') + path('M' + x + ' ' + wy + 'v36', '', 'stroke:var(--ln);stroke-width:1;fill:none'); };
		var star5 = r.id === 'academy' ? function (w) {
			return g(tr(2, 2), g('', circ(0, 13, 14, 'pill') + star(0, 13, 9, '', 'fill:#fff;stroke:#8a5d00;stroke-width:1.2'), 'd3-fl'));
		} : null;
		var inner =
			'<rect class="ao-focus-ring" x="-8" y="-8" width="' + (W + 16) + '" height="' + (H + 16) + '" rx="20"/>' +
			rect(0, 0, W, H, 8, 'floor') + floorTiles(FLOOR[r.id]) +
			rect(x1 + 8, top ? H - 14 : 4, DOOR - 16, 10, 4, 'mat') +
			path(wallD, 'wall-e') + path(wallD, 'wall') + win(0) + win(W) +
			g(tr(0, y0), INTERIOR[r.id]()) + sign(z.name, signY, star5);
		return '<g class="d3-room" data-room="' + r.id + '" style="--zc:' + c + '" transform="translate(' + r.x + ' ' + r.y + ')"><g class="d3-lift">' + inner + '</g></g>';
	}

	/* ---------- hall decor + walkers ---------- */
	function hall(lang) {
		var s = '';
		s += rect(110, 330, 980, 100, 50, 'runner') + rect(118, 338, 964, 84, 44, 'runner-ln');
		// start-here marker beneath the academy door
		var label = START[lang] || START.en, fs = 15, tw = measure(label, fs);
		if (tw > 130) { fs = 12; tw = measure(label, fs); }
		var pw = Math.round(tw + 36);
		s += g('', g(tr(165, 322), path('M0 -2L-12 12H-5V22H5V12H12Z', 'pill', 'transform:rotate(0);') ) +
			g(tr(165 - pw / 2, 358), rect(0, 0, pw, 28, 14, 'pill') + text(pw / 2, 19, label, 'pill-t', 'font-size:' + fs + 'px')), '');
		// lobby rug + brand
		s += g(tr(600, 380), rect(-112, -38, 224, 76, 38, '', 'fill:color-mix(in srgb,#8b5cf6 20%,var(--hall));stroke:color-mix(in srgb,#8b5cf6 38%,var(--hall));stroke-width:2.5') +
			rect(-102, -29, 204, 58, 29, '', 'fill:none;stroke:color-mix(in srgb,#8b5cf6 38%,var(--hall));stroke-width:1.5;stroke-dasharray:3 5') +
			text(0, -3, 'AZURE', 'legend-t', 'text-anchor:middle;font-size:16px;letter-spacing:.2em;opacity:.8') + text(0, 16, 'ANIMATIONS', 'legend-t', 'text-anchor:middle;font-size:14px;letter-spacing:.12em;opacity:.8'));
		// plants in the gaps between rooms and in the corridor corners
		[310, 600, 890].forEach(function (x) { [150, 250, 560, 650].forEach(function (y) { s += plant(x, y, .85); }); });
		s += plant(50, 362, 1.05) + plant(1150, 362, 1.05) + plant(50, 418, 1.05) + plant(1150, 418, 1.05);
		return s;
	}
	function walkRoute(i, pts, speed, phase, look_) {
		var seq = pts.concat(pts.slice(0, -1).reverse()), total = 0, k, segs = [];
		for (k = 1; k < seq.length; k++) { var dx = seq[k][0] - seq[k - 1][0], dy = seq[k][1] - seq[k - 1][1], L = Math.sqrt(dx * dx + dy * dy); segs.push({ dx: dx, dy: dy, L: L }); total += L; }
		var dur = total / speed, cum = 0, mv = '0%{transform:translate(0px,0px)}', fl = '', dir = 1;
		for (k = 0; k < segs.length; k++) {
			if (segs[k].dx) dir = segs[k].dx > 0 ? 1 : -1;
			var p0 = cum / total * 100; cum += segs[k].L; var p1 = cum / total * 100;
			fl += (k ? (p0 + 0.02).toFixed(3) : '0') + '%{transform:scaleX(' + dir + ')}' + p1.toFixed(3) + '%{transform:scaleX(' + dir + ')}';
			mv += p1.toFixed(3) + '%{transform:translate(' + (seq[k + 1][0] - seq[0][0]).toFixed(1) + 'px,' + (seq[k + 1][1] - seq[0][1]).toFixed(1) + 'px)}';
		}
		var css = '@keyframes d3m' + i + '{' + mv + '}@keyframes d3f' + i + '{' + fl + '}' +
			'.d3 .d3m' + i + '{animation:d3m' + i + ' ' + dur.toFixed(1) + 's linear infinite;animation-delay:-' + (dur * phase).toFixed(1) + 's}' +
			'.d3 .d3f' + i + '{animation:d3f' + i + ' ' + dur.toFixed(1) + 's linear infinite;animation-delay:-' + (dur * phase).toFixed(1) + 's}';
		var html = g('translate(' + seq[0][0] + ' ' + seq[0][1] + ')', g('', g('', AWArt.worker(Object.assign({ x: 0, y: 0, s: 1.25, pose: 'walk' }, look_)), 'd3f' + i), 'd3m' + i));
		return { css: css, html: html };
	}

	function renderScene(api) {
		var lang = api.lang();
		var walkers = [
			walkRoute(0, [[345, 372], [1115, 372]], 46, 0.15, look(2, '#e97526', 'badge')),
			walkRoute(1, [[120, 436], [790, 436]], 40, 0.6, look(6, '#0078d4', 'none')),
			walkRoute(2, [[455, 292], [455, 404], [745, 404], [745, 490]], 36, 0.35, look(8, '#2da44e', 'glasses'))
		];
		var defs = '<defs>' +
			'<pattern id="d3-hall" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0V44M0 44H44" fill="none" stroke="var(--hall-ln)" stroke-width="1.4"/></pattern>' +
			'<radialGradient id="d3-warm"><stop offset="0" stop-color="#ffd88a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd88a" stop-opacity="0"/></radialGradient>' +
			'<radialGradient id="d3-orb" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#d9c4ff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4b27a8"/></radialGradient>' +
			'</defs>';
		var svg = '<svg class="d3 d3-map" 		viewBox="0 0 1200 760" role="group" aria-label="Azure Animations office map" xmlns="http://www.w3.org/2000/svg">' + defs +
			'<style>' + walkers.map(function (w) { return w.css; }).join('') + '</style>' +
					'<rect class="bld-shadow" x="22" y="28" width="1160" height="728" rx="32"/>' +
					'<rect class="bld" x="14" y="14" width="1172" height="732" rx="30"/>' +
					'<rect class="hall-tiles" x="14" y="14" width="1172" height="732"/>' +
					'<rect class="bld-in" x="14" y="14" width="1172" height="732" rx="30"/>' +
			hall(lang) +
			ROOMS.map(function (r) { return room(r, api); }).join('') +
			'<g class="walkers">' + walkers.map(function (w) { return w.html; }).join('') + '</g>' +
			'</svg>';
		return svg;
	}

	AWOffice.init({
		layout: 'center', design: 3, hubs: 'classic', switcher: false, likes: true, archiveLink: true, about: true, tour: true, certTop: true, head: 'classic',
		render: function (api) {
			var scene = document.getElementById('ao-scene');
			scene.innerHTML = renderScene(api);
			ROOMS.forEach(function (r) {
				var el = scene.querySelector('.d3-room[data-room="' + r.id + '"]');
				if (el) api.attach(el, r.id);
			});
		}
	});
})();
</script>
